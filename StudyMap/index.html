<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="基于 Markmap 的多学科思维导图框架">
  <title>StudyMap · 学科思维导图</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- KaTeX 必须在 Transformer.transform() 之前可用，才能让 $...$ / $$...$$ 在节点中真正生成公式 HTML。 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <strong>StudyMap</strong>
          <span>学科思维导图</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="fit-btn" class="icon-btn" type="button" title="适应画布">⌁</button>
        <button id="reset-btn" class="icon-btn" type="button" title="重置视图">↺</button>
        <label class="import-btn" title="从本地 Markdown 导入">
          导入 Markdown
          <input id="md-file" type="file" accept=".md,.markdown,text/markdown" hidden>
        </label>
        <label class="import-btn" title="选择 mind 文件夹或项目根目录">
          加载本地目录
          <input id="mind-folder" type="file" webkitdirectory directory multiple hidden>
        </label>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" aria-label="学科导航">
        <div class="sidebar-heading">
          <span>学科</span>
          <span id="subject-count" class="count">0</span>
        </div>
        <nav id="subject-list" class="subject-list"></nav>
        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span id="status-text">正在初始化…</span>
        </div>
      </aside>

      <section class="canvas-panel">
        <div class="canvas-head">
          <div>
            <div id="current-subject" class="eyebrow">—</div>
            <h1 id="current-title">正在加载</h1>
            <p id="current-description">—</p>
          </div>
          <div class="canvas-tools">
            <button id="expand-btn" type="button">展开</button>
            <button id="collapse-btn" type="button">折叠</button>
          </div>
        </div>

        <div id="map-container" class="map-container">
          <div class="map-grid"></div>
          <svg id="mindmap" aria-label="思维导图"></svg>
          <div id="loading" class="overlay-card">加载思维导图…</div>
          <div id="error" class="overlay-card error-card" hidden></div>
        </div>

        <div class="hint-bar">
          <span>滚轮缩放</span>
          <span>拖动画布</span>
          <span>点击节点展开 / 折叠</span>
        </div>
      </section>
    </main>
  </div>

  <!--
    静态部署：本项目没有后端依赖。
    HTTP/HTTPS：读取 mind/**/*.md。
    file://：使用 js/mind-data.js 的内置副本，因此双击 index.html 也能显示。
    本地目录按钮可读取真实的 mind/**/*.md 和 assets。
    Markmap 检测到数学语法后，会通过内置 KaTeX 插件按需加载公式资源。
  -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <!-- 预加载 KaTeX：Markmap 的 KaTeX Transformer 插件在 transform 阶段就需要它。 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
  <script src="js/mind-data.js"></script>
  <script src="js/mind.js"></script>
</body>
</html>
