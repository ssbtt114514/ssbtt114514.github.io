<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="ssbtt 个人主页 - 全栈爱好者、游戏设计探索者、开源精神实践者">
    <meta name="theme-color" content="#6c8dff">
    <title>ssbtt · 个人主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=20261005">
    <link rel="stylesheet" href="css/liquid-glass.css?v=20261005">
    <link rel="stylesheet" href="css/layout.css?v=20261005">
    <link rel="stylesheet" href="css/components.css?v=20261005">
    <link rel="stylesheet" href="css/animations.css?v=20261005">
    <link rel="stylesheet" href="css/themes.css?v=20261005">
    <link rel="stylesheet" href="css/responsive.css?v=20261005">
</head>
<body>

<!-- 动态莫奈背景：颜色由头像调色板驱动，动画主要使用 transform/opacity，降低重绘成本 -->
<div class="monet-background" aria-hidden="true">
    <div class="monet-orb monet-orb-1"></div>
    <div class="monet-orb monet-orb-2"></div>
    <div class="monet-orb monet-orb-3"></div>
</div>

<!-- 全局加载遮罩 -->
<div id="loading-overlay" class="loading-overlay visible" aria-hidden="false">
    <div class="loading-orb" aria-hidden="true"></div>
    <div class="loading-panel">
        <div class="loading-icon"><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i></div>
        <strong>正在准备主页</strong>
        <span id="loading-detail">初始化界面</span>
        <div class="loading-progress" aria-hidden="true"><span></span></div>
    </div>
</div>

<div class="app-wrapper">
    <div class="glass-nav">
        <div class="logo-area"><i class="fas fa-dragon"></i><span>ssbtt</span><span class="brand-subtitle">个人主页 · Material You</span></div>
        <button class="theme-toggle" id="globalThemeSwitch" type="button" aria-label="切换深色模式"><i class="fas fa-moon"></i></button>
    </div>

    <div class="page-tabs" id="pageTabs"></div>

    <div class="pages-container" id="pagesContainer"></div>

    <footer><p>© 2026 created by ssbtt</p></footer>
</div>

<!-- 全局模态框（项目详情用） -->
<div class="video-modal-overlay" id="videoModal">
    <div class="video-modal-content">
        <div class="video-modal-header"><img class="video-modal-thumb" id="modalThumb" src="" alt=""><button class="video-modal-close" id="modalClose"><i class="fas fa-times"></i></button></div>
        <div class="video-modal-body">
            <div class="video-modal-title" id="modalTitle">--</div>
            <div class="video-modal-stats" id="modalStats">--</div>
            <div class="video-modal-desc" id="modalDesc">--</div>
            <div class="video-modal-actions" id="modalActions"></div>
        </div>
    </div>
</div>

<!-- 头像长按彩蛋：黑色扩散圆 -->
<div id="easter-egg-circle"></div>

<!-- 头像长按彩蛋：全屏内嵌覆盖层 -->
<div id="easter-egg-overlay">
    <button id="easter-egg-close" title="退出"><i class="fas fa-times"></i></button>
    <iframe id="easter-egg-frame" src="about:blank" sandbox="allow-scripts allow-same-origin"></iframe>
    <div id="easter-egg-hint">长按头像触发 · 点击右上角退出</div>
</div>

<script src="config/config.js?v=20261005"></script>
<script src="config/api.js?v=20261005"></script>
<script src="js/utils.js?v=20261005"></script>
<script src="js/modules/profile.js?v=20261005"></script>
<script src="js/modules/colortheme.js?v=20261005"></script>
<script src="js/modules/skills.js?v=20261005"></script>
<script src="js/modules/games.js?v=20261005"></script>
<script src="js/modules/identity.js?v=20261005"></script>
<script src="js/modules/experience.js?v=20261005"></script>
<script src="js/modules/github.js?v=20261005"></script>
<script src="js/modules/bilibili.js?v=20261005"></script>
<script src="js/modules/contact.js?v=20261005"></script>
<script src="js/main.js?v=20261005"></script>

</body>
</html>
