<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ssbtt · 个人主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-accent: #6c8dff;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background: radial-gradient(circle at 20% 30%, #eef2f9, #cbd5e6);
            transition: background 0.5s var(--smooth-easing);
            overflow-x: hidden;
        }

        body.dark {
            background: radial-gradient(circle at 20% 30%, #0f1724, #03060c);
        }

        .glass-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            background: rgba(245, 248, 255, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            transition: background 0.4s ease;
        }

        body.dark .glass-container {
            background: rgba(18, 24, 36, 0.75);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .directory-wrapper {
            background: rgba(240, 245, 255, 0.4);
            overflow: hidden;
            max-height: 500px;
        }

        .directory-panel {
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dir-chip {
            background: rgba(0, 0, 0, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #1f2a3e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
            user-select: none;
        }

        body.dark .dir-chip {
            background: rgba(255, 255, 255, 0.08);
            color: #eef3ff;
        }

        .dir-chip:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        .dir-chip:active {
            transform: scale(0.96);
        }

        .avatar-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            animation: fadeInDown 0.8s var(--spring-easing);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: white;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(108, 141, 255, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .avatar-circle:hover {
            transform: rotate(5deg) scale(1.05);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* ========== 修复：ssbtt 文字深色模式背景块问题 ========== */
        .waste-title {
            margin-top: 15px;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2c3e66, #6c8dff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #2c3e66;
            display: inline-block;
        }

        body.dark .waste-title {
            background: linear-gradient(135deg, #eef3fc, #6c8dff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #eef3fc;
        }

        .scroll-area {
            padding: 0 24px 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.6);
        }

        body.dark .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clickable-badge {
            background: rgba(108, 141, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-decoration: none;
            color: #334155;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
        }

        body.dark .clickable-badge { 
            color: #cbd5e1; 
            background: rgba(108, 141, 255, 0.15); 
        }

        .clickable-badge:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        .game-chip {
            background: rgba(0,0,0,0.04);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-decoration: none;
            color: inherit;
            display: inline-block;
            transition: all 0.25s var(--spring-easing);
        }

        body.dark .game-chip { 
            background: rgba(255,255,255,0.05); 
        }

        .game-chip:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        #repo-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .repo-card {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            font-size: 0.85rem;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        body.dark .repo-card { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .repo-card:hover { 
            background: var(--primary-accent); 
            color: white; 
            transform: translateY(-2px);
        }

        .contact-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .contact-btn-link {
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            background: white;
            color: #1f2937;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s var(--spring-easing);
            cursor: pointer;
            display: block;
        }

        body.dark .contact-btn-link { 
            background: #1e293b; 
            color: white; 
        }

        .contact-btn-link:hover {
            background: var(--primary-accent);
            color: white;
            transform: scale(1.03);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        ::-webkit-scrollbar { 
            width: 0px; 
            background: transparent; 
        }

        @media (max-width: 480px) {
            .contact-row, #repo-container { 
                grid-template-columns: 1fr; 
            }
            .glass-container { 
                border-radius: 0; 
                min-height: 100vh; 
            }
            body { 
                padding: 0; 
            }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <div class="top-bar">
        <button class="theme-toggle" id="themeSwitch" style="background:none; border:none; font-size: 1.2rem; cursor:pointer;">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="directory-wrapper">
        <div class="directory-panel">
            <div class="dir-chip" data-target="skillSec"><i class="fas fa-code"></i> 技能</div>
            <div class="dir-chip" data-target="gameSec"><i class="fas fa-gamepad"></i> 游戏</div>
            <div class="dir-chip" data-target="expSec"><i class="fas fa-history"></i> 经历</div>
            <div class="dir-chip" id="repo-count-chip" data-target="githubSec"><i class="fab fa-github"></i> 仓库 (..)</div>
            <div class="dir-chip" data-target="identitySec"><i class="fas fa-id-card"></i> 身份</div>
            <div class="dir-chip" data-target="contactSec"><i class="fas fa-comment"></i> 联系</div>
        </div>
    </div>

    <div class="scroll-area">
        <div class="avatar-zone">
            <div class="avatar-circle" id="avatarCircle">
                <img id="qq-avatar" class="avatar-img" src="" alt="QQ头像">
                <script>
                    document.getElementById('qq-avatar').src = 
                        'https://q.qlogo.cn/headimg_dl?dst_uin=1973737092&spec=140&t=' + Date.now();
                </script>
            </div>
            <div class="waste-title">ssbtt</div>
            <p style="opacity: 0.7; margin-top: 8px;">你来这儿要干嘛</p>
        </div>

        <div id="skillSec" class="card">
            <div class="card-header"><i class="fas fa-terminal"></i> 爱好与技能</div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                <span class="clickable-badge" data-url="https://www.java.com/"><i class="fab fa-java"></i> Java</span>
                <span class="clickable-badge" data-url="https://www.python.org/"><i class="fab fa-python"></i> Python</span>
                <span class="clickable-badge" data-url="https://www.lua.org/"><i class="fas fa-code"></i> Lua</span>
                <span class="clickable-badge" data-url="https://godotengine.org/"><i class="fas fa-play-circle"></i> GDScript</span>
            </div>
        </div>

        <div id="gameSec" class="card">
            <div class="card-header"><i class="fas fa-ghost"></i> 游戏热忱</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <a href="https://www.minecraft.net/" target="_blank" class="game-chip">Minecraft</a>
                <a href="https://anuke.itch.io/mindustry" target="_blank" class="game-chip">Mindustry</a>
                <a href="https://deltarune.com/" target="_blank" class="game-chip">三角符文</a>
                <a href="https://aqtw.qq.com/act/a20251011version/m/mobile.html" target="_blank" class="game-chip">暗区突围</a>
                <a href="https://www.half-life.com/" target="_blank" class="game-chip">半条命</a>
            </div>
        </div>

        <div id="identitySec" class="card">
            <div class="card-header"><i class="fas fa-fingerprint"></i> 身份标识</div>
            <ul style="list-style: none; line-height: 2;">
                <li><i class="fas fa-leaf" style="color: #4caf50; width: 25px;"></i> 中国共青团团员</li>
                <li><i class="fas fa-desktop" style="color: #ff9800; width: 25px;"></i> 希沃白板管理员</li>
                <li><i class="fas fa-microchip" style="color: #2196f3; width: 25px;"></i> 数字原住民</li>
            </ul>
        </div>

        <div id="expSec" class="card">
            <div class="card-header"><i class="fas fa-history"></i> 折腾经历</div>
            <ul style="list-style: none; line-height: 2; font-size: 0.95rem; opacity: 0.9;">
                <li><i class="fas fa-check-circle" style="color: var(--primary-accent); margin-right: 8px;"></i> 重装系统（lUbuntu）为朋友</li>
                <li style="margin-top: 5px; opacity: 0.6;">……</li>
            </ul>
        </div>

        <div id="githubSec" class="card">
            <div class="card-header"><i class="fab fa-github-alt"></i> 所有仓库 (实时)</div>
            <div id="repo-container">
                <div style="grid-column: span 2; text-align: center; opacity: 0.5; font-size: 0.8rem;">正在同步 GitHub 数据...</div>
            </div>
        </div>

        <div id="contactSec" class="card">
            <div class="card-header"><i class="fas fa-link"></i> 社交联系</div>
            <div class="contact-row">
                <a class="contact-btn-link" id="goGH"><i class="fab fa-github"></i> GitHub</a>
                <a class="contact-btn-link" id="goBili"><i class="fab fa-bilibili"></i> Bilibili</a>
                <a class="contact-btn-link" id="goQQ"><i class="fab fa-qq"></i> QQ主页</a>
                <a class="contact-btn-link" id="goWX"><i class="fab fa-weixin"></i> 微信联系</a>
            </div>
        </div>

        <footer>
            <p>© 2026 Crafted by ssbtt</p>
            <p style="margin-top: 5px;">Smooth Motion & Glassmorphism</p>
        </footer>
    </div>
</div>

<script>
    const CONFIG = {
        QQ_NUMBER: '1973737092',
        BILI_UID: '3546557150399113',
        WECHAT_ID: 'ssbtt114514',
        GITHUB_API_URL: 'https://api.github.com/users/ssbtt114514/repos?sort=updated',
        GITHUB_HOMEPAGE: 'https://github.com/ssbtt114514',
        QQ_ZONE_URL: 'https://user.qzone.qq.com/',
        BILI_SPACE_URL: 'https://space.bilibili.com/'
    };

    async function fetchAndRenderRepos() {
        const container = document.getElementById('repo-container');
        const countChip = document.getElementById('repo-count-chip');
        if (container) container.innerHTML = '<div style="grid-column: span 2; text-align: center; opacity: 0.5;"><i class="fas fa-spinner fa-pulse"></i> 正在同步 GitHub 数据...</div>';
        try {
            const response = await fetch(CONFIG.GITHUB_API_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const repos = await response.json();
            if (countChip) countChip.innerHTML = `<i class="fab fa-github"></i> 仓库 (${repos.length})`;
            if (container) {
                container.innerHTML = '';
                repos.forEach(repo => {
                    const card = document.createElement('a');
                    card.className = 'repo-card';
                    card.href = repo.html_url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.innerHTML = `<div style="font-weight:600; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(repo.name)}</div><div style="font-size:0.7rem; opacity:0.8;">⭐ ${repo.stargazers_count} | ${repo.language || 'Mixed'}</div>`;
                    container.appendChild(card);
                });
            }
        } catch (error) {
            if (container) container.innerHTML = '<div style="grid-column: span 2; text-align: center; opacity: 0.5;">仓库加载失败，请检查网络</div>';
            if (countChip) countChip.innerHTML = `<i class="fab fa-github"></i> 仓库 (加载失败)`;
        }
    }
    
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

    function openQQHomepage(qq) {
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
        if (isMobile) {
            window.location.href = `mqq://card/show_pslcard?uin=${qq}`;
            setTimeout(() => { if (confirm('无法唤起QQ，是否复制QQ号？')) navigator.clipboard.writeText(qq).then(() => alert(`QQ号 ${qq} 已复制`)); }, 800);
        } else {
            window.open(`${CONFIG.QQ_ZONE_URL}${qq}`, '_blank', 'noopener,noreferrer');
        }
    }
    
    function openBilibiliSpace(uid) {
        const ua = navigator.userAgent;
        const isInApp = /bilibili/i.test(ua);
        const isMobile = /Android|iPhone|iPad/i.test(ua);
        if (isInApp) window.location.href = `bilibili://space/${uid}`;
        else if (isMobile) { window.location.href = `bilibili://space/${uid}`; setTimeout(() => { window.location.href = `${CONFIG.BILI_SPACE_URL}${uid}`; }, 800); }
        else window.open(`${CONFIG.BILI_SPACE_URL}${uid}`, '_blank', 'noopener,noreferrer');
    }
    
    function copyWechatId() {
        navigator.clipboard.writeText(CONFIG.WECHAT_ID).then(() => alert(`微信号 ${CONFIG.WECHAT_ID} 已复制，请去微信搜索`)).catch(() => { const ta = document.createElement('textarea'); ta.value = CONFIG.WECHAT_ID; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert(`微信号 ${CONFIG.WECHAT_ID} 已复制，请去微信搜索`); });
    }

    function initThemeToggle() {
        const themeBtn = document.getElementById('themeSwitch');
        if (!themeBtn) return;
        if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark'); themeBtn.innerHTML = '<i class="fas fa-sun" style="color:#ffdf8c"></i>'; }
        themeBtn.addEventListener('click', () => { const isDark = document.body.classList.toggle('dark'); themeBtn.innerHTML = isDark ? '<i class="fas fa-sun" style="color:#ffdf8c"></i>' : '<i class="fas fa-moon"></i>'; localStorage.setItem('theme', isDark ? 'dark' : 'light'); });
    }
    
    function initDirectoryScroll() {
        document.querySelectorAll('.dir-chip').forEach(chip => {
            const targetId = chip.getAttribute('data-target');
            if (!targetId) return;
            chip.addEventListener('click', (e) => { e.preventDefault(); const target = document.getElementById(targetId); if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); target.style.transition = 'box-shadow 0.3s'; target.style.boxShadow = '0 0 0 3px var(--primary-accent)'; setTimeout(() => { target.style.boxShadow = ''; }, 600); } });
        });
    }
    
    function initSkillBadges() {
        document.querySelectorAll('.clickable-badge').forEach(badge => { badge.addEventListener('click', (e) => { e.stopPropagation(); const url = badge.getAttribute('data-url'); if (url) window.open(url, '_blank', 'noopener,noreferrer'); }); });
    }
    
    function initContactButtons() {
        document.getElementById('goGH')?.addEventListener('click', () => window.open(CONFIG.GITHUB_HOMEPAGE, '_blank', 'noopener,noreferrer'));
        document.getElementById('goBili')?.addEventListener('click', () => openBilibiliSpace(CONFIG.BILI_UID));
        document.getElementById('goQQ')?.addEventListener('click', () => openQQHomepage(CONFIG.QQ_NUMBER));
        document.getElementById('goWX')?.addEventListener('click', copyWechatId);
    }
    
    function initAvatarAnimation() {
        const avatar = document.getElementById('avatarCircle');
        if (!avatar) return;
        avatar.addEventListener('click', (e) => {
            e.stopPropagation();
            const maxOffset = 180;
            const x = (Math.random() - 0.5) * maxOffset * 2;
            const y = (Math.random() - 0.5) * maxOffset * 2;
            avatar.style.transform = `translate(${x}px, ${y}px)`;
        });
    }
    
    function addSecurityAttributes() { document.querySelectorAll('a[target="_blank"]').forEach(link => link.setAttribute('rel', 'noopener noreferrer')); }

    function init() { fetchAndRenderRepos(); initThemeToggle(); initDirectoryScroll(); initSkillBadges(); initContactButtons(); initAvatarAnimation(); addSecurityAttributes(); }
    
    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
