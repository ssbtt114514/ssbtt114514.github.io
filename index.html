<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ssbtt · 个人主页</title>
    <!-- Font Awesome 6 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ============================================
           GLOBAL STYLES & CSS VARIABLES
           全局样式与CSS变量定义
        ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        :root {
            --primary-accent: #6c8dff;        /* 主题强调色 */
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1); /* 弹性缓动曲线 */
            --smooth-easing: cubic-bezier(0.4, 0, 0.2, 1);      /* 平滑缓动曲线 */
        }

        /* ========== BODY 背景与主题 ========== */
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background: radial-gradient(circle at 20% 30%, #eef2f9, #cbd5e6);
            transition: background 0.5s var(--smooth-easing);
            overflow-x: hidden;
        }

        body.dark {
            background: radial-gradient(circle at 20% 30%, #0f1724, #03060c);
        }

        /* ========== 主容器 - 毛玻璃效果 ========== */
        .glass-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            background: rgba(245, 248, 255, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            transition: transform 0.3s var(--spring-easing), background 0.4s ease;
            will-change: transform;
        }

        body.dark .glass-container {
            background: rgba(18, 24, 36, 0.75);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* ========== 顶部导航栏 ========== */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* ========== 目录导航区域 ========== */
        .directory-wrapper {
            background: rgba(240, 245, 255, 0.4);
            overflow: hidden;
            transition: max-height 0.5s var(--smooth-easing), opacity 0.4s ease, padding 0.5s ease;
            max-height: 500px;
        }

        .directory-panel {
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 目录项通用样式 */
        .dir-chip {
            background: rgba(0, 0, 0, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #1f2a3e;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
            will-change: transform;
            user-select: none;
        }

        body.dark .dir-chip {
            background: rgba(255, 255, 255, 0.08);
            color: #eef3ff;
        }

        .dir-chip:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        .dir-chip:active {
            transform: scale(0.96);
        }

        /* ========== 头像区域 ========== */
        .avatar-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 0;
            animation: fadeInDown 0.8s var(--spring-easing);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: white;
            padding: 5px;
            box-shadow: 0 10px 30px rgba(108, 141, 255, 0.3);
            transition: transform 0.5s var(--spring-easing);
            cursor: pointer;
        }

        .avatar-circle:hover {
            transform: rotate(5deg) scale(1.05);
        }

        /* 头像点击抖动动画 */
        .avatar-click-animation {
            animation: avatarShake 0.5s ease-in-out;
        }

        @keyframes avatarShake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(8deg) scale(1.05); }
            50% { transform: rotate(-8deg) scale(1.05); }
            75% { transform: rotate(4deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .waste-title {
            margin-top: 15px;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #2c3e66, #6c8dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.dark .waste-title {
            background: linear-gradient(135deg, #eef3fc, #6c8dff);
            -webkit-background-clip: text;
        }

        /* ========== 内容滚动区域 ========== */
        .scroll-area {
            padding: 0 24px 40px;
        }

        /* ========== 卡片通用样式 ========== */
        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.6);
        }

        body.dark .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ========== 技能标签样式 ========== */
        .clickable-badge {
            background: rgba(108, 141, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            text-decoration: none;
            color: #334155;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s var(--spring-easing);
        }

        body.dark .clickable-badge { 
            color: #cbd5e1; 
            background: rgba(108, 141, 255, 0.15); 
        }

        .clickable-badge:hover {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 141, 255, 0.4);
            transform: translateY(-2px);
        }

        /* ========== 游戏标签样式 ========== */
        .game-chip {
            background: rgba(0,0,0,0.04);
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            text-decoration: none;
            color: inherit;
            display: inline-block;
            transition: all 0.25s var(--spring-easing);
        }

        body.dark .game-chip { 
            background: rgba(255,255,255,0.05); 
        }

        .game-chip:hover {
            background: var(--primary-accent);
            color: white;
            transform: translateY(-2px);
        }

        /* ========== GitHub 仓库网格 ========== */
        #repo-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .repo-card {
            background: rgba(0,0,0,0.03);
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            font-size: 0.85rem;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        body.dark .repo-card { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.05); 
        }

        .repo-card:hover { 
            background: var(--primary-accent); 
            color: white; 
            transform: translateY(-2px);
        }

        /* ========== 联系方式按钮 ========== */
        .contact-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .contact-btn-link {
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            background: white;
            color: #1f2937;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s var(--spring-easing);
            cursor: pointer;
            display: block;
        }

        body.dark .contact-btn-link { 
            background: #1e293b; 
            color: white; 
        }

        .contact-btn-link:hover {
            background: var(--primary-accent);
            color: white;
            transform: scale(1.03);
        }

        /* ========== 页脚 ========== */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* ========== 隐藏滚动条 ========== */
        ::-webkit-scrollbar { 
            width: 0px; 
            background: transparent; 
        }

        /* ========== 移动端响应式适配 ========== */
        @media (max-width: 480px) {
            .contact-row, #repo-container { 
                grid-template-columns: 1fr; 
            }
            .glass-container { 
                border-radius: 0; 
                min-height: 100vh; 
            }
            body { 
                padding: 0; 
            }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <!-- ============================================
         顶部栏：主题切换按钮
    ============================================ -->
    <div class="top-bar">
        <button class="theme-toggle" id="themeSwitch" style="background:none; border:none; font-size: 1.2rem; cursor:pointer;">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- ============================================
         目录导航区
    ============================================ -->
    <div class="directory-wrapper" id="directoryWrapper">
        <div class="directory-panel">
            <div class="dir-chip" data-target="skillSec"><i class="fas fa-code"></i> 技能</div>
            <div class="dir-chip" data-target="gameSec"><i class="fas fa-gamepad"></i> 游戏</div>
            <div class="dir-chip" data-target="expSec"><i class="fas fa-history"></i> 经历</div>
            <div class="dir-chip" id="repo-count-chip" data-target="githubSec"><i class="fab fa-github"></i> 仓库 (..)</div>
            <div class="dir-chip" data-target="identitySec"><i class="fas fa-id-card"></i> 身份</div>
            <div class="dir-chip" data-target="contactSec"><i class="fas fa-comment"></i> 联系</div>
        </div>
    </div>

    <!-- ============================================
         主要内容区域
    ============================================ -->
    <div class="scroll-area">
        
        <!-- 头像区域 -->
        <div class="avatar-zone">
            <div class="avatar-circle" id="avatarCircle">
                <img class="avatar-img" src="https://gitee.com/mulberry-is-not-too-sweet/ssbtt/raw/master/avatar.jpg" alt="ssbtt">
            </div>
            <div class="waste-title">ssbtt</div>
            <p style="opacity: 0.7; margin-top: 8px;">你来这儿要干嘛</p>
        </div>

        <!-- 技能卡片 -->
        <div id="skillSec" class="card">
            <div class="card-header"><i class="fas fa-terminal"></i> 爱好与技能</div>
            <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                <span class="clickable-badge" data-url="https://www.java.com/"><i class="fab fa-java"></i> Java</span>
                <span class="clickable-badge" data-url="https://www.python.org/"><i class="fab fa-python"></i> Python</span>
                <span class="clickable-badge" data-url="https://www.lua.org/"><i class="fas fa-code"></i> Lua</span>
                <span class="clickable-badge" data-url="https://godotengine.org/"><i class="fas fa-play-circle"></i> GDScript</span>
            </div>
        </div>

        <!-- 游戏卡片 -->
        <div id="gameSec" class="card">
            <div class="card-header"><i class="fas fa-ghost"></i> 游戏热忱</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <a href="https://www.minecraft.net/" target="_blank" class="game-chip">Minecraft</a>
                <a href="https://anuke.itch.io/mindustry" target="_blank" class="game-chip">Mindustry</a>
                <a href="https://deltarune.com/" target="_blank" class="game-chip">三角符文</a>
                <a href="https://aqtk.qq.com/" target="_blank" class="game-chip">暗区突围</a>
                <a href="https://www.half-life.com/" target="_blank" class="game-chip">半条命</a>
            </div>
        </div>

        <!-- 身份标识卡片 -->
        <div id="identitySec" class="card">
            <div class="card-header"><i class="fas fa-fingerprint"></i> 身份标识</div>
            <ul style="list-style: none; line-height: 2;">
                <li><i class="fas fa-leaf" style="color: #4caf50; width: 25px;"></i> 中国共青团团员</li>
                <li><i class="fas fa-desktop" style="color: #ff9800; width: 25px;"></i> 希沃白板管理员</li>
                <li><i class="fas fa-microchip" style="color: #2196f3; width: 25px;"></i> 数字原住民</li>
            </ul>
        </div>

        <!-- 折腾经历卡片 -->
        <div id="expSec" class="card">
            <div class="card-header"><i class="fas fa-history"></i> 折腾经历</div>
            <ul style="list-style: none; line-height: 2; font-size: 0.95rem; opacity: 0.9;">
                <li><i class="fas fa-check-circle" style="color: var(--primary-accent); margin-right: 8px;"></i> 重装系统（lUbuntu）为朋友</li>
                <li style="margin-top: 5px; opacity: 0.6;">……</li>
            </ul>
        </div>

        <!-- GitHub 仓库卡片（动态加载） -->
        <div id="githubSec" class="card">
            <div class="card-header"><i class="fab fa-github-alt"></i> 所有仓库 (实时)</div>
            <div id="repo-container">
                <div style="grid-column: span 2; text-align: center; opacity: 0.5; font-size: 0.8rem;">正在同步 GitHub 数据...</div>
            </div>
        </div>

        <!-- 社交联系卡片 -->
        <div id="contactSec" class="card">
            <div class="card-header"><i class="fas fa-link"></i> 社交联系</div>
            <div class="contact-row">
                <a class="contact-btn-link" id="goGH"><i class="fab fa-github"></i> GitHub</a>
                <a class="contact-btn-link" id="goBili"><i class="fab fa-bilibili"></i> Bilibili</a>
                <a class="contact-btn-link" id="goQQ"><i class="fab fa-qq"></i> QQ主页</a>
                <a class="contact-btn-link" id="goWX"><i class="fab fa-weixin"></i> 微信联系</a>
            </div>
        </div>

        <!-- 页脚 -->
        <footer>
            <p>© 2026 Crafted by ssbtt</p>
            <p style="margin-top: 5px;">Smooth Motion & Glassmorphism</p>
        </footer>
    </div>
</div>

<script>
    // ============================================
    // JAVASCRIPT 模块化代码
    // 组织结构：配置常量 -> GitHub API -> 社交跳转 -> UI交互 -> 初始化
    // ============================================

    // ========== 1. 配置常量区（方便后续修改） ==========
    const CONFIG = {
        // 社交账号
        QQ_NUMBER: '1973737092',           // QQ号
        BILI_UID: '3546557150399113',      // B站UID
        WECHAT_ID: 'ssbtt114514',          // 微信号
        GITHUB_USERNAME: 'ssbtt114514',    // GitHub用户名
        
        // API 地址
        GITHUB_API_URL: 'https://api.github.com/users/ssbtt114514/repos?sort=updated',
        
        // 外部链接
        GITHUB_HOMEPAGE: 'https://github.com/ssbtt114514',
        QQ_ZONE_URL: 'https://user.qzone.qq.com/',
        BILI_SPACE_URL: 'https://space.bilibili.com/'
    };

    // ========== 2. GitHub 仓库拉取模块 ==========
    /**
     * 从 GitHub API 获取用户仓库列表并渲染
     * 自动处理加载状态和错误情况
     */
    async function fetchAndRenderRepos() {
        const container = document.getElementById('repo-container');
        const countChip = document.getElementById('repo-count-chip');
        
        // 显示加载状态
        if (container) {
            container.innerHTML = '<div style="grid-column: span 2; text-align: center; opacity: 0.5;"><i class="fas fa-spinner fa-pulse"></i> 正在同步 GitHub 数据...</div>';
        }
        
        try {
            const response = await fetch(CONFIG.GITHUB_API_URL);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const repos = await response.json();
            
            // 更新目录中的仓库数量显示
            if (countChip) {
                countChip.innerHTML = `<i class="fab fa-github"></i> 仓库 (${repos.length})`;
            }
            
            // 清空并重新渲染仓库列表
            if (container) {
                container.innerHTML = '';
                
                repos.forEach(repo => {
                    const card = document.createElement('a');
                    card.className = 'repo-card';
                    card.href = repo.html_url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.innerHTML = `
                        <div style="font-weight:600; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(repo.name)}</div>
                        <div style="font-size:0.7rem; opacity:0.8;">⭐ ${repo.stargazers_count} | ${repo.language || 'Mixed'}</div>
                    `;
                    container.appendChild(card);
                });
            }
        } catch (error) {
            console.error('GitHub API 错误:', error);
            if (container) {
                container.innerHTML = '<div style="grid-column: span 2; text-align: center; opacity: 0.5;">仓库加载失败，请检查网络</div>';
            }
            if (countChip) {
                countChip.innerHTML = `<i class="fab fa-github"></i> 仓库 (加载失败)`;
            }
        }
    }
    
    /**
     * 简单的 XSS 防护：转义 HTML 特殊字符
     */
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== 3. 社交平台跳转模块 ==========
    
    /**
     * QQ 跳转 - 跳转到个人主页
     * 移动端：唤起 QQ App 进入个人主页
     * PC端：跳转 QQ 空间个人主页
     * @param {string} qq - QQ号码
     */
    function openQQHomepage(qq) {
        const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
        
        if (isMobile) {
            // 移动端：唤起 QQ App 进入个人主页
            window.location.href = `mqq://card/show_pslcard?uin=${qq}`;
            
            // 兜底：无法唤起时复制 QQ 号
            setTimeout(() => {
                if (confirm('无法唤起QQ，是否复制QQ号？')) {
                    navigator.clipboard.writeText(qq).then(() => {
                        alert(`QQ号 ${qq} 已复制`);
                    }).catch(() => {
                        alert(`请手动添加QQ号: ${qq}`);
                    });
                }
            }, 800);
        } else {
            // PC端：跳转 QQ 空间个人主页
            window.open(`${CONFIG.QQ_ZONE_URL}${qq}`, '_blank', 'noopener,noreferrer');
        }
    }
    
    /**
     * B站跳转 - 支持移动端唤起App
     * @param {string} uid - B站用户UID
     */
    function openBilibiliSpace(uid) {
        const ua = navigator.userAgent;
        const isInApp = /bilibili/i.test(ua);           // 是否已在B站App内
        const isMobile = /Android|iPhone|iPad/i.test(ua);
        
        if (isInApp) {
            // 已在 App 内，直接打开用户空间
            window.location.href = `bilibili://space/${uid}`;
        } else if (isMobile) {
            // 移动端但不在 App，尝试唤起
            window.location.href = `bilibili://space/${uid}`;
            setTimeout(() => {
                window.location.href = `${CONFIG.BILI_SPACE_URL}${uid}`;
            }, 800);
        } else {
            // PC端直接打开网页
            window.open(`${CONFIG.BILI_SPACE_URL}${uid}`, '_blank', 'noopener,noreferrer');
        }
    }
    
    /**
     * 微信联系 - 复制微信号
     */
    function copyWechatId() {
        navigator.clipboard.writeText(CONFIG.WECHAT_ID).then(() => {
            alert(`微信号 ${CONFIG.WECHAT_ID} 已复制，请去微信搜索`);
        }).catch(() => {
            // 降级方案：使用 textarea 复制
            const textarea = document.createElement('textarea');
            textarea.value = CONFIG.WECHAT_ID;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert(`微信号 ${CONFIG.WECHAT_ID} 已复制，请去微信搜索`);
        });
    }

    // ========== 4. UI 交互模块 ==========
    
    /**
     * 主题切换功能
     * 支持明暗模式切换，并保存用户偏好到 localStorage
     */
    function initThemeToggle() {
        const themeBtn = document.getElementById('themeSwitch');
        if (!themeBtn) return;
        
        // 从 localStorage 读取已保存的主题
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            themeBtn.innerHTML = '<i class="fas fa-sun" style="color:#ffdf8c"></i>';
        }
        
        themeBtn.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark');
            themeBtn.innerHTML = isDark ? '<i class="fas fa-sun" style="color:#ffdf8c"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }
    
    /**
     * 目录滚动跳转
     * 点击目录项平滑滚动到对应卡片位置
     */
    function initDirectoryScroll() {
        const dirChips = document.querySelectorAll('.dir-chip');
        
        dirChips.forEach(chip => {
            // 跳过没有 data-target 属性的项
            const targetId = chip.getAttribute('data-target');
            if (!targetId) return;
            
            chip.addEventListener('click', (e) => {
                e.preventDefault();
                const targetElement = document.getElementById(targetId);
                
                if (targetElement) {
                    targetElement.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start',
                        inline: 'nearest'
                    });
                    
                    // 视觉反馈：短暂高亮
                    targetElement.style.transition = 'box-shadow 0.3s';
                    targetElement.style.boxShadow = '0 0 0 3px var(--primary-accent)';
                    setTimeout(() => {
                        targetElement.style.boxShadow = '';
                    }, 600);
                }
            });
        });
    }
    
    /**
     * 技能标签点击跳转
     */
    function initSkillBadges() {
        const skillBadges = document.querySelectorAll('.clickable-badge');
        
        skillBadges.forEach(badge => {
            badge.addEventListener('click', (e) => {
                e.stopPropagation();
                const url = badge.getAttribute('data-url');
                if (url) {
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            });
        });
    }
    
    /**
     * 联系方式按钮绑定事件
     */
    function initContactButtons() {
        const ghBtn = document.getElementById('goGH');
        const biliBtn = document.getElementById('goBili');
        const qqBtn = document.getElementById('goQQ');
        const wxBtn = document.getElementById('goWX');
        
        if (ghBtn) {
            ghBtn.addEventListener('click', () => window.open(CONFIG.GITHUB_HOMEPAGE, '_blank', 'noopener,noreferrer'));
        }
        if (biliBtn) {
            biliBtn.addEventListener('click', () => openBilibiliSpace(CONFIG.BILI_UID));
        }
        if (qqBtn) {
            qqBtn.addEventListener('click', () => openQQHomepage(CONFIG.QQ_NUMBER));
        }
        if (wxBtn) {
            wxBtn.addEventListener('click', copyWechatId);
        }
    }
    
    /**
     * 头像点击动画效果
     */
    function initAvatarAnimation() {
        const avatarCircle = document.getElementById('avatarCircle');
        if (!avatarCircle) return;
        
        avatarCircle.addEventListener('click', function(e) {
            e.stopPropagation();
            // 移除并重新添加动画类，触发动画重放
            this.classList.remove('avatar-click-animation');
            // 强制重绘
            void this.offsetWidth;
            this.classList.add('avatar-click-animation');
            // 动画结束后移除类
            setTimeout(() => {
                this.classList.remove('avatar-click-animation');
            }, 500);
        });
    }
    
    /**
     * 为所有外部链接添加安全属性
     */
    function addSecurityAttributes() {
        const externalLinks = document.querySelectorAll('a[target="_blank"]');
        externalLinks.forEach(link => {
            link.setAttribute('rel', 'noopener noreferrer');
        });
    }

    // ========== 5. 页面初始化入口 ==========
    /**
     * 所有初始化函数在此调用
     * 方便后续添加新的初始化模块
     */
    function init() {
        // 数据加载
        fetchAndRenderRepos();          // 加载 GitHub 仓库
        
        // UI 交互
        initThemeToggle();              // 主题切换
        initDirectoryScroll();          // 目录滚动
        initSkillBadges();              // 技能标签
        initContactButtons();           // 联系方式按钮
        initAvatarAnimation();          // 头像动画
        
        // 安全设置
        addSecurityAttributes();        // 外部链接安全属性
    }
    
    // 等待 DOM 加载完成后执行初始化
    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
