// ============================================================
// Vec2
// ============================================================
class Vec2 {
  constructor(x,y){this.x=x;this.y=y;}
  static get Zero(){return new Vec2(0,0);}
  mag(){return Math.hypot(this.x,this.y);}
  distance(o){return Math.hypot(this.x-o.x,this.y-o.y);}
  angle(){return Math.atan2(this.y,this.x);}
  dot(o){return this.x*o.x+this.y*o.y;}
  static makeWithAngleMag(a,m){return new Vec2(Math.cos(a)*m,Math.sin(a)*m);}
  rotate(a){const c=Math.cos(a),s=Math.sin(a);return new Vec2(this.x*c-this.y*s,this.x*s+this.y*c);}
  plus(o){return new Vec2(this.x+o.x,this.y+o.y);}
  minus(o){return new Vec2(this.x-o.x,this.y-o.y);}
  times(s){return new Vec2(this.x*s,this.y*s);}
  div(s){return new Vec2(this.x/s,this.y/s);}
  negate(){return new Vec2(-this.x,-this.y);}
  str(){return `(${this.x.toFixed(1)}, ${this.y.toFixed(1)})`;}
}

// ============================================================
// Maths
// ============================================================
function lexp(s,e,p){return (p-s)/(e-s);}
function expSmooth(cur,tgt,dt=1/60,spd=5){return cur+(tgt-cur)*(1-Math.exp(-dt*spd));}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function lerp(a,b,t){return a+(b-a)*t;}

// ============================================================
// Randomness — Bag, RandomTable, RNG
// ============================================================
class RNG {
  constructor(seed){this.state=(seed>>>0)||1;}
  nextFloat(){this.state^=this.state<<13;this.state>>>=0;this.state^=this.state>>>17;this.state^=this.state<<5;this.state>>>=0;return(this.state>>>0)/4294967296;}
  nextInt(lo,hi){return Math.floor(this.nextFloat()*(hi-lo))+lo;}
  nextFloatInRange(lo,hi){return lo+(hi-lo)*this.nextFloat();}
  choose(arr){return arr[this.nextInt(0,arr.length)];}
}
class Bag {
  constructor(items){this.remaining=items.slice();this.next=this.remaining.length;}
  pull(rng){if(this.next>=this.remaining.length){for(let i=this.remaining.length-1;i>0;i--){const j=rng.nextInt(0,i+1);[this.remaining[i],this.remaining[j]]=[this.remaining[j],this.remaining[i]];}this.next=0;}return this.remaining[this.next++];}
}
class RandomTable {
  constructor(...pairs){this.pairs=pairs;this.total=pairs.reduce((s,p)=>s+p[0],0);}
  roll(rng){let x=rng.nextFloatInRange(0,this.total);for(const[w,v]of this.pairs){x-=w;if(x<0)return v;}return this.pairs[this.pairs.length-1][1];}
}

// ============================================================
// PathTools
// ============================================================
function createPolygonPoints(radius,sides){const step=PI2f/sides,pts=[];for(let i=0;i<sides;i++)pts.push(new Vec2(radius*Math.cos(step*i),radius*Math.sin(step*i)));return pts;}
function createStarPoints(r1,r2,points){const step=PI2f/points,pts=[];pts.push(new Vec2(r1,0));pts.push(new Vec2(r2*Math.cos(step*0.5),r2*Math.sin(step*0.5)));for(let i=1;i<points;i++){pts.push(new Vec2(r1*Math.cos(step*i),r1*Math.sin(step*i)));pts.push(new Vec2(r2*Math.cos(step*(i+0.5)),r2*Math.sin(step*(i+0.5))));}return pts;}
function drawPolyPath(ctx,pts){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();}
function parseSvgPath(d){const cmds=[],re=/([A-Za-z])\s*([-.,0-9e ]+)?/g;let m;while((m=re.exec(d.trim()))!==null)cmds.push([m[1],m[2]?m[2].trim().split(/\s+/).map(Number):[]]);return cmds;}
function drawSvgPath(ctx,cmds){ctx.beginPath();let cx=0,cy=0;for(const[cmd,args]of cmds){switch(cmd){case'M':ctx.moveTo(args[0],args[1]);cx=args[0];cy=args[1];break;case'L':ctx.lineTo(args[0],args[1]);cx=args[0];cy=args[1];break;case'l':ctx.lineTo(cx+args[0],cy+args[1]);cx+=args[0];cy+=args[1];break;case'C':ctx.bezierCurveTo(args[0],args[1],args[2],args[3],args[4],args[5]);cx=args[4];cy=args[5];break;case'Z':ctx.closePath();break;}}}
const spaceshipPath=parseSvgPath('M11.853 0 C11.853 -4.418 8.374 -8 4.083 -8 L-5.5 -8 C-6.328 -8 -7 -7.328 -7 -6.5 C-7 -5.672 -6.328 -5 -5.5 -5 L-2.917 -5 C-1.26 -5 0.083 -3.657 0.083 -2 L0.083 2 C0.083 3.657 -1.26 5 -2.917 5 L-5.5 5 C-6.328 5 -7 5.672 -7 6.5 C-7 7.328 -6.328 8 -5.5 8 L4.083 8 C8.374 8 11.853 4.418 11.853 0 Z');
const spaceshipLegs=parseSvgPath('M-7 -6.5 l-3.5 0 l-1 -2 l 0 4 l 1 -2 Z M-7 6.5 l-3.5 0 l-1 -2 l 0 4 l 1 -2 Z');
const thrustPathPts=createPolygonPoints(-3,3).map(p=>p.plus(new Vec2(-5,0)));

// ============================================================
// Namer — all string arrays
// ============================================================
const PLANET_DESCRIPTORS=["earthy","swamp","frozen","grassy","arid","crowded","ancient","lively","homey","modern","boring","compact","expensive","polluted","rusty","sandy","undulating","verdant","tessellated","hollow","scalding","hemispherical","oblong","oblate","vacuum","high-pressure","low-pressure","plastic","metallic","burned-out","bucolic"];
const LIFE_DESCRIPTORS=["aggressive","passive-aggressive","shy","timid","nasty","brutish","short","absent","teen-aged","confused","transparent","cubic","quadratic","higher-order","huge","tall","wary","loud","yodeling","purring","slender","cats","adorable","eclectic","electric","microscopic","trunkless","myriad","cantankerous","gargantuan","contagious","fungal","cattywampus","spatchcocked","rotisserie","farm-to-table","organic","synthetic","unfocused","focused","capitalist","communal","bossy","malicious","compliant","psychic","oblivious","passive","bonsai"];
const ANY_DESCRIPTORS=["silly","dangerous","vast","invisible","superfluous","superconducting","superior","alien","phantom","friendly","peaceful","lonely","uncomfortable","charming","fractal","imaginary","forgotten","tardy","gassy","fungible","bespoke","artisanal","exceptional","puffy","rusty","fresh","crusty","glossy","lovely","processed","macabre","reticulated","shocking","void","undefined","gothic","beige","mid","milquetoast","melancholy","unnerving","cheery","vibrant","heliotrope","psychedelic","nondescript","indescribable","tubular","toroidal","voxellated","low-poly","low-carb","100% cotton","synthetic","boot-cut","bell-bottom","bumpy","fluffy","sous-vide","tepid","upcycled","sous-vide","bedazzled","ancient","inexplicable","sparkling","still","lemon-scented","eccentric","tilted","pungent","pine-scented","corduroy","overengineered","bioengineered","impossible"];
const ATMO_DESCRIPTORS=["toxic","breathable","radioactive","clear","calm","peaceful","vacuum","stormy","freezing","burning","humid","tropical","cloudy","obscured","damp","dank","clammy","frozen","contaminated","temperate","moist","minty","relaxed","skunky","breezy","soup"];
const PLANET_TYPES=["planet","planetoid","moon","moonlet","centaur","asteroid","space garbage","detritus","satellite","core","giant","body","slab","rock","husk","planemo","object","planetesimal","exoplanet","ploonet"];
const CONSTELLATIONS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces","Andromeda","Cygnus","Draco","Alcor","Calamari","Cuckoo","Neko","Monoceros","Norma","Abnorma","Morel","Redlands","Cupcake","Donut","Eclair","Froyo","Gingerbread","Honeycomb","Icecreamsandwich","Jellybean","Kitkat","Lollipop","Marshmallow","Nougat","Oreo","Pie","Quincetart","Redvelvetcake","Snowcone","Tiramisu","Upsidedowncake","Vanillaicecream","Android","Binder","Campanile","Dread"];
const CONSTELLATIONS_RARE=["Jandycane","Zombiegingerbread","Astro","Bender","Flan","Untitled-1","Expedit","Petit Four","Worcester","Xylophone","Yellowpeep","Zebraball","Hutton","Klang","Frogblast","Exo","Keylimepie","Nat","Nrp"];
const STAR_SUFFIXES=["Alpha","Beta","Gamma","Delta","Epsilon","Zeta","Eta","Theta","Iota","Kappa","Lambda","Mu","Nu","Xi","Omicron","Pi","Rho","Sigma","Tau","Upsilon","Phi","Chi","Psi","Omega","Prime","Secundo","Major","Minor","Diminished","Augmented","Ultima","Penultima","Mid","Proxima","Novis","Plus"];
const STAR_SUFFIXES_RARE=["Serif","Sans","Oblique","Grotesque","Handtooled",'III "Trey"',"Alfredo","2.0","(Final)","(Final (Final))","(Draft)","Con Carne"];
const FAUNA_GENERIC_PLURALS=["fauna","animals","locals","creatures","critters","wildlife","specimens","life","cells"];
const FLORA_GENERIC_PLURALS=["flora","plants","flowers","trees","mosses","specimens","life","cells"];
const ATMO_GENERIC_PLURALS=["air","atmosphere","clouds","atmo","gases"];
const ACTIVITIES=["refueling","sightseeing","vacationing","luncheoning","recharging","taking up space","reticulating space splines","using facilities","spelunking","repairing","herding {fauna}","taming {fauna}","breeding {fauna}","singing lullabies to {fauna}","singing lullabies to {flora}","singing lullabies to the {planet}","gardening {flora}","collecting {flora}","surveying the {planet}","mapping the {planet}","breathing {atmo}","reprocessing {atmo}","bottling {atmo}"];
const SUFFIX_PROB=0.75,LETTER_PROB=0.3,NUMBER_PROB=0.3,RARE_PROB=0.05;

class Namer {
  constructor(){
    this.planetDescriptors=new Bag(PLANET_DESCRIPTORS);this.lifeDescriptors=new Bag(LIFE_DESCRIPTORS);
    this.anyDescriptors=new Bag(ANY_DESCRIPTORS);this.atmoDescriptors=new Bag(ATMO_DESCRIPTORS);
    this.planetTypes=new Bag(PLANET_TYPES);this.constellations=new Bag(CONSTELLATIONS);
    this.constellationsRare=new Bag(CONSTELLATIONS_RARE);this.suffixes=new Bag(STAR_SUFFIXES);
    this.suffixesRare=new Bag(STAR_SUFFIXES_RARE);
    this.planetTable=new RandomTable([0.75,this.planetDescriptors],[0.25,this.anyDescriptors]);
    this.lifeTable=new RandomTable([0.75,this.lifeDescriptors],[0.25,this.anyDescriptors]);
    this.constellationsTable=new RandomTable([RARE_PROB,this.constellationsRare],[1-RARE_PROB,this.constellations]);
    this.suffixesTable=new RandomTable([RARE_PROB,this.suffixesRare],[1-RARE_PROB,this.suffixes]);
    this.atmoTable=new RandomTable([0.75,this.atmoDescriptors],[0.25,this.anyDescriptors]);
    this.delimiterTable=new RandomTable([15,' '],[3,'-'],[1,'_'],[1,'/'],[1,'.'],[1,'*'],[1,'^'],[1,'#'],[0.1,'(^*!%@##!!']);
    this.activities=new Bag(ACTIVITIES);
    this.floraGenericPlurals=new Bag(FLORA_GENERIC_PLURALS);
    this.faunaGenericPlurals=new Bag(FAUNA_GENERIC_PLURALS);
    this.atmoGenericPlurals=new Bag(ATMO_GENERIC_PLURALS);
  }
  describePlanet(rng){return this.planetTable.roll(rng).pull(rng)+' '+this.planetTypes.pull(rng);}
  describeLife(rng){return this.lifeTable.roll(rng).pull(rng);}
  describeAtmo(rng){return this.atmoTable.roll(rng).pull(rng);}
  floraPlural(rng){return this.floraGenericPlurals.pull(rng);}
  faunaPlural(rng){return this.faunaGenericPlurals.pull(rng);}
  atmoPlural(rng){return this.atmoGenericPlurals.pull(rng);}
  nameSystem(rng){
    let s=this.constellationsTable.roll(rng).pull(rng);
    if(rng.nextFloat()<=SUFFIX_PROB){s+=this.delimiterTable.roll(rng);s+=this.suffixesTable.roll(rng).pull(rng);if(rng.nextFloat()<=RARE_PROB)s+=' '+this.suffixesRare.pull(rng);}
    if(rng.nextFloat()<=LETTER_PROB){s+=this.delimiterTable.roll(rng);s+=String.fromCharCode(65+rng.nextInt(0,26));if(rng.nextFloat()<=RARE_PROB)s+=this.delimiterTable.roll(rng);}
    if(rng.nextFloat()<=NUMBER_PROB){s+=this.delimiterTable.roll(rng);s+=rng.nextInt(2,5039);}
    return s;
  }
  describeActivity(rng,target){
    return this.activities.pull(rng).replace(/\{(flora|fauna|planet|atmo)\}/g,(_,tag)=>{
      switch(tag){case'flora':return(target?.flora||'SOME')+' '+this.floraPlural(rng);case'fauna':return(target?.fauna||'SOME')+' '+this.faunaPlural(rng);case'atmo':return(target?.atmosphere||'SOME')+' '+this.atmoPlural(rng);case'planet':return target?.description||'SOME BODY';default:return'unknown';}
    });
  }
}

// ============================================================
// Physics — Fuse, Body, Container, Simulator
// ============================================================
class Fuse{constructor(l){this.lifetime=l;}canBeRemoved(){return this.lifetime<0;}tick(dt){this.lifetime-=dt;}}
class Body{
  constructor(){this.pos=Vec2.Zero;this.opos=Vec2.Zero;this.velocity=Vec2.Zero;this.mass=1;this.angle=0;this.radius=1;this.collides=true;this.omega=0;this.oangle=0;}
  update(sim,dt){this.opos=this.pos;this.pos=this.pos.plus(this.velocity.times(dt));this.oangle=this.angle;this.angle+=this.omega*dt;}
  postUpdate(sim,dt){if(dt>0)this.velocity=this.pos.minus(this.opos).div(dt);}
}
class Container{
  constructor(radius,bodies){this.radius=radius;this.bodies=bodies;}
  solve(sim,dt){for(const b of this.bodies){const d=b.pos.mag();if(d>this.radius){b.pos=b.pos.times(this.radius/d);const n=b.pos.div(d);b.velocity=b.velocity.minus(n.times(b.velocity.dot(n)));}}}
}
class Simulator{
  constructor(){this.entities=[];this.constraints=[];this.now=0;this.dt=1/60;this._listeners=[];}
  add(e){this.entities.push(e);return e;}
  addConstraint(c){this.constraints.push(c);return c;}
  addSimulationStepListener(fn){this._listeners.push(fn);return{dispose:()=>{this._listeners=this._listeners.filter(f=>f!==fn);}};}
  step(nanos){const dt=Math.min(nanos/1e9*TIME_SCALE,MAX_VALID_DT);this.dt=dt;this.now+=dt;this.updateAll(dt);this.solveAll(dt);this.postUpdateAll(dt);for(const fn of this._listeners)fn();}
  updateAll(dt){for(const e of this.entities)e.update?.(this,dt);}
  solveAll(dt){for(const c of this.constraints)c.solve?.(this,dt);}
  postUpdateAll(dt){for(const e of this.entities)e.postUpdate?.(this,dt);}
}

// ============================================================
// Universe — Star, Planet, Track, Spacecraft, Landing, Spark, Universe
// ============================================================
const StarClass={O:{name:'O',color:'#9bb0ff'},B:{name:'B',color:'#aabfff'},A:{name:'A',color:'#cad7ff'},F:{name:'F',color:'#f8f7ff'},G:{name:'G',color:'#fff4ea'},K:{name:'K',color:'#ffd2a1'},M:{name:'M',color:'#ffcc6f'}};
const STAR_CLASSES=[StarClass.O,StarClass.B,StarClass.A,StarClass.F,StarClass.G,StarClass.K,StarClass.M];

class Star extends Body{
  constructor(cls,radius){super();this.cls=cls;this.radius=radius;this.color=cls.color;this.mass=(4/3)*Math.PI*radius**3*STELLAR_DENSITY;this.collides=false;this.anim=0;this.name='';}
  update(sim,dt){this.anim+=dt;}
  postUpdate(){}
}
class Planet extends Body{
  constructor(orbitCenter,radius,pos,speed,color){super();this.orbitCenter=orbitCenter;this.radius=radius;this.pos=pos;this.speed=speed;this.color=color;this.mass=(4/3)*Math.PI*radius**3*PLANETARY_DENSITY;this.name='';this.description='';this.atmosphere='';this.flora='';this.fauna='';this.explored=false;}
  get orbitRadius(){return this.pos.distance(this.orbitCenter);}
  update(sim,dt){const toC=this.orbitCenter.minus(this.pos);const perp=new Vec2(-toC.y,toC.x);this.velocity=perp.div(perp.mag()).times(this.speed);super.update(sim,dt);}
  postUpdate(sim,dt){const toC=this.pos.minus(this.orbitCenter);const d=toC.mag();const target=this.orbitRadius;if(Math.abs(d-target)>0.01&&d>0){this.pos=this.orbitCenter.plus(toC.times(target/d));}super.postUpdate(sim,dt);}
}
class Track{constructor(){this.positions=[];}add(p){this.positions.push(new Vec2(p.x,p.y));if(this.positions.length>TRACK_LENGTH)this.positions.shift();}clear(){this.positions=[];}}
class Spacecraft extends Body{
  constructor(){super();this.mass=SPACECRAFT_MASS;this.radius=12;this.thrust=Vec2.Zero;this.launchClock=0;this.transit=false;this.track=new Track();this.landing=null;this.autopilot=null;}
  update(sim,dt){if(this.launchClock>0){this.launchClock-=dt;this.thrust=Vec2.makeWithAngleMag(this.angle,1);}if(this.thrust.mag()>0){this.velocity=this.velocity.plus(this.thrust.times(MAIN_ENGINE_ACCEL*dt));}if(this.velocity.mag()>CRAFT_SPEED_LIMIT){this.velocity=this.velocity.div(this.velocity.mag()).times(CRAFT_SPEED_LIMIT);}super.update(sim,dt);}
  postUpdate(sim,dt){super.postUpdate(sim,dt);this.track.add(this.pos);}
}
class Landing{
  constructor(ship,planet,angle,text){this.ship=ship;this.planet=planet;this.angle=angle;this.text=text;this.fuse=new Fuse(LANDING_REMOVAL_TIME);}
  solve(sim,dt){this.fuse.tick(dt);const surf=this.planet.pos.plus(Vec2.makeWithAngleMag(this.angle,this.planet.radius));this.ship.pos=surf;this.ship.velocity=Vec2.Zero;this.ship.angle=this.angle;this.ship.thrust=Vec2.Zero;}
  canBeRemoved(){return this.fuse.canBeRemoved();}
}
class Spark extends Body{
  static Style={LINE:0,LINE_ABSOLUTE:1,DOT:2,DOT_ABSOLUTE:3,RING:4};
  constructor(ttl,style,color,size){super();this.ttl=ttl;this.style=style;this.color=color;this.size=size;this.fuse=new Fuse(ttl);this.opos=Vec2.Zero;this.collides=false;}
  update(sim,dt){this.fuse.tick(dt);this.opos=this.pos;this.pos=this.pos.plus(this.velocity.times(dt));}
  postUpdate(sim,dt){if(dt>0)this.velocity=this.pos.minus(this.opos).div(dt);}
  canBeRemoved(){return this.fuse.canBeRemoved();}
}

class Universe extends Simulator{
  constructor(namer,randomSeed){super();this.namer=namer;this.randomSeed=randomSeed;this.rng=new RNG(randomSeed);this.star=null;this.planets=[];this.ship=null;this.follow=null;}
  initRandom(){
    const starCls=this.rng.choose(STAR_CLASSES);
    const starRadius=this.rng.nextFloatInRange(STAR_RADIUS_RANGE[0],STAR_RADIUS_RANGE[1]);
    this.star=new Star(starCls,starRadius);
    this.star.name=this.namer.nameSystem(this.rng);
    this.add(this.star);
    const n=this.rng.nextInt(NUM_PLANETS_RANGE[0],NUM_PLANETS_RANGE[1]+1);
    for(let i=0;i<n;i++){
      const orbitR=this.rng.nextFloatInRange(PLANET_ORBIT_RANGE[0],PLANET_ORBIT_RANGE[1]);
      const pRadius=this.rng.nextFloatInRange(PLANET_RADIUS_RANGE[0],PLANET_RADIUS_RANGE[1]);
      const angle=this.rng.nextFloat()*PI2f;
      const pos=Vec2.makeWithAngleMag(angle,orbitR);
      const speed=Math.sqrt(GRAVITATION*this.star.mass/orbitR)*KEPLER_CONSTANT;
      const hue=this.rng.nextFloat()*360;
      const color=`hsl(${hue},55%,60%)`;
      const p=new Planet(this.star.pos,pRadius,pos,speed,color);
      p.name=`${this.star.name} ${String.fromCharCode(98+i)}`;
      p.description=this.namer.describePlanet(this.rng);
      p.atmosphere=this.namer.describeAtmo(this.rng);
      p.flora=this.namer.describeLife(this.rng);
      p.fauna=this.namer.describeLife(this.rng);
      this.planets.push(p);this.add(p);
    }
    this.ship=new Spacecraft();
    const firstOrbit=this.planets.length>0?this.planets[0].orbitRadius:PLANET_ORBIT_RANGE[0];
    this.ship.pos=Vec2.makeWithAngleMag(0,firstOrbit+500);
    this.ship.angle=Math.PI/2;
    this.add(this.ship);this.follow=this.ship;
    this.addConstraint(new Container(UNIVERSE_RANGE,[this.ship]));
  }
  initTest(){
    this.star=new Star(StarClass.G,5000);this.star.name='Test Star';this.add(this.star);
    const p=new Planet(this.star.pos,500,new Vec2(20000,0),50,'#88CCFF');
    p.name='Test b';p.description='test planet';p.atmosphere='test atmo';p.flora='test flora';p.fauna='test fauna';
    this.planets.push(p);this.add(p);
    this.ship=new Spacecraft();this.ship.pos=new Vec2(21000,0);
    this.add(this.ship);this.follow=this.ship;
  }
  applyGravity(){
    const pull=(body)=>{const to=body.pos.minus(this.ship.pos);const d=to.mag();if(d>0){const accel=GRAVITATION*body.mass/(d*d);this.ship.velocity=this.ship.velocity.plus(to.div(d).times(accel*this.dt));}};
    pull(this.star);for(const p of this.planets)pull(p);
  }
  resolveCollisions(){
    for(const p of this.planets){
      const d=this.ship.pos.distance(p.pos);
      if(d<p.radius+this.ship.radius&&!this.ship.landing){
        const angle=this.ship.pos.minus(p.pos).angle();
        const text=this.namer.describeActivity(this.rng,p);
        const landing=new Landing(this.ship,p,angle,text);
        this.ship.landing=landing;this.addConstraint(landing);p.explored=true;
        for(let i=0;i<12;i++){const s=new Spark(0.8,Spark.Style.DOT,'#FFAA00',3);s.pos=this.ship.pos;s.velocity=Vec2.makeWithAngleMag(this.rng.nextFloat()*PI2f,this.rng.nextFloatInRange(50,250));this.add(s);}
      }
    }
    const dStar=this.ship.pos.distance(this.star.pos);
    if(dStar<this.star.radius+this.ship.radius){const r=this.planets.length>0?this.planets[0].orbitRadius:50000;this.ship.pos=Vec2.makeWithAngleMag(0,r);this.ship.velocity=Vec2.Zero;this.ship.track.clear();}
  }
  closestPlanet(){let best=this.planets[0],minD=Infinity;for(const p of this.planets){const d=this.ship.pos.distance(p.pos);if(d<minD){minD=d;best=p;}}return best;}
  step(nanos){
    const dt=Math.min(nanos/1e9*TIME_SCALE,MAX_VALID_DT);this.dt=dt;this.now+=dt;
    this.applyGravity();this.updateAll(dt);this.solveAll(dt);this.postUpdateAll(dt);this.resolveCollisions();
    this.entities=this.entities.filter(e=>!(e instanceof Spark)||!e.canBeRemoved());
    const expired=this.constraints.filter(c=>c instanceof Landing&&c.canBeRemoved());
    if(expired.length>0){this.constraints=this.constraints.filter(c=>!(c instanceof Landing)||!c.canBeRemoved());if(this.ship.landing&&this.ship.landing.canBeRemoved())this.ship.landing=null;}
    for(const fn of this._listeners)fn();
  }
}

// ============================================================
// Autopilot
// ============================================================
class Autopilot{
  constructor(ship,universe){this.ship=ship;this.universe=universe;this.BRAKING_TIME=5;this.SIGHTSEEING_TIME=15;this.LAUNCH_THRUST_TIME=5;this.STRATEGY_MIN_TIME=0.5;this.enabled=false;this.target=null;this.landingAltitude=0;this.nextStrategyTime=0;this.brakingDistance=0;this.leadingPos=Vec2.Zero;this.leadingVector=Vec2.Zero;this.strategy='NONE';this.debug='';}
  get telemetry(){if(!this.enabled)return'';return['---- AUTOPILOT ENGAGED ----','TGT: '+(this.target?.name?.toUpperCase()||'SELECTING...'),'EXE: '+this.strategy+(this.debug?` (${this.debug})`:'')].join('\n');}
  update(sim,dt){
    if(!this.enabled)return;if(sim.now<this.nextStrategyTime)return;
    const cur=this.strategy;
    if(this.ship.landing){
      if(this.target){this.strategy='LANDED';this.debug='';this.target=null;this.landingAltitude=0;this.nextStrategyTime=sim.now+this.SIGHTSEEING_TIME;}
      else{this.ship.thrust=Vec2.makeWithAngleMag(this.ship.angle,1);this.strategy='LAUNCHING';this.debug='';this.nextStrategyTime=sim.now+this.LAUNCH_THRUST_TIME;}
    }else{
      if(!this.target){const sorted=[...this.universe.planets].sort((a,b)=>a.pos.minus(this.ship.pos).mag()-b.pos.minus(this.ship.pos).mag());this.target=sorted.find(p=>!p.explored)||this.universe.rng.choose(this.universe.planets);this.brakingDistance=0;}
      if(this.target){
        const t=this.target;const shipV=this.ship.velocity,targetV=t.velocity;
        const targetVector=t.pos.minus(this.ship.pos);const altitude=targetVector.mag()-t.radius;
        this.landingAltitude=Math.min(t.radius,100);
        const relativeV=shipV.minus(targetV);
        const projection=relativeV.dot(targetVector.div(targetVector.mag()));
        const relativeSpeed=relativeV.mag()*Math.sign(projection);
        const timeToTarget=relativeSpeed!==0?altitude/relativeSpeed:1000;
        const newBD=this.BRAKING_TIME*(relativeSpeed>0?relativeSpeed:MAIN_ENGINE_ACCEL);
        this.brakingDistance=expSmooth(this.brakingDistance,newBD,sim.dt,5);
        this.leadingPos=t.pos.plus(Vec2.makeWithAngleMag(t.velocity.angle(),Math.min(altitude/2,t.velocity.mag())));
        this.leadingVector=this.leadingPos.minus(this.ship.pos);
        if(altitude<this.landingAltitude){this.strategy='LANDING';this.ship.angle=this.ship.pos.minus(t.pos).angle();this.ship.thrust=Vec2.Zero;}
        else if(relativeSpeed<0||altitude>this.brakingDistance){this.strategy='CHASING';this.ship.angle=this.leadingVector.angle();this.ship.thrust=Vec2.makeWithAngleMag(this.ship.angle,1.0);}
        else{this.strategy='APPROACHING';this.ship.angle=this.ship.velocity.negate().angle();const decel=relativeSpeed/timeToTarget;const decelThrust=(decel/MAIN_ENGINE_ACCEL)*0.9;this.ship.thrust=Vec2.makeWithAngleMag(this.ship.angle,decelThrust);}
        this.debug=`DV=${relativeSpeed.toFixed(0)} D=${altitude.toFixed(0)} T${timeToTarget.toFixed(1)}`;
      }
      if(this.strategy!==cur)this.nextStrategyTime=sim.now+this.STRATEGY_MIN_TIME;
    }
  }
  postUpdate(){}
}

// ============================================================
// Rendering — Canvas 2D
// ============================================================
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

let cameraZoom=DEFAULT_CAMERA_ZOOM;
let cameraOffset=Vec2.Zero;
function worldToScreen(p){const vw=W/cameraZoom,vh=H/cameraZoom;const cx=-cameraOffset.x-vw*0.5,cy=-cameraOffset.y-vh*0.5;return new Vec2((p.x-cx)*cameraZoom,(p.y-cy)*cameraZoom);}

function drawGrid(u){
  const vw=W/cameraZoom,vh=H/cameraZoom;const left=-cameraOffset.x-vw*0.5,top=-cameraOffset.y-vh*0.5;
  let gs=1000;while(gs*cameraZoom<32)gs*=10;
  let x=Math.floor(left/gs)*gs;
  while(x<left+vw){const sx=(x-left)*cameraZoom;const major=(x%(gs*10))===0;ctx.strokeStyle=Colors.Eigengrau2;ctx.lineWidth=major?1.5:0.75;ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();x+=gs;}
  let y=Math.floor(top/gs)*gs;
  while(y<top+vh){const sy=(y-top)*cameraZoom;const major=(y%(gs*10))===0;ctx.strokeStyle=Colors.Eigengrau2;ctx.lineWidth=major?1.5:0.75;ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();y+=gs;}
}
function drawStar(star){
  const s=worldToScreen(star.pos);const r=star.radius*cameraZoom;
  ctx.fillStyle=star.color;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(r,2),0,PI2f);ctx.fill();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(star.anim/23*PI2f);
  drawPolyPath(ctx,createStarPoints((star.radius+80)*cameraZoom,(star.radius+250)*cameraZoom,STAR_POINTS));
  ctx.strokeStyle=star.color;ctx.lineWidth=2;ctx.globalAlpha=0.6;ctx.stroke();ctx.globalAlpha=1;ctx.restore();
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(star.anim/-19*PI2f);
  drawPolyPath(ctx,createStarPoints((star.radius+20)*cameraZoom,(star.radius+200)*cameraZoom,STAR_POINTS+1));
  ctx.strokeStyle=star.color;ctx.lineWidth=2;ctx.globalAlpha=0.4;ctx.stroke();ctx.globalAlpha=1;ctx.restore();
}
function drawPlanet(p){
  const c=worldToScreen(p.orbitCenter),s=worldToScreen(p.pos),r=p.radius*cameraZoom;
  if(DRAW_ORBITS){const or=p.orbitRadius*cameraZoom;ctx.strokeStyle='rgba(0,255,255,0.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(c.x,c.y,or,0,PI2f);ctx.stroke();}
  ctx.fillStyle=Colors.Eigengrau;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(r,1.5),0,PI2f);ctx.fill();
  ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(r,1.5),0,PI2f);ctx.stroke();
}
function drawSpacecraft(ship){
  const s=worldToScreen(ship.pos);
  ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ship.angle);
  const sc=cameraZoom*3;ctx.scale(sc,sc);
  if(ship.landing){drawSvgPath(ctx,spaceshipLegs);ctx.strokeStyle='#CCCCCC';ctx.lineWidth=2/sc;ctx.stroke();}
  drawSvgPath(ctx,spaceshipPath);ctx.fillStyle=Colors.Eigengrau;ctx.fill();
  drawSvgPath(ctx,spaceshipPath);ctx.strokeStyle=ship.transit?'#000':'#fff';ctx.lineWidth=2/sc;ctx.stroke();
  if(ship.thrust.mag()>0){drawPolyPath(ctx,thrustPathPts);ctx.strokeStyle='#FF8800';ctx.lineWidth=2/sc;ctx.stroke();}
  ctx.restore();
  drawTrack(ship.track);
}
function drawTrack(track){
  if(track.positions.length<2)return;
  if(SIMPLE_TRACK_DRAWING){ctx.strokeStyle=Colors.Track;ctx.lineWidth=1;ctx.beginPath();const f=worldToScreen(track.positions[0]);ctx.moveTo(f.x,f.y);for(let i=1;i<track.positions.length;i++){const p=worldToScreen(track.positions[i]);ctx.lineTo(p.x,p.y);}ctx.stroke();}
  else{let prev=track.positions[track.positions.length-1];let a=0.5;for(let i=track.positions.length-2;i>=0;i--){const p0=worldToScreen(prev),p1=worldToScreen(track.positions[i]);ctx.strokeStyle=`rgba(0,255,0,${a})`;ctx.lineWidth=Math.max(1,1/cameraZoom);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.stroke();prev=track.positions[i];a=clamp(a-1/TRACK_LENGTH,0,1);}}
}
function drawLanding(landing){
  const v=landing.planet.pos.plus(Vec2.makeWithAngleMag(landing.angle,landing.planet.radius));
  const sv=worldToScreen(v);const h=80*cameraZoom;
  ctx.save();ctx.translate(sv.x,sv.y);ctx.rotate(landing.angle);
  ctx.strokeStyle=Colors.Flag;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(h,0);ctx.lineTo(h*0.875,h*0.25);ctx.lineTo(h*0.75,0);ctx.closePath();ctx.stroke();
  ctx.restore();
}
function drawSpark(spark){
  if(spark.fuse.lifetime<0)return;const life=1-spark.fuse.lifetime/spark.ttl;const p=worldToScreen(spark.pos);
  switch(spark.style){
    case Spark.Style.LINE:if(spark.opos.mag()>0){const o=worldToScreen(spark.opos);ctx.strokeStyle=spark.color;ctx.lineWidth=spark.size;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(p.x,p.y);ctx.stroke();}break;
    case Spark.Style.DOT:ctx.fillStyle=spark.color;ctx.beginPath();ctx.arc(p.x,p.y,spark.size,0,PI2f);ctx.fill();break;
    case Spark.Style.RING:ctx.strokeStyle=spark.color;ctx.globalAlpha=1-life;ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,Math.exp(lerp(spark.size,3*spark.size,life))-1,0,PI2f);ctx.stroke();ctx.globalAlpha=1;break;
  }
}
function drawAutopilot(ap){
  if(!ap.target)return;const t=ap.target,tc=worldToScreen(t.pos);
  const color=ap.enabled?Colors.Autopilot:'rgba(66,133,244,0.5)';
  ctx.save();ctx.translate(tc.x,tc.y);ctx.rotate(ap.universe.now*PI2f/10);
  const br=(t.radius+ap.brakingDistance)*cameraZoom;
  drawPolyPath(ctx,createPolygonPoints(br,15));ctx.strokeStyle=color;ctx.globalAlpha=0.5;ctx.lineWidth=1;ctx.stroke();
  const la=(t.radius+ap.landingAltitude/2)*cameraZoom;ctx.beginPath();ctx.arc(0,0,la,0,PI2f);ctx.globalAlpha=0.25;ctx.stroke();ctx.globalAlpha=1;ctx.restore();
  const lp=worldToScreen(ap.leadingPos),sp=worldToScreen(ap.ship.pos);
  ctx.strokeStyle=color;ctx.globalAlpha=0.5;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sp.x,sp.y);ctx.lineTo(lp.x,lp.y);ctx.stroke();
  ctx.beginPath();ctx.arc(lp.x,lp.y,5,0,PI2f);ctx.stroke();ctx.globalAlpha=1;
}
function render(u){
  ctx.fillStyle=Colors.Eigengrau;ctx.fillRect(0,0,W,H);
  const closest=u.closestPlanet();
  const dist=Math.max(0,u.ship.pos.distance(closest.pos)-closest.radius*1.2);
  const tz=DYNAMIC_ZOOM?clamp(500/dist,MIN_CAMERA_ZOOM,MAX_CAMERA_ZOOM):DEFAULT_CAMERA_ZOOM;
  cameraZoom=expSmooth(cameraZoom,tz,u.dt,1.5);
  cameraOffset=(u.follow?.pos||Vec2.Zero).negate();
  drawGrid(u);
  for(const c of u.constraints){
    if(c instanceof Landing)drawLanding(c);
    else if(c instanceof Container){const cc=worldToScreen(Vec2.Zero);ctx.strokeStyle='rgba(128,0,0,0.5)';ctx.lineWidth=1;ctx.setLineDash([8,8]);ctx.beginPath();ctx.arc(cc.x,cc.y,c.radius*cameraZoom,0,PI2f);ctx.stroke();ctx.setLineDash([]);}
  }
  drawStar(u.star);
  for(const e of u.entities){if(e===u.star)continue;if(e instanceof Spark)drawSpark(e);else if(e instanceof Planet)drawPlanet(e);}
  if(u.ship.autopilot)drawAutopilot(u.ship.autopilot);
  drawSpacecraft(u.ship);
}

// ============================================================
// Telemetry
// ============================================================
const elCatalog=document.getElementById('catalog');
const elStatus=document.getElementById('status');
const elAutoTel=document.getElementById('autopilot-tel');
const elControls=document.getElementById('controls');
function getSystemDesignation(u){return `BKL-${u.randomSeed%100000}`;}
function updateTelemetry(u){
  const explored=u.planets.filter(p=>p.explored);
  let cat=`  STAR: ${u.star.name} (${getSystemDesignation(u)})\n CLASS: ${u.star.cls.name}\nRADIUS: ${u.star.radius.toFixed(0)}\n  MASS: ${u.star.mass.toExponential(2)}\nBODIES: ${explored.length} / ${u.planets.length}\n\n`;
  for(const p of explored){cat+=`  BODY: ${p.name}\n  TYPE: ${p.description}\n  ATMO: ${p.atmosphere}\n FAUNA: ${p.fauna}\n FLORA: ${p.flora}\n\n`;}
  elCatalog.textContent=cat;
  const ap=u.ship.autopilot;
  if(ap&&ap.enabled){elAutoTel.textContent=ap.telemetry;elAutoTel.style.display='block';}
  else elAutoTel.style.display='none';
  const closest=u.closestPlanet();
  const distC=Math.round(closest.pos.distance(u.ship.pos)-closest.radius);
  const lines=[];
  if(u.ship.landing){lines.push(`LND: ${u.ship.landing.planet.name.toUpperCase()}`);lines.push(`JOB: ${u.ship.landing.text.toUpperCase()}`);}
  else if(distC<10000)lines.push(`ALT: ${distC}`);
  lines.push(`THR: ${(u.ship.thrust.mag()*100).toFixed(0)}%`);
  lines.push(`POS: ${u.ship.pos.str()}`);
  lines.push(`VEL: ${u.ship.velocity.mag().toFixed(0)}`);
  elStatus.textContent=lines.join('\n');
}

// ============================================================
// Controls — FlightStick + keyboard
// ============================================================
let stickOrigin=null,stickTarget=null;
const STICK_MIN=30,STICK_MAX=100;
function handleStick(vec){const ship=universe.ship;if(vec.mag()===0){ship.thrust=Vec2.Zero;return;}const a=vec.angle();ship.angle=a;const m=vec.mag();if(m<STICK_MIN)ship.thrust=Vec2.Zero;else{const t=clamp(lexp(STICK_MIN,STICK_MAX,m),0,1);ship.thrust=Vec2.makeWithAngleMag(a,t);}}
canvas.addEventListener('pointerdown',e=>{stickOrigin=new Vec2(e.clientX,e.clientY);stickTarget=new Vec2(e.clientX,e.clientY);});
canvas.addEventListener('pointermove',e=>{if(!stickOrigin)return;stickTarget=new Vec2(e.clientX,e.clientY);handleStick(stickTarget.minus(stickOrigin));});
canvas.addEventListener('pointerup',()=>{stickOrigin=null;stickTarget=null;handleStick(Vec2.Zero);});
canvas.addEventListener('pointercancel',()=>{stickOrigin=null;stickTarget=null;handleStick(Vec2.Zero);});

const keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;const k=e.key.toLowerCase();if(k==='a')toggleAutopilot();if(k==='r')resetUniverse();if(k==='o'){DRAW_ORBITS=!DRAW_ORBITS;updateBtnStates();}if(k==='f'){DRAW_GRAVITATIONAL_FIELDS=!DRAW_GRAVITATIONAL_FIELDS;updateBtnStates();}});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function applyKeyboard(){
  if(stickOrigin)return;
  const ship=universe.ship;let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
  if(dx===0&&dy===0){if(!ship.autopilot?.enabled)ship.thrust=Vec2.Zero;return;}
  const a=Math.atan2(dy,dx);ship.angle=a;ship.thrust=Vec2.makeWithAngleMag(a,1);
}

// ============================================================
// Universe lifecycle
// ============================================================
let universe=null,autopilot=null;
function createUniverse(){const seed=Math.floor(Math.random()*10000000);const namer=new Namer();universe=new Universe(namer,seed);if(TEST_UNIVERSE)universe.initTest();else universe.initRandom();autopilot=new Autopilot(universe.ship,universe);universe.ship.autopilot=autopilot;universe.add(autopilot);autopilot.enabled=false;DYNAMIC_ZOOM=false;}
function toggleAutopilot(){if(!autopilot)return;autopilot.enabled=!autopilot.enabled;DYNAMIC_ZOOM=autopilot.enabled;if(!autopilot.enabled)universe.ship.thrust=Vec2.Zero;updateBtnStates();}
function resetUniverse(){createUniverse();updateBtnStates();}
function updateBtnStates(){document.getElementById('btn-auto').classList.toggle('active',autopilot?.enabled);document.getElementById('btn-orbit').classList.toggle('active',DRAW_ORBITS);document.getElementById('btn-gravity').classList.toggle('active',DRAW_GRAVITATIONAL_FIELDS);}
document.getElementById('btn-auto').addEventListener('click',toggleAutopilot);
document.getElementById('btn-reset').addEventListener('click',resetUniverse);
document.getElementById('btn-orbit').addEventListener('click',()=>{DRAW_ORBITS=!DRAW_ORBITS;updateBtnStates();});
document.getElementById('btn-gravity').addEventListener('click',()=>{DRAW_GRAVITATIONAL_FIELDS=!DRAW_GRAVITATIONAL_FIELDS;updateBtnStates();});
document.getElementById('btn-track').addEventListener('click',()=>{});

// ============================================================
// Main loop
// ============================================================
let lastTime=0;
function loop(ts){if(!lastTime){lastTime=ts;requestAnimationFrame(loop);return;}const nanos=(ts-lastTime)*1e6;lastTime=ts;applyKeyboard();universe.step(nanos);render(universe);updateTelemetry(universe);requestAnimationFrame(loop);}

createUniverse();
setTimeout(()=>{elCatalog.classList.add('visible');elStatus.classList.add('visible');elControls.classList.add('visible');},1000);
requestAnimationFrame(loop);
</script>
