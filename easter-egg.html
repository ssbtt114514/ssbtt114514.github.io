     * Register [listener] to be invoked every time the [Simulator] completes one [step].\n     * Use this to enqueue drawing.\n     *\n     * Instead of the usual register()/unregister() pattern, we're going to borrow\n     * [kotlinx.coroutines.DisposableHandle] here. Call [DisposableHandle.dispose] on the return\n     * value to unregister.\n     */\n    fun addSimulationStepListener(listener: () -> Unit): DisposableHandle {\n        // add to listener list\n        simStepListeners += listener\n\n        return DisposableHandle {\n            // on dispose, remove from listener list\n            simStepListeners -= listener\n        }\n    }\n}\n\n\npackage com.android_baklava.egg.landroid\n\nimport kotlin.random.Random\n\n/**\n * A bag of stones. Each time you pull one out it is not replaced, preventing duplicates. When the\n * bag is exhausted, all the stones are replaced and reshuffled.\n */\nclass Bag<T>(items: Array<T>) {\n    private val remaining = items.copyOf()\n    private var next = remaining.size // will cause a shuffle on first pull()\n\n    /** Return the next random item from the bag, without replacing it. */\n    fun pull(rng: Random): T {\n        if (next >= remaining.size) {\n            remaining.shuffle(rng)\n            next = 0\n        }\n        return remaining[next++]\n    }\n}\n\n/**\n * A loot table. The weight of each possibility is in the first of the pair; the value to be\n * returned in the second. They need not add up to 1f (we will do that for you, free of charge).\n */\nclass RandomTable<T>(private vararg val pairs: Pair<Float, T>) {\n    private val total = pairs.map { it.first }.sum()\n\n    /** Select a random value from the weighted table. */\n    fun roll(rng: Random): T {\n        var x = rng.nextFloatInRange(0f, total)\n        for ((weight, result) in pairs) {\n            x -= weight\n            if (x < 0f) return result\n        }\n        return pairs.last().second\n    }\n}\n\n/** Return a random float in the range [from, until). */\nfun Random.nextFloatInRange(from: Float, until: Float): Float =\n    from + ((until - from) * nextFloat())\n\n/** Return a random float in the range [start, end). */\nfun Random.nextFloatInRange(fromUntil: ClosedFloatingPointRange<Float>): Float =\n    nextFloatInRange(fromUntil.start, fromUntil.endInclusive)\n\n/** Return a random float in the range [first, second). */\nfun Random.nextFloatInRange(fromUntil: Pair<Float, Float>): Float =\n    nextFloatInRange(fromUntil.first, fromUntil.second)\n\n/** Choose a random element from an array. */\nfun <T> Random.choose(array: Array<T>) = array[nextInt(array.size)]\n\n\npackage com.android_baklava.egg.landroid\n\nimport androidx.collection.ArraySet\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.util.lerp\nimport kotlin.math.absoluteValue\nimport kotlin.math.pow\nimport kotlin.math.sqrt\n\nconst val UNIVERSE_RANGE = 200_000f\n\nval NUM_PLANETS_RANGE = 1..10\nval STAR_RADIUS_RANGE = (1_000f..8_000f)\nval PLANET_RADIUS_RANGE = (50f..2_000f)\nval PLANET_ORBIT_RANGE = (STAR_RADIUS_RANGE.endInclusive * 2f)..(UNIVERSE_RANGE * 0.75f)\n\nconst val GRAVITATION = 1e-2f\nconst val KEPLER_CONSTANT = 50f // * 4f * PIf * PIf / GRAVITATION\n\n// m = d * r\nconst val PLANETARY_DENSITY = 2.5f\nconst val STELLAR_DENSITY = 0.5f\n\nconst val SPACECRAFT_MASS = 10f\n\nconst val CRAFT_SPEED_LIMIT = 5_000f\nconst val MAIN_ENGINE_ACCEL = 1000f // thrust effect, pixels per second squared\nconst val LAUNCH_MECO = 2f // how long to suspend gravity when launching\n\nconst val LANDING_REMOVAL_TIME = 60 * 15f // 15 min of simulation time\n\nconst val SCALED_THRUST = true\n\nopen class Planet(\n    val orbitCenter: Vec2,\n    radius: Float,\n    pos: Vec2,\n    var speed: Float,\n    var color: Color = Color.White\n) : Body() {\n    var atmosphere = \"\"\n    var description = \"\"\n    var flora = \"\"\n    var fauna = \"\"\n    var explored = false\n    private val orbitRadius: Float\n    init {\n        this.radius = radius\n        this.pos = pos\n        orbitRadius = pos.distance(orbitCenter)\n        mass = 4 / 3 * PIf * radius.pow(3) * PLANETARY_DENSITY\n    }\n\n    override fun update(sim: Simulator, dt: Float) {\n        val orbitAngle = (pos - orbitCenter).angle()\n        // constant linear velocity\n        velocity = Vec2.makeWithAngleMag(orbitAngle + PIf / 2f, speed)\n\n        super.update(sim, dt)\n    }\n\n    override fun postUpdate(sim: Simulator, dt: Float) {\n        // This is kind of like a constraint, but whatever.\n        val orbitAngle = (pos - orbitCenter).angle()\n        pos = orbitCenter + Vec2.makeWithAngleMag(orbitAngle, orbitRadius)\n        super.postUpdate(sim, dt)\n    }\n}\n\nenum class StarClass {\n    O,\n    B,\n    A,\n    F,\n    G,\n    K,\n    M\n}\n\nfun starColor(cls: StarClass) =\n    when (cls) {\n        StarClass.O -> Color(0xFF6666FF)\n        StarClass.B -> Color(0xFFCCCCFF)\n        StarClass.A -> Color(0xFFEEEEFF)\n        StarClass.F -> Color(0xFFFFFFFF)\n        StarClass.G -> Color(0xFFFFFF66)\n        StarClass.K -> Color(0xFFFFCC33)\n        StarClass.M -> Color(0xFFFF8800)\n    }\n\nclass Star(val cls: StarClass, radius: Float) :\n    Planet(orbitCenter = Vec2.Zero, radius = radius, pos = Vec2.Zero, speed = 0f) {\n    init {\n        pos = Vec2.Zero\n        mass = 4 / 3 * PIf * radius.pow(3) * STELLAR_DENSITY\n        color = starColor(cls)\n        collides = false\n    }\n    var anim = 0f\n    override fun update(sim: Simulator, dt: Float) {\n        anim += dt\n    }\n}\n\nopen class Universe(val namer: Namer, randomSeed: Long) : Simulator(randomSeed) {\n    var latestDiscovery: Planet? = null\n    lateinit var star: Star\n    lateinit var ship: Spacecraft\n    val planets: MutableList<Planet> = mutableListOf()\n    var follow: Body? = null\n    val ringfence = Container(UNIVERSE_RANGE)\n\n    fun initTest() {\n        val systemName = \"TEST SYSTEM\"\n        star =\n            Star(\n                    cls = StarClass.A,\n                    radius = STAR_RADIUS_RANGE.endInclusive,\n                )\n                .apply { name = \"TEST SYSTEM\" }\n\n        repeat(NUM_PLANETS_RANGE.last) {\n            val thisPlanetFrac = it.toFloat() / (NUM_PLANETS_RANGE.last - 1)\n            val radius =\n                lerp(PLANET_RADIUS_RANGE.start, PLANET_RADIUS_RANGE.endInclusive, thisPlanetFrac)\n            val orbitRadius =\n                lerp(PLANET_ORBIT_RANGE.start, PLANET_ORBIT_RANGE.endInclusive, thisPlanetFrac)\n\n            val period = sqrt(orbitRadius.pow(3f) / star.mass) * KEPLER_CONSTANT\n            val speed = 2f * PIf * orbitRadius / period\n\n            val p =\n                Planet(\n                    orbitCenter = star.pos,\n                    radius = radius,\n                    pos = star.pos + Vec2.makeWithAngleMag(thisPlanetFrac * PI2f, orbitRadius),\n                    speed = speed,\n                    color = Colors.Eigengrau4\n                )\n            android.util.Log.v(\"Landroid\", \"created planet $p with period $period and vel $speed\")\n            val num = it + 1\n            p.description = \"TEST PLANET #$num\"\n            p.atmosphere = \"radius=$radius\"\n            p.flora = \"mass=${p.mass}\"\n            p.fauna = \"speed=$speed\"\n            planets.add(p)\n            add(p)\n        }\n\n        planets.sortBy { it.pos.distance(star.pos) }\n        planets.forEachIndexed { idx, planet -> planet.name = \"$systemName ${idx + 1}\" }\n        add(star)\n\n        ship = Spacecraft()\n\n        // in the test universe, start the ship near the outermost planet\n        ship.pos = planets.last().pos + Vec2(planets.first().radius * 1.5f, 0f)\n\n        ship.angle = 0f\n        add(ship)\n\n        ringfence.add(ship)\n        add(ringfence)\n\n        follow = ship\n    }\n\n    fun initRandom() {\n        val systemName = namer.nameSystem(rng)\n        star =\n            Star(\n                cls = rng.choose(StarClass.values()),\n                radius = rng.nextFloatInRange(STAR_RADIUS_RANGE)\n            )\n        star.name = systemName\n        repeat(rng.nextInt(NUM_PLANETS_RANGE.first, NUM_PLANETS_RANGE.last + 1)) {\n            val radius = rng.nextFloatInRange(PLANET_RADIUS_RANGE)\n            val orbitRadius =\n                lerp(\n                    PLANET_ORBIT_RANGE.start,\n                    PLANET_ORBIT_RANGE.endInclusive,\n                    rng.nextFloat().pow(1f)\n                )\n\n            // Kepler's third law\n            val period = sqrt(orbitRadius.pow(3f) / star.mass) * KEPLER_CONSTANT\n            val speed = 2f * PIf * orbitRadius / period\n\n            val p =\n                Planet(\n                    orbitCenter = star.pos,\n                    radius = radius,\n                    pos = star.pos + Vec2.makeWithAngleMag(rng.nextFloat() * PI2f, orbitRadius),\n                    speed = speed,\n                    color = Colors.Eigengrau4\n                )\n            android.util.Log.v(\"Landroid\", \"created planet $p with period $period and vel $speed\")\n            p.description = namer.describePlanet(rng)\n            p.atmosphere = namer.describeAtmo(rng)\n            p.flora = namer.describeLife(rng)\n            p.fauna = namer.describeLife(rng)\n            planets.add(p)\n            add(p)\n        }\n        planets.sortBy { it.pos.distance(star.pos) }\n        planets.forEachIndexed { idx, planet -> planet.name = \"$systemName ${idx + 1}\" }\n        add(star)\n\n        ship = Spacecraft()\n\n        ship.pos =\n            star.pos +\n                Vec2.makeWithAngleMag(\n                    rng.nextFloat() * PI2f,\n                    rng.nextFloatInRange(PLANET_ORBIT_RANGE.start, PLANET_ORBIT_RANGE.endInclusive)\n                )\n        ship.angle = rng.nextFloat() * PI2f\n        add(ship)\n\n        ringfence.add(ship)\n        add(ringfence)\n\n        follow = ship\n    }\n\n    override fun updateAll(dt: Float, entities: ArraySet<Entity>) {\n        // check for passing in front of the sun\n        ship.transit = false\n\n        (planets + star).forEach { planet ->\n            val vector = planet.pos - ship.pos\n            val d = vector.mag()\n            if (d < planet.radius) {\n                if (planet is Star) ship.transit = true\n            } else if (\n                now > ship.launchClock + LAUNCH_MECO\n            ) { // within MECO sec of launch, no gravity at all\n                // simulate gravity: $ f_g = G * m1 * m2 * 1/d^2 $\n                ship.velocity =\n                    ship.velocity +\n                        Vec2.makeWithAngleMag(\n                            vector.angle(),\n                            GRAVITATION * (ship.mass * planet.mass) / d.pow(2)\n                        ) * dt\n            }\n        }\n\n        super.updateAll(dt, entities)\n    }\n\n    fun closestPlanet(): Planet {\n        val bodiesByDist =\n            (planets + star)\n                .map { planet -> (planet.pos - ship.pos) to planet }\n                .sortedBy { it.first.mag() }\n\n        return bodiesByDist[0].second\n    }\n\n    override fun solveAll(dt: Float, constraints: ArraySet<Constraint>) {\n        if (ship.landing == null) {\n            val planet = closestPlanet()\n\n            if (planet.collides) {\n                val d = (ship.pos - planet.pos).mag() - ship.radius - planet.radius\n                val a = (ship.pos - planet.pos).angle()\n\n                if (d < 0) {\n                    // landing, or impact?\n\n                    // 1. relative speed\n                    val vDiff = (ship.velocity - planet.velocity).mag()\n                    // 2. landing angle\n                    val aDiff = (ship.angle - a).absoluteValue\n\n                    // landing criteria\n                    if (aDiff < PIf / 4\n                    //                        &&\n                    //                        vDiff < 100f\n                    ) {\n                        val landing = Landing(ship, planet, a, namer.describeActivity(rng, planet))\n                        if (ship.thrust != Vec2.Zero) {\n                            // kill the power\n                            ship.thrust = Vec2.Zero\n                        }\n                        ship.landing = landing\n                        ship.velocity = planet.velocity\n                        add(landing)\n\n                        planet.explored = true\n                        latestDiscovery = planet\n                    } else {\n                        val impact = planet.pos + Vec2.makeWithAngleMag(a, planet.radius)\n                        ship.pos =\n                            planet.pos + Vec2.makeWithAngleMag(a, planet.radius + ship.radius - d)\n\n                        //                        add(Spark(\n                        //                            lifetime = 1f,\n                        //                            style = Spark.Style.DOT,\n                        //                            color = Color.Yellow,\n                        //                            size = 10f\n                        //                        ).apply {\n                        //                            pos = impact\n                        //                            opos = impact\n                        //                            velocity = Vec2.Zero\n                        //                        })\n                        //\n                        (1..10).forEach {\n                            Spark(\n                                    ttl = rng.nextFloatInRange(0.5f, 2f),\n                                    style = Spark.Style.DOT,\n                                    color = Color.White,\n                                    size = 1f\n                                )\n                                .apply {\n                                    pos =\n                                        impact +\n                                            Vec2.makeWithAngleMag(\n                                                rng.nextFloatInRange(0f, 2 * PIf),\n                                                rng.nextFloatInRange(0.1f, 0.5f)\n                                            )\n                                    opos = pos\n                                    velocity =\n                                        ship.velocity * 0.8f +\n                                            Vec2.makeWithAngleMag(\n                                                //                                            a +\n                                                // rng.nextFloatInRange(-PIf, PIf),\n                                                rng.nextFloatInRange(0f, 2 * PIf),\n                                                rng.nextFloatInRange(0.1f, 0.5f)\n                                            )\n                                    add(this)\n                                }\n                        }\n                    }\n                }\n            }\n        }\n\n        super.solveAll(dt, constraints)\n    }\n\n    override fun postUpdateAll(dt: Float, entities: ArraySet<Entity>) {\n        super.postUpdateAll(dt, entities)\n\n        entities\n            .filterIsInstance<Removable>()\n            .filter(predicate = Removable::canBeRemoved)\n            .forEach { remove(it as Entity) }\n\n        constraints\n            .filterIsInstance<Removable>()\n            .filter(predicate = Removable::canBeRemoved)\n            .forEach { remove(it as Constraint) }\n    }\n}\n\nclass Landing(\n    var ship: Spacecraft?,\n    val planet: Planet,\n    val angle: Float,\n    val text: String = \"\",\n    private val fuse: Fuse = Fuse(LANDING_REMOVAL_TIME)\n) : Constraint, Removable by fuse {\n    override fun solve(sim: Simulator, dt: Float) {\n        ship?.let { ship ->\n            val landingVector = Vec2.makeWithAngleMag(angle, ship.radius + planet.radius)\n            val desiredPos = planet.pos + landingVector\n            ship.pos = (ship.pos * 0.5f) + (desiredPos * 0.5f) // @@@ FIXME\n            ship.angle = angle\n        }\n\n        fuse.update(dt)\n    }\n}\n\nclass Spark(\n    var ttl: Float,\n    collides: Boolean = false,\n    mass: Float = 0f,\n    val style: Style = Style.LINE,\n    val color: Color = Color.Gray,\n    val size: Float = 2f,\n    val fuse: Fuse = Fuse(ttl)\n) : Removable by fuse, Body(name = \"Spark\") {\n    enum class Style {\n        LINE,\n        LINE_ABSOLUTE,\n        DOT,\n        DOT_ABSOLUTE,\n        RING\n    }\n\n    init {\n        this.collides = collides\n        this.mass = mass\n    }\n    override fun update(sim: Simulator, dt: Float) {\n        super.update(sim, dt)\n        fuse.update(dt)\n    }\n}\n\nconst val TRACK_LENGTH = 10_000\nconst val SIMPLE_TRACK_DRAWING = true\n\nclass Track {\n    val positions = ArrayDeque<Vec2>(TRACK_LENGTH)\n    private val angles = ArrayDeque<Float>(TRACK_LENGTH)\n    fun add(x: Float, y: Float, a: Float) {\n        if (positions.size >= (TRACK_LENGTH - 1)) {\n            positions.removeFirst()\n            angles.removeFirst()\n            positions.removeFirst()\n            angles.removeFirst()\n        }\n        positions.addLast(Vec2(x, y))\n        angles.addLast(a)\n    }\n}\n\nclass Spacecraft : Body() {\n    var thrust = Vec2.Zero\n    var launchClock = 0f\n\n    var transit = false\n\n    val track = Track()\n\n    var landing: Landing? = null\n    var autopilot: Autopilot? = null\n\n    init {\n        mass = SPACECRAFT_MASS\n        radius = 12f\n    }\n\n    override fun update(sim: Simulator, dt: Float) {\n        // check for thrusters\n        val thrustMag = thrust.mag()\n        if (thrustMag > 0) {\n            var deltaV = MAIN_ENGINE_ACCEL * dt\n            if (SCALED_THRUST) deltaV *= thrustMag.coerceIn(0f, 1f)\n\n            // check if we are currently attached to a landing\n            landing?.let { landing ->\n                // launch clock is 1 second long\n                if (launchClock == 0f) launchClock = sim.now + 1f /* @@@ TODO extract */\n\n                if (sim.now > launchClock) {\n                    // detach from landing site\n                    landing.ship = null\n                    this.landing = null\n                } else {\n                    deltaV = 0f\n                }\n            }\n\n            // this is it. impart thrust to the ship.\n            // note that we always thrust in the forward direction\n            velocity += Vec2.makeWithAngleMag(angle, deltaV)\n        } else {\n            if (launchClock != 0f) launchClock = 0f\n        }\n\n        // apply global speed limit\n        if (velocity.mag() > CRAFT_SPEED_LIMIT)\n            velocity = Vec2.makeWithAngleMag(velocity.angle(), CRAFT_SPEED_LIMIT)\n\n        super.update(sim, dt)\n    }\n\n    override fun postUpdate(sim: Simulator, dt: Float) {\n        super.postUpdate(sim, dt)\n\n        // special effects all need to be added after the simulation step so they have\n        // the correct position of the ship.\n        track.add(pos.x, pos.y, angle)\n\n        val mag = thrust.mag()\n        if (sim.rng.nextFloat() < mag) {\n            // exhaust\n            sim.add(\n                Spark(\n                        ttl = sim.rng.nextFloatInRange(0.5f, 1f),\n                        collides = true,\n                        mass = 1f,\n                        style = Spark.Style.RING,\n                        size = 1f,\n                        color = Color(0x40FFFFFF)\n                    )\n                    .also { spark ->\n                        spark.pos = pos\n                        spark.opos = pos\n                        spark.velocity =\n                            velocity +\n                                Vec2.makeWithAngleMag(\n                                    angle + sim.rng.nextFloatInRange(-0.2f, 0.2f),\n                                    -MAIN_ENGINE_ACCEL * mag * 10f * dt\n                                )\n                    }\n            )\n        }\n    }\n}\n\n\npackage com.android_baklava.egg.landroid\n\nimport android.app.Notification\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.app.PendingIntent\nimport android.content.Context\nimport android.content.Intent\nimport android.graphics.drawable.Icon\nimport android.os.Build\nimport androidx.annotation.ChecksSdkIntAtLeast\nimport androidx.annotation.RequiresApi\nimport androidx.compose.ui.graphics.toArgb\nimport androidx.compose.ui.util.lerp\nimport androidx.core.content.getSystemService\nimport com.android_baklava.egg.R\nimport kotlinx.coroutines.DisposableHandle\n\nconst val CHANNEL_ID = \"progress\"\nconst val CHANNEL_NAME = \"Spacecraft progress\"\nconst val UPDATE_FREQUENCY_SEC = 1f\n\nfun lerpRange(range: ClosedFloatingPointRange<Float>, x: Float): Float =\n    lerp(range.start, range.endInclusive, x)\n\nclass UniverseProgressNotifier(val context: Context, val universe: Universe) {\n\n    @ChecksSdkIntAtLeast(Build.VERSION_CODES.BAKLAVA)\n    private val isProgressNotifierSupported = Build.VERSION.SDK_INT >= Build.VERSION_CODES.BAKLAVA\n\n    private val notificationId = universe.randomSeed.toInt()\n    private val chan: NotificationChannel\n        @RequiresApi(Build.VERSION_CODES.O)\n        get() = NotificationChannel(CHANNEL_ID, CHANNEL_NAME, NotificationManager.IMPORTANCE_LOW)\n                .apply { lockscreenVisibility = Notification.VISIBILITY_PUBLIC }\n\n    private val noman = context.getSystemService<NotificationManager>()?.apply {\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            createNotificationChannel(chan)\n        }\n    }\n\n    private val registration: DisposableHandle =\n        universe.addSimulationStepListener(this::onSimulationStep)\n\n//    private val spacecraftIcon =\n//        Icon.createWithResource(context, R.drawable.baklava_ic_spacecraft_filled)\n//    private val planetIcons =\n//        listOf(\n//            (lerpRange(PLANET_RADIUS_RANGE, 0.75f)) to\n//                    Icon.createWithResource(context, R.drawable.ic_planet_large),\n//            (lerpRange(PLANET_RADIUS_RANGE, 0.5f)) to\n//                    Icon.createWithResource(context, R.drawable.ic_planet_medium),\n//            (lerpRange(PLANET_RADIUS_RANGE, 0.25f)) to\n//                    Icon.createWithResource(context, R.drawable.ic_planet_small),\n//            (PLANET_RADIUS_RANGE.start to\n//                    Icon.createWithResource(context, R.drawable.ic_planet_tiny)),\n//        )\n    private lateinit var planetIcons: List<Pair<Float, Icon>>\n\n    @RequiresApi(Build.VERSION_CODES.O)\n    private fun getPlanetIcon(planet: Planet): Icon {\n        for ((radius, icon) in planetIcons) {\n            if (planet.radius > radius) return icon\n        }\n        return planetIcons.last().second\n    }\n\n    private lateinit var progress: Notification.ProgressStyle\n//    private val progress = Notification.ProgressStyle().setProgressTrackerIcon(spacecraftIcon)\n\n    private val builder: Notification.Builder\n//    private val builder =\n//        Notification.Builder(context, CHANNEL_ID)\n//            .setContentIntent(\n//                PendingIntent.getActivity(\n//                    context,\n//                    0,\n//                    Intent(context, MainActivity::class.java).apply {\n//                        flags = Intent.FLAG_ACTIVITY_SINGLE_TOP\n//                    },\n//                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,\n//                )\n//            )\n//            .setFlag(Notification.FLAG_ONLY_ALERT_ONCE, true)\n//            .setColorized(true)\n//            .setOngoing(true)\n//            .setColor(Colors.Eigengrau2.toArgb())\n//            .setStyle(progress)\n\n    init {\n        if (isProgressNotifierSupported) {\n            val spacecraftIcon = Icon.createWithResource(context, R.drawable.baklava_ic_spacecraft_filled)\n            progress = Notification.ProgressStyle().setProgressTrackerIcon(spacecraftIcon)\n            planetIcons = listOf(\n                (lerpRange(PLANET_RADIUS_RANGE, 0.75f)) to\n                        Icon.createWithResource(context, R.drawable.baklava_ic_planet_large),\n                (lerpRange(PLANET_RADIUS_RANGE, 0.5f)) to\n                        Icon.createWithResource(context, R.drawable.baklava_ic_planet_medium),\n                (lerpRange(PLANET_RADIUS_RANGE, 0.25f)) to\n                        Icon.createWithResource(context, R.drawable.baklava_ic_planet_small),\n                (PLANET_RADIUS_RANGE.start to\n                        Icon.createWithResource(context, R.drawable.baklava_ic_planet_tiny)),\n            )\n        }\n\n        builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            Notification.Builder(context, CHANNEL_ID)\n        } else {\n            @Suppress(\"DEPRECATION\")\n            Notification.Builder(context)\n        }\n            .setContentIntent(\n                PendingIntent.getActivity(\n                    context, 0,\n                    Intent(context, MainActivity::class.java).apply {\n                        flags = Intent.FLAG_ACTIVITY_SINGLE_TOP\n                    },\n                    PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,\n                )\n            )\n            .setOngoing(true)\n            .setColor(Colors.Eigengrau2.toArgb())\n            .apply {\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n                    setFlag(Notification.FLAG_ONLY_ALERT_ONCE, true)\n                } else {\n                    setOnlyAlertOnce(true)\n                }\n                // https://developer.android.com/develop/ui/views/notifications/live-update\n                if (Build.VERSION.SDK_INT_FULL >= Build.VERSION_CODES_FULL.BAKLAVA_1) {\n                    setRequestPromotedOngoing(true)\n                }\n                if (isProgressNotifierSupported) {\n                    setStyle(progress)\n                }\n            }\n    }\n\n    private var lastUpdate = 0f\n    private var initialDistToTarget = 0\n\n    private fun onSimulationStep() {\n        if (universe.now - lastUpdate >= UPDATE_FREQUENCY_SEC) {\n            lastUpdate = universe.now\n            // android.util.Log.v(\"Landroid\", \"posting notification at time ${universe.now}\")\n\n            var distToTarget = 0\n            val autopilot = universe.ship.autopilot\n            val autopilotEnabled: Boolean = autopilot?.enabled == true\n            val target = autopilot?.target\n            val landing = universe.ship.landing\n            val speed = universe.ship.velocity.mag()\n\n            if (landing != null) {\n                // landed\n                builder.setContentTitle(\"landed: ${landing.planet.name}\")\n                builder.setContentText(\"currently: ${landing.text}\")\n                if (isProgressNotifierSupported) {\n                    builder.setShortCriticalText(\"landed\")\n\n                    progress.setProgress(progress.progressMax)\n                    progress.setProgressIndeterminate(false)\n                    builder.setStyle(progress)\n                }\n\n            } else if (autopilotEnabled) {\n                if (target != null) {\n                    // autopilot en route\n                    distToTarget = ((target.pos - universe.ship.pos).mag() - target.radius).toInt()\n                    if (initialDistToTarget == 0) {\n                        // we have a new target!\n                        initialDistToTarget = distToTarget\n                        if (isProgressNotifierSupported) {\n                            progress.progressEndIcon = getPlanetIcon(target)\n                        }\n                    }\n\n                    val eta = if (speed > 0) \"%1.0fs\".format(distToTarget / speed) else \"???\"\n                    builder.setContentTitle(\"headed to: ${target.name}\")\n                    builder.setContentText(\n                        \"autopilot is ${autopilot.strategy.lowercase()}\" +\n                            \"\\ndist: ${distToTarget}u // eta: $eta\"\n                    )\n                    // fun fact: ProgressStyle was originally EnRouteStyle\n                    if (isProgressNotifierSupported) {\n                        builder.setShortCriticalText(\"en route\")\n\n                        progress\n                            .setProgressSegments(\n                                listOf(\n                                    Notification.ProgressStyle.Segment(initialDistToTarget)\n                                        .setColor(Colors.Track.toArgb())\n                                )\n                            )\n                            .setProgress(initialDistToTarget - distToTarget)\n                            .setProgressIndeterminate(false)\n                        builder.setStyle(progress)\n                    }\n                } else {\n                    // no target\n                    if (initialDistToTarget != 0) {\n                        // just launched\n                        initialDistToTarget = 0\n                        if (isProgressNotifierSupported) {\n                            progress.progressStartIcon = progress.progressEndIcon\n                            progress.progressEndIcon = null\n                        }\n                    }\n\n                    builder.setContentTitle(\"in space\")\n                    builder.setContentText(\"selecting new target...\")\n                    if (isProgressNotifierSupported) {\n                        builder.setShortCriticalText(\"launched\")\n\n                        progress.setProgressIndeterminate(true)\n                        builder.setStyle(progress)\n                    }\n                }\n            } else {\n                // under user control\n\n                initialDistToTarget = 0\n\n                builder.setContentTitle(\"in space\")\n                builder.setContentText(\"under manual control\")\n                if (isProgressNotifierSupported) {\n                    builder.setShortCriticalText(\"adrift\")\n\n                    builder.setStyle(null)\n                }\n            }\n\n            builder\n                .setSubText(getSystemDesignation(universe))\n                .setSmallIcon(R.drawable.baklava_ic_spacecraft_rotated)\n\n            val notification = builder.build()\n\n            // one of the silliest things about Android is that icon levels go from 0 to 10000\n            notification.iconLevel = (((universe.ship.angle + PI2f) / PI2f) * 10_000f).toInt()\n\n            noman?.notify(notificationId, notification)\n        }\n    }\n\n    // remove notification and stop listening to simulation steps\n    fun cancel() {\n        registration.dispose()\n        noman?.cancel(notificationId)\n    }\n}\n\n\npackage com.android_baklava.egg.landroid\n\nimport androidx.compose.ui.geometry.Offset\nimport kotlin.math.PI\nimport kotlin.math.atan2\nimport kotlin.math.cos\nimport kotlin.math.sin\n\nconst val PIf = PI.toFloat()\nconst val PI2f = (2 * PI).toFloat()\n\ntypealias Vec2 = Offset\n\nfun Vec2.str(fmt: String = \"%+.2f\"): String = \"<$fmt,$fmt>\".format(x, y)\n\nfun Vec2(x: Float, y: Float): Vec2 = Offset(x, y)\n\nfun Vec2.mag(): Float {\n    return getDistance()\n}\n\nfun Vec2.distance(other: Vec2): Float {\n    return (this - other).mag()\n}\n\nfun Vec2.angle(): Float {\n    return atan2(y, x)\n}\n\nfun Vec2.dot(o: Vec2): Float {\n    return x * o.x + y * o.y\n}\n\nfun Vec2.product(f: Float): Vec2 {\n    return Vec2(x * f, y * f)\n}\n\nfun Offset.Companion.makeWithAngleMag(a: Float, m: Float): Vec2 {\n    return Vec2(m * cos(a), m * sin(a))\n}\n\nfun Vec2.rotate(angle: Float, origin: Vec2 = Vec2.Zero): Offset {\n    val translated = this - origin\n    return origin +\n        Offset(\n            (translated.x * cos(angle) - translated.y * sin(angle)),\n            (translated.x * sin(angle) + translated.y * cos(angle))\n        )\n}\n\n\npackage com.android_baklava.egg.landroid\n\nimport androidx.compose.foundation.layout.Spacer\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.RememberObserver\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.Path\nimport androidx.compose.ui.graphics.PathEffect\nimport androidx.compose.ui.graphics.PointMode\nimport androidx.compose.ui.graphics.drawscope.ContentDrawScope\nimport androidx.compose.ui.graphics.drawscope.DrawScope\nimport androidx.compose.ui.graphics.drawscope.Stroke\nimport androidx.compose.ui.graphics.drawscope.rotateRad\nimport androidx.compose.ui.graphics.drawscope.scale\nimport androidx.compose.ui.graphics.drawscope.translate\nimport androidx.compose.ui.node.DrawModifierNode\nimport androidx.compose.ui.node.ModifierNodeElement\nimport androidx.compose.ui.node.invalidateDraw\nimport androidx.compose.ui.util.lerp\nimport androidx.core.math.MathUtils.clamp\nimport com.android_baklava.egg.flags.Flags.flagFlag\nimport kotlinx.coroutines.DisposableHandle\nimport java.lang.Float.max\nimport kotlin.math.exp\nimport kotlin.math.sqrt\n\nconst val DRAW_ORBITS = true\nconst val DRAW_GRAVITATIONAL_FIELDS = true\nconst val DRAW_STAR_GRAVITATIONAL_FIELDS = true\n\nval STAR_POINTS = android.os.Build.VERSION.SDK_INT.takeIf { it in 1..99 } ?: 31\n\n/**\n * A zoomedDrawScope is one that is scaled, but remembers its zoom level, so you can correct for it\n * if you want to draw single-pixel lines. Which we do.\n */\ninterface ZoomedDrawScope : DrawScope {\n    val zoom: Float\n}\n\nfun DrawScope.zoom(zoom: Float, block: ZoomedDrawScope.() -> Unit) {\n    val ds =\n        object : ZoomedDrawScope, DrawScope by this {\n            override var zoom = zoom\n        }\n    ds.scale(zoom) { block(ds) }\n}\n\n/**\n * A device for observing changes to a [Simulator] such as a [Universe].\n * [observer] will be invoked each time a [Simulator.step] has completed.\n */\n@Composable\nfun <S : Simulator> Telescope(\n    subject: S,\n    observer: (S) -> Unit\n) {\n    remember(subject) {\n        object : RememberObserver {\n            lateinit var registration: DisposableHandle\n            var currentObserver by mutableStateOf(observer)\n\n            override fun onRemembered() {\n                registration = subject.addSimulationStepListener { currentObserver(subject) }\n            }\n\n            override fun onForgotten() {\n                registration.dispose()\n            }\n\n            override fun onAbandoned() {}\n        }\n    }.currentObserver = observer\n}\n\nfun Modifier.drawUniverse(\n    universe: Universe,\n    draw: DrawScope.(Universe) -> Unit\n): Modifier = this then UniverseElement(universe, draw)\n\n@Composable\nfun UniverseCanvas(\n    universe: Universe,\n    modifier: Modifier = Modifier,\n    draw: DrawScope.(Universe) -> Unit\n) {\n    Spacer(modifier.drawUniverse(universe, draw))\n}\n\nprivate class UniverseElement(\n    val universe: Universe,\n    val draw: DrawScope.(Universe) -> Unit\n) : ModifierNodeElement<UniverseModifierNode>() {\n    override fun create(): UniverseModifierNode = UniverseModifierNode(universe, draw)\n\n    // Called when a modifier is applied to a Layout whose inputs have changed\n    override fun update(node: UniverseModifierNode) {\n        node.universe = universe\n        node.draw = draw\n    }\n\n    override fun equals(other: Any?): Boolean {\n        if (this === other) return true\n        if (javaClass != other?.javaClass) return false\n\n        other as UniverseElement\n\n        if (universe != other.universe) return false\n        if (draw != other.draw) return false\n\n        return true\n    }\n\n    override fun hashCode(): Int {\n        var result = universe.hashCode()\n        result = 31 * result + draw.hashCode()\n        return result\n    }\n}\n\nprivate class UniverseModifierNode(\n    universe: Universe,\n    draw: DrawScope.(Universe) -> Unit,\n) : Modifier.Node(), DrawModifierNode {\n    private val universeListener: () -> Unit = { invalidateDraw() }\n    private var removeUniverseListener: DisposableHandle? =\n        universe.addSimulationStepListener(universeListener)\n\n    var universe: Universe = universe\n        set(value) {\n            if (field === value) return\n            removeUniverseListener?.dispose()\n            field = value\n            removeUniverseListener = value.addSimulationStepListener(universeListener)\n        }\n\n    var draw: ContentDrawScope.(Universe) -> Unit = draw\n        set(value) {\n            if (field === value) return\n            field = value\n            invalidateDraw()\n        }\n\n    override fun ContentDrawScope.draw() {\n        draw(universe)\n    }\n}\n\nfun ZoomedDrawScope.drawUniverse(universe: Universe) {\n    with(universe) {\n        constraints.forEach {\n            when (it) {\n                is Landing -> drawLanding(it)\n                is Container -> drawContainer(it)\n            }\n        }\n        drawStar(star)\n        entities.forEach {\n            if (it === star) return@forEach // don't draw the star as a planet\n            when (it) {\n                is Spark -> drawSpark(it)\n                is Planet -> drawPlanet(it)\n                else -> Unit // draw these at a different time, or not at all\n            }\n        }\n        ship.autopilot?.let { drawAutopilot(it) }\n        drawSpacecraft(ship)\n    }\n}\n\nfun ZoomedDrawScope.drawContainer(container: Container) {\n    drawCircle(\n        color = Color(0xFF800000),\n        radius = container.radius,\n        center = Vec2.Zero,\n        style =\n            Stroke(\n                width = 1f / zoom,\n                pathEffect = PathEffect.dashPathEffect(floatArrayOf(8f / zoom, 8f / zoom), 0f)\n            )\n    )\n}\n\nfun ZoomedDrawScope.drawGravitationalField(planet: Planet) {\n    val rings = 8\n    for (i in 0 until rings) {\n        val force =\n            lerp(\n                200f,\n                0.01f,\n                i.toFloat() / rings\n            ) // first rings at force = 1N, dropping off after that\n        val r = sqrt(GRAVITATION * planet.mass * SPACECRAFT_MASS / force)\n        drawCircle(\n            color = Color(1f, 0f, 0f, lerp(0.5f, 0.1f, i.toFloat() / rings)),\n            center = planet.pos,\n            style = Stroke(2f / zoom),\n            radius = r\n        )\n    }\n}\n\nfun ZoomedDrawScope.drawPlanet(planet: Planet) {\n    with(planet) {\n        if (DRAW_ORBITS)\n            drawCircle(\n                color = Color(0x8000FFFF),\n                radius = pos.distance(orbitCenter),\n                center = orbitCenter,\n                style =\n                    Stroke(\n                        width = 1f / zoom,\n                    )\n            )\n\n        if (DRAW_GRAVITATIONAL_FIELDS) {\n            drawGravitationalField(this)\n        }\n\n        drawCircle(color = Colors.Eigengrau, radius = radius, center = pos)\n        drawCircle(color = color, radius = radius, center = pos, style = Stroke(2f / zoom))\n    }\n}\n\nfun ZoomedDrawScope.drawStar(star: Star) {\n    translate(star.pos.x, star.pos.y) {\n        drawCircle(color = star.color, radius = star.radius, center = Vec2.Zero)\n\n        if (DRAW_STAR_GRAVITATIONAL_FIELDS) this@drawStar.drawGravitationalField(star)\n\n        rotateRad(radians = star.anim / 23f * PI2f, pivot = Vec2.Zero) {\n            drawPath(\n                path =\n                    createStar(\n                        radius1 = star.radius + 80,\n                        radius2 = star.radius + 250,\n                        points = STAR_POINTS\n                    ),\n                color = star.color,\n                style =\n                    Stroke(\n                        width = 3f / this@drawStar.zoom,\n                        pathEffect = PathEffect.cornerPathEffect(radius = 200f)\n                    )\n            )\n        }\n        rotateRad(radians = star.anim / -19f * PI2f, pivot = Vec2.Zero) {\n            drawPath(\n                path =\n                    createStar(\n                        radius1 = star.radius + 20,\n                        radius2 = star.radius + 200,\n                        points = STAR_POINTS + 1\n                    ),\n                color = star.color,\n                style =\n                    Stroke(\n                        width = 3f / this@drawStar.zoom,\n                        pathEffect = PathEffect.cornerPathEffect(radius = 200f)\n                    )\n            )\n        }\n    }\n}\n\nval spaceshipPath =\n    Path().apply {\n        parseSvgPathData(\n            \"\"\"\nM11.853 0\nC11.853 -4.418 8.374 -8 4.083 -8\nL-5.5 -8\nC-6.328 -8 -7 -7.328 -7 -6.5\nC-7 -5.672 -6.328 -5 -5.5 -5\nL-2.917 -5\nC-1.26 -5 0.083 -3.657 0.083 -2\nL0.083 2\nC0.083 3.657 -1.26 5 -2.917 5\nL-5.5 5\nC-6.328 5 -7 5.672 -7 6.5\nC-7 7.328 -6.328 8 -5.5 8\nL4.083 8\nC8.374 8 11.853 4.418 11.853 0\nZ\n\"\"\"\n        )\n    }\nval spaceshipLegs =\n    Path().apply {\n        parseSvgPathData(\n            \"\"\"\nM-7   -6.5\nl-3.5  0\nl-1   -2\nl 0    4\nl 1   -2\nZ\nM-7    6.5\nl-3.5  0\nl-1   -2\nl 0    4\nl 1   -2\nZ\n\"\"\"\n        )\n    }\nval thrustPath = createPolygon(-3f, 3).also { it.translate(Vec2(-5f, 0f)) }\n\nfun ZoomedDrawScope.drawSpacecraft(ship: Spacecraft) {\n    with(ship) {\n        rotateRad(angle, pivot = pos) {\n            translate(pos.x, pos.y) {\n                // new in V: little landing legs\n                ship.landing?.let {\n                    drawPath(\n                        path = spaceshipLegs,\n                        color = Color(0xFFCCCCCC),\n                        style = Stroke(width = 2f / this@drawSpacecraft.zoom)\n                    )\n                }\n                // draw the ship\n                drawPath(path = spaceshipPath, color = Colors.Eigengrau) // fauxpaque\n                drawPath(\n                    path = spaceshipPath,\n                    color = if (transit) Color.Black else Color.White,\n                    style = Stroke(width = 2f / this@drawSpacecraft.zoom)\n                )\n                // draw thrust\n                if (thrust != Vec2.Zero) {\n                    drawPath(\n                        path = thrustPath,\n                        color = Color(0xFFFF8800),\n                        style =\n                            Stroke(\n                                width = 2f / this@drawSpacecraft.zoom,\n                                pathEffect = PathEffect.cornerPathEffect(radius = 1f)\n                            )\n                    )\n                }\n            }\n        }\n        drawTrack(track)\n    }\n}\n\nfun ZoomedDrawScope.drawLanding(landing: Landing) {\n    val v = landing.planet.pos + Vec2.makeWithAngleMag(landing.angle, landing.planet.radius)\n\n    if (flagFlag()) {\n        val strokeWidth = 2f / zoom\n        val height = 80f\n        rotateRad(landing.angle, pivot = v) {\n            translate(v.x, v.y) {\n                val flagPath =\n                    Path().apply {\n                        moveTo(0f, 0f)\n                        lineTo(height, 0f)\n                        lineTo(height * 0.875f, height * 0.25f)\n                        lineTo(height * 0.75f, 0f)\n                        close()\n                    }\n                drawPath(flagPath, Colors.Flag, style = Stroke(width = strokeWidth))\n            }\n        }\n    }\n}\n\nfun ZoomedDrawScope.drawSpark(spark: Spark) {\n    with(spark) {\n        if (fuse.lifetime < 0) return\n        val life = 1f - fuse.lifetime / ttl\n        when (style) {\n            Spark.Style.LINE ->\n                if (opos != Vec2.Zero) drawLine(color, opos, pos, strokeWidth = size)\n            Spark.Style.LINE_ABSOLUTE ->\n                if (opos != Vec2.Zero) drawLine(color, opos, pos, strokeWidth = size / zoom)\n            Spark.Style.DOT -> drawCircle(color, size, pos)\n            Spark.Style.DOT_ABSOLUTE -> drawCircle(color, size, pos / zoom)\n            Spark.Style.RING ->\n                drawCircle(\n                    color = color.copy(alpha = color.alpha * (1f - life)),\n                    radius = exp(lerp(size, 3f * size, life)) - 1f,\n                    center = pos,\n                    style = Stroke(width = 1f / zoom)\n                )\n        }\n    }\n}\n\nfun ZoomedDrawScope.drawTrack(track: Track) {\n    with(track) {\n        if (SIMPLE_TRACK_DRAWING) {\n            drawPoints(\n                positions,\n                pointMode = PointMode.Lines,\n                color = Colors.Track,\n                strokeWidth = 1f / zoom\n            )\n        } else {\n            if (positions.size < 2) return\n            var prev: Vec2 = positions[positions.size - 1]\n            var a = 0.5f\n            positions.reversed().subList(1, positions.size).forEach { pos ->\n                drawLine(Color(0f, 1f, 0f, a), prev, pos, strokeWidth = max(1f, 1f / zoom))\n                prev = pos\n                a = clamp((a - 1f / TRACK_LENGTH), 0f, 1f)\n            }\n        }\n    }\n}\n\nfun ZoomedDrawScope.drawAutopilot(autopilot: Autopilot) {\n    val color = Colors.Autopilot.copy(alpha = 0.5f)\n\n    autopilot.target?.let { target ->\n        val zoom = zoom\n        rotateRad(autopilot.universe.now * PI2f / 10f, target.pos) {\n            translate(target.pos.x, target.pos.y) {\n                drawPath(\n                    path =\n                        createPolygon(\n                            radius = target.radius + autopilot.brakingDistance,\n                            sides = 15 // Autopilot introduced in Android 15\n                        ),\n                    color = color,\n                    style = Stroke(1f / zoom)\n                )\n                drawCircle(\n                    color,\n                    radius = target.radius + autopilot.landingAltitude / 2,\n                    center = Vec2.Zero,\n                    alpha = 0.25f,\n                    style = Stroke(autopilot.landingAltitude)\n                )\n            }\n        }\n        drawLine(\n            color,\n            start = autopilot.ship.pos,\n            end = autopilot.leadingPos,\n            strokeWidth = 1f / zoom\n        )\n        drawCircle(\n            color,\n            radius = 5f / zoom,\n            center = autopilot.leadingPos,\n            style = Stroke(1f / zoom)\n        )\n    }\n}\n\n\npackage com.android_baklava.egg\n\nimport android.content.ComponentName\nimport android.content.Context\nimport android.os.Build\nimport android.view.Gravity\nimport android.view.View\nimport android.widget.FrameLayout\nimport android.widget.ImageView\nimport com.android_baklava.egg.PlatLogoActivity.Starfield\nimport com.android_baklava.egg.landroid.DreamUniverse\nimport com.dede.basic.provider.BaseEasterEgg\nimport com.dede.basic.provider.ComponentProvider\nimport com.dede.basic.provider.EasterEgg\nimport com.dede.basic.provider.EasterEggProvider\nimport com.dede.basic.provider.SnapshotProvider\nimport com.dede.basic.provider.TimelineEvent\nimport com.dede.basic.requireDrawable\nimport dagger.Module\nimport dagger.Provides\nimport dagger.hilt.InstallIn\nimport dagger.hilt.components.SingletonComponent\nimport dagger.multibindings.IntoSet\nimport java.util.Calendar\nimport java.util.Random\nimport javax.inject.Singleton\n\n@Module\n@InstallIn(SingletonComponent::class)\nobject AndroidBaklavaEasterEgg : EasterEggProvider, ComponentProvider {\n\n    @Provides\n    @IntoSet\n    @Singleton\n    override fun provideEasterEgg(): BaseEasterEgg {\n        return object : EasterEgg(\n            iconRes = R.drawable.baklava_android16_patch_adaptive,\n            nameRes = R.string.baklava_egg_name,\n            nicknameRes = R.string.baklava_android_nickname,\n            fullApiLevelRange = Build.VERSION_CODES_FULL.BAKLAVA..Build.VERSION_CODES_FULL.BAKLAVA_1,\n            actionClass = PlatLogoActivity::class.java,\n        ) {\n            override fun provideSnapshotProvider(): SnapshotProvider {\n                return SP()\n            }\n        }\n    }\n\n    @Provides\n    @IntoSet\n    @Singleton\n    override fun provideTimelineEvents(): List<TimelineEvent> {\n        return listOf(\n            TimelineEvent(\n                2025, Calendar.MAY,\n                Build.VERSION_CODES_FULL.BAKLAVA,\n                \"Baklava.\"\n            ),\n            TimelineEvent(\n                2025, Calendar.DECEMBER,\n                Build.VERSION_CODES_FULL.BAKLAVA_1,\n                \"Baklava.\\nAndroid 16.1\",\n            )\n        )\n    }\n\n    @Provides\n    @IntoSet\n    @Singleton\n    override fun provideComponent(): ComponentProvider.Component {\n        return object : ComponentProvider.Component(\n            R.drawable.baklava_android16_patch_adaptive,\n            R.string.baklava_egg_name,\n            R.string.baklava_android_nickname,\n            Build.VERSION_CODES_FULL.BAKLAVA..Build.VERSION_CODES_FULL.BAKLAVA_1\n        ) {\n            override fun isSupported(): Boolean = true\n\n            override fun isEnabled(context: Context): Boolean {\n                val cn = ComponentName(context, DreamUniverse::class.java)\n                return cn.isEnabled(context)\n            }\n\n            override fun setEnabled(context: Context, enable: Boolean) {\n                val cn = ComponentName(context, DreamUniverse::class.java)\n                cn.setEnable(context, enable)\n            }\n        }\n    }\n\n    internal class SP : SnapshotProvider() {\n        override val includeBackground: Boolean\n            get() = true\n\n        override fun create(context: Context): View {\n            val dp = context.resources.displayMetrics.density\n            val random = Random()\n            val starfield = Starfield(random, dp * 2.0f)\n            starfield.setVelocity(\n                (random.nextFloat() - 0.5f) * 200.0f,\n                (random.nextFloat() - 0.5f) * 200.0f\n            )\n            val layout = FrameLayout(context)\n            layout.background = starfield\n\n            val logo = ImageView(context)\n            logo.setImageDrawable(context.requireDrawable(R.drawable.baklava_platlogo))\n            val lp: FrameLayout.LayoutParams = FrameLayout.LayoutParams(\n                FrameLayout.LayoutParams.MATCH_PARENT,\n                FrameLayout.LayoutParams.MATCH_PARENT\n            )\n            lp.gravity = Gravity.CENTER\n            layout.addView(logo, lp)\n\n            return layout\n        }\n    }\n}\n\n\npackage com.android_baklava.egg;\n\nimport android.app.Activity;\nimport android.content.ComponentName;\nimport android.content.Context;\nimport android.content.pm.PackageManager;\nimport android.provider.Settings;\nimport android.util.Log;\nimport android.widget.Toast;\n\nimport com.android_baklava.egg.flags.Flags;\nimport com.android_baklava.egg.landroid.DreamUniverse;\n\n/**\n * Launched from the PlatLogoActivity. Enables everything else in this easter egg.\n */\npublic class ComponentActivationActivity extends Activity {\n    private static final String TAG = \"EasterEgg\";\n\n    // check PlatLogoActivity.java for these\n    private static final String S_EGG_UNLOCK_SETTING = \"egg_mode_s\";\n    private static final String V_EGG_UNLOCK_SETTING = \"egg_mode_v\";\n\n    private void toastUp(String s) {\n        Toast toast = Toast.makeText(this, s, Toast.LENGTH_SHORT);\n        toast.show();\n    }\n\n    @Override\n    public void onStart() {\n        super.onStart();\n\n        lockUnlockComponents(this);\n\n        finish();\n    }\n\n    /**\n     * Check easter egg unlock state and update unlockable components to match.\n     */\n    public static void lockUnlockComponents(Context context) {\n        final PackageManager pm = context.getPackageManager();\n        final ComponentName[] cns;\n        final String unlockSettingsKey;\n        final boolean shouldReLock;\n        final long unlockValue;\n        if (Flags.flagFlag()) {\n            unlockSettingsKey = V_EGG_UNLOCK_SETTING;\n            unlockValue = 1; // since we're not toggling we actually don't need to check the setting\n            shouldReLock = false;\n            cns = new ComponentName[]{\n                    new ComponentName(context, DreamUniverse.class)\n            };\n        } else {\n            unlockSettingsKey = S_EGG_UNLOCK_SETTING;\n            unlockValue = Settings.System.getLong(context.getContentResolver(),\n                    unlockSettingsKey, 0);\n            shouldReLock = true;\n            cns = new ComponentName[]{\n//                    new ComponentName(context, NekoControlsService.class),\n//                    new ComponentName(context, PaintChipsActivity.class),\n//                    new ComponentName(context, PaintChipsWidget.class),\n                    new ComponentName(context, DreamUniverse.class)\n            };\n        }\n        for (ComponentName cn : cns) {\n            final boolean componentEnabled = pm.getComponentEnabledSetting(cn)\n                    == PackageManager.COMPONENT_ENABLED_STATE_ENABLED;\n            if (unlockValue == 0) {\n                if (componentEnabled) {\n                    Log.v(TAG, \"Disabling component: \" + cn);\n                    pm.setComponentEnabledSetting(cn,\n                            PackageManager.COMPONENT_ENABLED_STATE_DISABLED,\n                            PackageManager.DONT_KILL_APP);\n                    //toastUp(\"\\uD83D\\uDEAB\");\n                } else {\n                    Log.v(TAG, \"Already disabled: \" + cn);\n                }\n            } else {\n                if (!componentEnabled) {\n                    Log.v(TAG, \"Enabling component: \" + cn);\n                    pm.setComponentEnabledSetting(cn,\n                            PackageManager.COMPONENT_ENABLED_STATE_ENABLED,\n                            PackageManager.DONT_KILL_APP);\n                    //toastUp(\"\\uD83D\\uDC31\");\n                } else {\n                    Log.v(TAG, \"Already enabled: \" + cn);\n                }\n            }\n        }\n    }\n}\n\n\npackage com.android_baklava.egg;\n\nimport static android.os.VibrationEffect.Composition.PRIMITIVE_SPIN;\n\nimport static java.lang.Math.hypot;\n\nimport android.animation.ObjectAnimator;\nimport android.animation.TimeAnimator;\nimport android.annotation.SuppressLint;\nimport android.app.ActionBar;\nimport android.app.Activity;\nimport android.content.ActivityNotFoundException;\nimport android.content.ContentResolver;\nimport android.content.Intent;\nimport android.content.pm.ActivityInfo;\nimport android.graphics.Canvas;\nimport android.graphics.Color;\nimport android.graphics.ColorFilter;\nimport android.graphics.ColorSpace;\nimport android.graphics.Paint;\nimport android.graphics.PixelFormat;\nimport android.graphics.Rect;\nimport android.graphics.drawable.Drawable;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.CombinedVibration;\nimport android.os.Handler;\nimport android.os.HandlerThread;\nimport android.os.Message;\nimport android.os.VibrationEffect;\nimport android.os.VibratorManager;\nimport android.provider.Settings;\nimport android.util.DisplayMetrics;\nimport android.util.Log;\nimport android.view.Gravity;\nimport android.view.HapticFeedbackConstants;\nimport android.view.KeyEvent;\nimport android.view.MotionEvent;\nimport android.view.View;\nimport android.widget.FrameLayout;\nimport android.widget.ImageView;\n\nimport androidx.annotation.ChecksSdkIntAtLeast;\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\nimport androidx.annotation.RequiresApi;\nimport androidx.core.os.HandlerCompat;\nimport androidx.core.view.WindowCompat;\nimport androidx.core.view.WindowInsetsCompat;\nimport androidx.core.view.WindowInsetsControllerCompat;\n\nimport com.android_baklava.egg.landroid.MainActivity;\n\nimport java.util.Random;\n\n/**\n * @hide\n */\npublic class PlatLogoActivity extends Activity {\n    private static final String TAG = \"PlatLogoActivity\";\n\n    private static final long LAUNCH_TIME = 5000L;\n\n    private static final String EGG_UNLOCK_SETTING = \"egg_mode_baklava\";\n\n    private static final float MIN_WARP = 1f;\n    private static final float MAX_WARP = 16f; // must go faster\n    private static final boolean FINISH_AFTER_NEXT_STAGE_LAUNCH = false;\n\n    private ImageView mLogo;\n    private Starfield mStarfield;\n\n    private FrameLayout mLayout;\n\n    private TimeAnimator mAnim;\n    private ObjectAnimator mWarpAnim;\n    private Random mRandom;\n    private float mDp;\n\n    private RumblePack mRumble;\n\n    private boolean mAnimationsEnabled = true;\n\n    private final View.OnTouchListener mTouchListener = new View.OnTouchListener() {\n        @Override\n        public boolean onTouch(View v, MotionEvent event) {\n            switch (event.getActionMasked()) {\n                case MotionEvent.ACTION_DOWN:\n//                    measureTouchPressure(event);\n                    startWarp();\n                    break;\n                case MotionEvent.ACTION_UP:\n                case MotionEvent.ACTION_CANCEL:\n                    stopWarp();\n                    break;\n            }\n            return true;\n        }\n\n    };\n\n    private final Runnable mLaunchNextStage = () -> {\n        stopWarp();\n        launchNextStage(false);\n    };\n\n    private final TimeAnimator.TimeListener mTimeListener = new TimeAnimator.TimeListener() {\n        @Override\n        public void onTimeUpdate(TimeAnimator animation, long totalTime, long deltaTime) {\n            mStarfield.update(deltaTime);\n            final float warpFrac = (mStarfield.getWarp() - MIN_WARP) / (MAX_WARP - MIN_WARP);\n            if (mAnimationsEnabled) {\n                mLogo.setTranslationX(mRandom.nextFloat() * warpFrac * 5 * mDp);\n                mLogo.setTranslationY(mRandom.nextFloat() * warpFrac * 5 * mDp);\n            }\n            if (warpFrac > 0f) {\n                mRumble.rumble(warpFrac);\n            }\n            mLayout.postInvalidate();\n        }\n    };\n\n    private class RumblePack implements Handler.Callback {\n        private static final int MSG = 6464;\n        private static final int INTERVAL = 50;\n\n        private final VibratorManager mVibeMan;\n        private final HandlerThread mVibeThread;\n        private final Handler mVibeHandler;\n        private boolean mSpinPrimitiveSupported;\n\n        private long mLastVibe = 0;\n\n        @SuppressLint(\"MissingPermission\")\n        @Override\n        public boolean handleMessage(Message msg) {\n            final float warpFrac = msg.arg1 / 100f;\n            if (mSpinPrimitiveSupported) {\n                if (msg.getWhen() > mLastVibe + INTERVAL) {\n                    mLastVibe = msg.getWhen();\n                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && mVibeMan != null) {\n                        mVibeMan.vibrate(CombinedVibration.createParallel(\n                                VibrationEffect.startComposition()\n                                        .addPrimitive(PRIMITIVE_SPIN, (float) Math.pow(warpFrac, 3.0))\n                                        .compose()\n                        ));\n                    }\n                }\n            } else {\n                if (mRandom.nextFloat() < warpFrac) {\n                    mLogo.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK);\n                }\n            }\n            return false;\n        }\n        RumblePack() {\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {\n                mVibeMan = getSystemService(VibratorManager.class);\n                mSpinPrimitiveSupported = mVibeMan.getDefaultVibrator()\n                        .areAllPrimitivesSupported(PRIMITIVE_SPIN);\n            } else {\n                mVibeMan = null;\n                mSpinPrimitiveSupported = false;\n            }\n\n            mVibeThread = new HandlerThread(\"VibratorThread\");\n            mVibeThread.start();\n            mVibeHandler = HandlerCompat.createAsync(mVibeThread.getLooper(), this);\n        }\n\n        public void destroy() {\n            mVibeThread.quit();\n        }\n\n        private void rumble(float warpFrac) {\n            if (!mVibeThread.isAlive()) return;\n\n            final Message msg = Message.obtain();\n            msg.what = MSG;\n            msg.arg1 = (int) (warpFrac * 100);\n            mVibeHandler.removeMessages(MSG);\n            mVibeHandler.sendMessage(msg);\n        }\n\n    }\n\n    @Override\n    protected void onDestroy() {\n        mRumble.destroy();\n\n        super.onDestroy();\n    }\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\n        getWindow().getDecorView().setFitsSystemWindows(false);\n        getWindow().setNavigationBarColor(Color.TRANSPARENT);\n        getWindow().setStatusBarColor(Color.TRANSPARENT);\n        WindowInsetsControllerCompat windowInsetsController = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());\n        windowInsetsController.hide(WindowInsetsCompat.Type.systemBars());\n\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n            // This will be silently ignored on displays that don't support HDR color, which is fine\n            getWindow().setColorMode(ActivityInfo.COLOR_MODE_HDR);\n        }\n\n        final ActionBar ab = getActionBar();\n        if (ab != null) ab.hide();\n\n        try {\n            mAnimationsEnabled = Settings.Global.getFloat(getContentResolver(),\n                    Settings.Global.ANIMATOR_DURATION_SCALE) > 0f;\n        } catch (Settings.SettingNotFoundException e) {\n            mAnimationsEnabled = true;\n        }\n\n        mRumble = new RumblePack();\n\n        mLayout = new FrameLayout(this);\n        mRandom = new Random();\n        mDp = getResources().getDisplayMetrics().density;\n        mStarfield = new Starfield(mRandom, mDp * 2f);\n        mStarfield.setVelocity(\n                200f * (mRandom.nextFloat() - 0.5f),\n                200f * (mRandom.nextFloat() - 0.5f));\n        mLayout.setBackground(mStarfield);\n\n        final DisplayMetrics dm = getResources().getDisplayMetrics();\n        final float dp = dm.density;\n        final int minSide = Math.min(dm.widthPixels, dm.heightPixels);\n        final int widgetSize = (int) (minSide * 0.75);\n        final FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(widgetSize, widgetSize);\n        lp.gravity = Gravity.CENTER;\n\n        mLogo = new ImageView(this);\n        mLogo.setImageResource(R.drawable.baklava_platlogo);\n        mLogo.setOnTouchListener(mTouchListener);\n        mLogo.requestFocus();\n        mLayout.addView(mLogo, lp);\n\n        Log.v(TAG, \"Hello\");\n\n        setContentView(mLayout);\n    }\n\n    private void startAnimating() {\n        mAnim = new TimeAnimator();\n        mAnim.setTimeListener(mTimeListener);\n        mAnim.start();\n    }\n\n    private void stopAnimating() {\n        mAnim.cancel();\n        mAnim = null;\n    }\n\n    @Override\n    public boolean onKeyDown(int keyCode, KeyEvent event) {\n        if (keyCode == KeyEvent.KEYCODE_SPACE) {\n            if (event.getRepeatCount() == 0) {\n                startWarp();\n            }\n            return true;\n        }\n        return super.onKeyDown(keyCode,event);\n    }\n\n    @Override\n    public boolean onKeyUp(int keyCode, KeyEvent event) {\n        if (keyCode == KeyEvent.KEYCODE_SPACE) {\n            stopWarp();\n            return true;\n        }\n        return super.onKeyUp(keyCode,event);\n    }\n\n    private void startWarp() {\n        stopWarp();\n        mWarpAnim = ObjectAnimator.ofFloat(mStarfield, \"warp\", MIN_WARP, MAX_WARP)\n                .setDuration(LAUNCH_TIME);\n        mWarpAnim.start();\n\n        mLogo.postDelayed(mLaunchNextStage, LAUNCH_TIME + 1000L);\n    }\n\n    private void stopWarp() {\n        if (mWarpAnim != null) {\n            mWarpAnim.cancel();\n            mWarpAnim.removeAllListeners();\n            mWarpAnim = null;\n        }\n        mStarfield.setWarp(1f);\n        mLogo.removeCallbacks(mLaunchNextStage);\n    }\n\n    @Override\n    public void onResume() {\n        super.onResume();\n        startAnimating();\n    }\n\n    @Override\n    public void onPause() {\n        stopWarp();\n        stopAnimating();\n        super.onPause();\n    }\n\n    private boolean shouldWriteSettings() {\n//        return getPackageName().equals(\"android\");\n        return true;\n    }\n\n    private void launchNextStage(boolean locked) {\n        final ContentResolver cr = getContentResolver();\n        try {\n            if (shouldWriteSettings()) {\n                Log.v(TAG, \"Saving egg locked=\" + locked);\n//                syncTouchPressure();\n                Settings.System.putLong(cr,\n                        EGG_UNLOCK_SETTING,\n                        locked ? 0 : System.currentTimeMillis());\n            }\n        } catch (RuntimeException e) {\n            Log.e(TAG, \"Can't write settings\", e);\n        }\n\n        try {\n            final Intent eggActivity = new Intent(this, MainActivity.class);\n//                    .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK\n//                            | Intent.FLAG_ACTIVITY_CLEAR_TASK)\n//                    .addCategory(\"com.android.internal.category.PLATLOGO\");\n            Log.v(TAG, \"launching: \" + eggActivity);\n            startActivity(eggActivity);\n        } catch (ActivityNotFoundException ex) {\n            Log.e(\"com.android.internal.app.PlatLogoActivity\", \"No more eggs.\");\n        }\n        if (FINISH_AFTER_NEXT_STAGE_LAUNCH) {\n            finish(); // we're done here.\n        }\n    }\n\n//    static final String TOUCH_STATS = \"touch.stats\";\n//    double mPressureMin = 0, mPressureMax = -1;\n//\n//    private void measureTouchPressure(MotionEvent event) {\n//        final float pressure = event.getPressure();\n//        switch (event.getActionMasked()) {\n//            case MotionEvent.ACTION_DOWN:\n//                if (mPressureMax < 0) {\n//                    mPressureMin = mPressureMax = pressure;\n//                }\n//                break;\n//            case MotionEvent.ACTION_MOVE:\n//                if (pressure < mPressureMin) mPressureMin = pressure;\n//                if (pressure > mPressureMax) mPressureMax = pressure;\n//                break;\n//        }\n//    }\n//\n//    private void syncTouchPressure() {\n//        try {\n//            final String touchDataJson = Settings.System.getString(\n//                    getContentResolver(), TOUCH_STATS);\n//            final JSONObject touchData = new JSONObject(\n//                    touchDataJson != null ? touchDataJson : \"{}\");\n//            if (touchData.has(\"min\")) {\n//                mPressureMin = Math.min(mPressureMin, touchData.getDouble(\"min\"));\n//            }\n//            if (touchData.has(\"max\")) {\n//                mPressureMax = max(mPressureMax, touchData.getDouble(\"max\"));\n//            }\n//            if (mPressureMax >= 0) {\n//                touchData.put(\"min\", mPressureMin);\n//                touchData.put(\"max\", mPressureMax);\n//                if (shouldWriteSettings()) {\n//                    Settings.System.putString(getContentResolver(), TOUCH_STATS,\n//                            touchData.toString());\n//                }\n//            }\n//        } catch (Exception e) {\n//            Log.e(\"com.android.internal.app.PlatLogoActivity\", \"Can't write touch settings\", e);\n//        }\n//    }\n//\n//    @Override\n//    public void onStart() {\n//        super.onStart();\n//        syncTouchPressure();\n//    }\n//\n//    @Override\n//    public void onStop() {\n//        syncTouchPressure();\n//        super.onStop();\n//    }\n\n    static class Starfield extends Drawable {\n        private static final int NUM_STARS = 128;\n\n        private static final int NUM_PLANES = 4;\n\n        private static final float ROTATION = 45;\n        private final float[] mStars = new float[NUM_STARS * 4];\n        private float mVx, mVy;\n        private long mDt = 0;\n        private final Paint mStarPaint;\n\n        private final Random mRng;\n        private final float mSize;\n\n        private float mRadius = 0f;\n        private float mWarp = 1f;\n\n        private float mBuffer;\n\n        public void setWarp(float warp) {\n            mWarp = warp;\n        }\n\n        public float getWarp() {\n            return mWarp;\n        }\n\n        Starfield(Random rng, float size) {\n            mRng = rng;\n            mSize = size;\n            mStarPaint = new Paint();\n            mStarPaint.setStyle(Paint.Style.STROKE);\n            mStarPaint.setColor(Color.WHITE);\n        }\n\n        @Override\n        public void onBoundsChange(Rect bounds) {\n            mBuffer = mSize * NUM_PLANES * 2 * MAX_WARP;\n            mRadius = ((float) hypot(bounds.width(), bounds.height()) / 2f) + mBuffer;\n            // I didn't clarify this the last time, but we store both the beginning and\n            // end of each star's trail in this data structure. When we're not in warp that means\n            // that we've got each star in there twice. It's fine, we're gonna move it off-screen\n            for (int i = 0; i < NUM_STARS; i++) {\n                mStars[4 * i] = mRng.nextFloat() * 2 * mRadius - mRadius;\n                mStars[4 * i + 1] = mRng.nextFloat() * 2 * mRadius - mRadius;\n                // duplicate copy (for now)\n                mStars[4 * i + 2] = mStars[4 * i];\n                mStars[4 * i + 3] = mStars[4 * i + 1];\n            }\n        }\n\n        public void setVelocity(float x, float y) {\n            mVx = x;\n            mVy = y;\n        }\n\n        @Override\n        public void draw(@NonNull Canvas canvas) {\n            final float dtSec = mDt / 1000f;\n            final float dx = (mVx * dtSec * mWarp);\n            final float dy = (mVy * dtSec * mWarp);\n\n            final boolean inWarp = mWarp > 1f;\n\n            final float diameter = mRadius * 2f;\n            final float triameter = mRadius * 3f;\n\n            canvas.drawColor(Color.BLACK);\n\n            final float cx = getBounds().width() / 2f;\n            final float cy = getBounds().height() / 2f;\n            canvas.translate(cx, cy);\n\n            canvas.rotate(ROTATION);\n\n            if (mDt > 0 && mDt < 1000) {\n                canvas.translate(\n                        mRng.nextFloat() * (mWarp - 1f),\n                        mRng.nextFloat() * (mWarp - 1f)\n                );\n                for (int i = 0; i < NUM_STARS; i++) {\n                    final int plane = (int) ((((float) i) / NUM_STARS) * NUM_PLANES) + 1;\n                    mStars[4 * i + 2] = (mStars[4 * i + 2] + dx * plane + triameter) % diameter\n                            - mRadius;\n                    mStars[4 * i + 3] = (mStars[4 * i + 3] + dy * plane + triameter) % diameter\n                            - mRadius;\n                    mStars[4 * i + 0] = inWarp ? mStars[4 * i + 2] - dx * mWarp * plane : -10000;\n                    mStars[4 * i + 1] = inWarp ? mStars[4 * i + 3] - dy * mWarp * plane : -10000;\n                }\n            }\n            final int slice = (mStars.length / NUM_PLANES / 4) * 4;\n            for (int p = 0; p < NUM_PLANES; p++) {\n                final float value = (p + 1f) / (NUM_PLANES - 1);\n                if (isSRgbExtSupported) {\n                    mStarPaint.setColor(packHdrColor(value, 1.0f));\n                } else {\n                    mStarPaint.setColor(packColor(value, 1.0f));\n                }\n                mStarPaint.setStrokeWidth(mSize * (p + 1));\n                if (inWarp) {\n                    canvas.drawLines(mStars, p * slice, slice, mStarPaint);\n                }\n                canvas.drawPoints(mStars, p * slice, slice, mStarPaint);\n            }\n\n            if (inWarp) {\n                final float frac = (mWarp - MIN_WARP) / (MAX_WARP - MIN_WARP);\n                if (isSRgbExtSupported) {\n                    canvas.drawColor(packHdrColor(2.0f, frac * frac));\n                } else {\n                    canvas.drawColor(packColor(2.0f, frac * frac));\n                }\n            }\n        }\n\n        @Override\n        public void setAlpha(int alpha) {\n\n        }\n\n        @Override\n        public void setColorFilter(@Nullable ColorFilter colorFilter) {\n\n        }\n\n        @Override\n        public int getOpacity() {\n            return PixelFormat.OPAQUE;\n        }\n\n        public void update(long dt) {\n            mDt = dt;\n        }\n\n        @ChecksSdkIntAtLeast(api = Build.VERSION_CODES.Q)\n        private static final boolean isSRgbExtSupported = Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q;\n\n        public static int packColor(float value, float alpha) {\n            int v = (int) (value * 255 + 0.5f);\n            int a = (int) (alpha * 255 + 0.5f);\n            return Color.argb(a, v, v, v);\n        }\n\n        private static ColorSpace sSrgbExt;\n        @RequiresApi(api = Build.VERSION_CODES.O)\n        public static long packHdrColor(float value, float alpha) {\n            if (sSrgbExt == null) {\n                sSrgbExt = ColorSpace.get(ColorSpace.Named.EXTENDED_SRGB);\n            }\n            return Color.valueOf(value, value, value, alpha, sSrgbExt).pack();\n        }\n    }\n}"</script>

<script>
  const _raw = document.getElementById('raw-source').textContent;
  const _origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    if (typeof input === 'string' && input.endsWith('/source.txt')) {
      return Promise.resolve(new Response(_raw, { status: 200 }));
    }
    return _origFetch(input, init);
  };
</script>
