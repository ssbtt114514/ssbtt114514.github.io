<script>
/* =====================================================================
 * LANDROID — Android Baklava 彩蛋 (1:1 HTML 还原)
 * 优化缩放逻辑：缩小最大缩放范围，增加平滑，避免极端拉扯
 * ===================================================================== */

'use strict';

/* ── Vec2 ── */
const PI2 = Math.PI * 2;
const V = (x=0, y=0) => ({x, y});
const Vadd = (a,b) => ({x:a.x+b.x, y:a.y+b.y});
const Vsub = (a,b) => ({x:a.x-b.x, y:a.y-b.y});
const Vmul = (a,k) => ({x:a.x*k, y:a.y*k});
const Vmag = a => Math.hypot(a.x, a.y);
const Vdist = (a,b) => Vmag(Vsub(a,b));
const Vangle = a => Math.atan2(a.y, a.x);
const Vwith = (angle, mag) => ({x: Math.cos(angle)*mag, y: Math.sin(angle)*mag});

/* ── 原版常量 ── */
const GRAVITATION = 1e-2;
const KEPLER_CONSTANT = 50;
const PLANETARY_DENSITY = 2.5;
const STELLAR_DENSITY = 0.5;
const SPACECRAFT_MASS = 10;
const CRAFT_SPEED_LIMIT = 5000;
const MAIN_ENGINE_ACCEL = 1000;
const LAUNCH_MECO = 2;
const LANDING_REMOVAL_TIME = 60 * 15;
const UNIVERSE_RANGE = 200_000;
const STAR_RADIUS_RANGE = [1000, 8000];
const PLANET_RADIUS_RANGE = [50, 2000];
const NUM_PLANETS_RANGE = [1, 10];

let DYNAMIC_ZOOM = true;
let TOUCH_CAMERA_PAN = true;
let TOUCH_CAMERA_ZOOM = true;

/* ── 缩放范围（优化后）── */
const ZOOM_MIN = 0.05;          // 最小缩放（防止过度放大看到空白）
const ZOOM_MAX = 3.0;           // 最大缩放（避免像素化）
const ZOOM_SMOOTH = 4.0;        // 平滑速度
let targetZoom = 1.0;           // 目标缩放，用于平滑过渡

/* ── RNG ── */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function dailySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + d.getMonth() * 100 + d.getDate();
}
function lerp(a,b,t){ return a + (b - a) * t; }
function expSmooth(cur, tgt, dt, speed) {
  return cur + (tgt - cur) * (1 - Math.exp(-dt * speed));
}

/* ── 名称生成 ── */
const PLANET_DESCS = ['繁茂','深红','蔚蓝','黑曜','冰封','熔岩','剧毒','翠绿','水晶','铜绿','霜冻','荒芜','薄雾','闪光','璀璨','微光','炽烈','雄伟','静谧','喧腾','欢腾','低语','遗忘','神圣'];
const LIFE_DESCS   = ['繁盛','稀疏','旺盛','无生命','变异','共生','适应','高智','原始','高等','机械','和谐','悖论','临界','短暂'];
const PLANET_TYPES = ['行星','卫星','世界','球体','星体','天体','星'];
const ATMO_DESCS   = ['氮氧','甲烷','硫酸','氦气','真空','稀薄','有毒','可呼吸','浓密','稀薄','不稳定'];
const CONSTELLATIONS = ['御夫','北极','鲸鱼','天龙','波江','天炉','长蛇','天琴','山案','矩尺','南极','孔雀','罗盘','网罟','玉夫','杜鹃','飞鱼','船帆'];
const SUFFIXES = ['主星','次星','初序','第二','第三','半人马','比邻','终末','隐匿','南极','北极','隐秘','深藏'];
const DELIMS   = [' ',' ',' ',' ',' ',' ',' ','-','-','-','_','/','.','*','^','#'];
const ATMO_PL  = ['云层','蒸汽','薄雾','风暴','雾霭','气流','狂风','飓风'];
const FLORA_PL = ['森林','树丛','丛林','苔藓','地衣','菌类','竹林','海藻','蕨类','苏铁'];
const FAUNA_PL = ['螃蟹','鸟类','哺乳','鱼类','昆虫','爬行','两栖','甲虫','蛛形'];
const ACTIVITIES = [
  '和{fauna}一起野餐','徒步穿越{flora}','用吸管啜饮{atmo}','为画廊拍摄{planet}',
  '给{fauna}朗诵诗歌','为{flora}插上一面旗帜','素描{atmo}形态','聆听{fauna}的八卦',
];
const pickBag = (arr, rng) => arr[Math.floor(rng() * arr.length)];

function nameSystem(rng) {
  const parts = [pickBag(CONSTELLATIONS, rng)];
  if (rng() <= 0.75) parts.push(pickBag(DELIMS, rng), pickBag(SUFFIXES, rng));
  if (rng() <= 0.30) parts.push(pickBag(DELIMS, rng), String.fromCharCode(65 + Math.floor(rng()*26)));
  if (rng() <= 0.30) parts.push(pickBag(DELIMS, rng), String(2 + Math.floor(rng()*5037)));
  return parts.join('');
}
function describePlanet(rng) { return pickBag(PLANET_DESCS, rng) + pickBag(PLANET_TYPES, rng); }
function describeLife(rng)   { return pickBag(LIFE_DESCS, rng); }
function describeAtmo(rng)   { return pickBag(ATMO_DESCS, rng); }
function describeActivity(rng, planet) {
  const tmpl = pickBag(ACTIVITIES, rng);
  return tmpl
    .replace('{flora}',  (planet?.flora || '某种') + pickBag(FLORA_PL, rng))
    .replace('{fauna}',  (planet?.fauna || '某种') + pickBag(FAUNA_PL, rng))
    .replace('{atmo}',   (planet?.atmosphere || '某种') + pickBag(ATMO_PL, rng))
    .replace('{planet}', (planet?.description || '某天体'));
}

/* ── 实体类 ── */
class Body {
  constructor() {
    this.pos = V(); this.opos = V(); this.velocity = V();
    this.angle = 0; this.radius = 0; this.mass = 0; this.collides = true;
  }
  update(dt) {
    if (dt <= 0) return;
    this.opos = { ...this.pos };
    this.pos = Vadd(this.pos, Vmul(this.velocity, dt));
  }
  postUpdate(dt) {
    if (dt <= 0) return;
    this.velocity = Vmul(Vsub(this.pos, this.opos), 1/dt);
  }
}

class Star extends Body {
  constructor(rng, radius) {
    super();
    this.cls = ['O','B','A','F','G','K','M'][Math.floor(rng()*7)];
    this.radius = radius;
    this.mass = (4/3) * Math.PI * Math.pow(radius, 3) * STELLAR_DENSITY;
    this.color = ({O:'#6666FF', B:'#CCCCFF', A:'#EEEEFF', F:'#FFFFFF', G:'#FFFF66', K:'#FFCC33', M:'#FF8800'})[this.cls];
    this.collides = false;
    this.anim = 0;
    this.name = '';
  }
  update(dt) { this.anim += dt; }
}

class Planet extends Body {
  constructor(rng, star, radius, orbitRadius) {
    super();
    this.orbitCenter = { ...star.pos };
    this.radius = radius;
    this.mass = (4/3) * Math.PI * Math.pow(radius, 3) * PLANETARY_DENSITY;
    const period = Math.sqrt(Math.pow(orbitRadius, 3) / star.mass) * KEPLER_CONSTANT;
    this.speed = (2 * Math.PI * orbitRadius) / period;
    this.pos = Vadd(star.pos, Vwith(rng() * PI2, orbitRadius));
    this.color = '#A7A7CA';
    this.description = describePlanet(rng);
    this.atmosphere = describeAtmo(rng);
    this.flora = describeLife(rng);
    this.fauna = describeLife(rng);
    this.explored = false;
    this.name = '';
    this.orbitRadius = orbitRadius;
  }
  update(dt) {
    const ang = Vangle(Vsub(this.pos, this.orbitCenter));
    this.velocity = Vwith(ang + Math.PI/2, this.speed);
    super.update(dt);
  }
  postUpdate(dt) {
    const ang = Vangle(Vsub(this.pos, this.orbitCenter));
    this.pos = Vadd(this.orbitCenter, Vwith(ang, this.orbitRadius));
    super.postUpdate(dt);
  }
}

class Spacecraft extends Body {
  constructor() {
    super();
    this.mass = SPACECRAFT_MASS;
    this.radius = 12;
    this.thrust = V();
    this.thrustCmd = 0;
    this.thrustAngle = 0;
    this.launchClock = 0;
    this.transit = false;
    this.track = [];
    this.landing = null;
    this.autopilot = null;
  }
  update(sim, dt) {
    if (this.thrustCmd > 0) {
      let deltaV = MAIN_ENGINE_ACCEL * dt * this.thrustCmd;
      if (this.landing) {
        if (this.launchClock === 0) this.launchClock = sim.now + 1;
        if (sim.now > this.launchClock) {
          this.landing.ship = null;
          this.landing = null;
        } else deltaV = 0;
      }
      this.velocity = Vadd(this.velocity, Vwith(this.thrustAngle, deltaV));
    } else if (this.launchClock !== 0) this.launchClock = 0;
    if (Vmag(this.velocity) > CRAFT_SPEED_LIMIT) {
      this.velocity = Vwith(Vangle(this.velocity), CRAFT_SPEED_LIMIT);
    }
    super.update(dt);
  }
  postUpdate(dt) {
    super.postUpdate(dt);
    this.track.push({ x: this.pos.x, y: this.pos.y, age: 0 });
    if (this.track.length > 600) this.track.shift();
    for (const t of this.track) t.age += dt;
  }
}

class Landing {
  constructor(ship, planet, angle, text) {
    this.ship = ship; this.planet = planet; this.angle = angle; this.text = text;
    this.life = LANDING_REMOVAL_TIME;
  }
  update(dt) { this.life -= dt; }
  get canBeRemoved() { return this.life < 0; }
}

class Spark {
  constructor(pos, velocity, ttl) {
    this.pos = { ...pos }; this.velocity = { ...velocity };
    this.ttl = ttl; this.life = ttl; this.size = 1;
    this.color = '#FFFFFF'; this.style = 'DOT';
  }
  update(dt) {
    this.pos = Vadd(this.pos, Vmul(this.velocity, dt));
    this.life -= dt;
  }
  get canBeRemoved() { return this.life < 0; }
}

/* ── Autopilot ── */
class Autopilot {
  constructor(ship, universe) {
    this.ship = ship; this.universe = universe;
    this.BRAKING_TIME = 5; this.SIGHTSEEING_TIME = 15;
    this.LAUNCH_THRUST_TIME = 5; this.STRATEGY_MIN_TIME = 0.5;
    this.enabled = false;
    this.target = null;
    this.landingAltitude = 0;
    this.nextStrategyTime = 0;
    this.brakingDistance = 0;
    this.leadingPos = V();
    this.leadingVector = V();
    this.strategy = 'NONE';
    this.debug = '';
  }
  static STRATEGY_CN = {
    NONE: '空闲', LANDED: '已着陆', LAUNCHING: '起飞中',
    CHASING: '追击', APPROACHING: '接近', LANDING: '着陆',
  };
  update(sim, dt) {
    if (!this.enabled) return;
    if (sim.now < this.nextStrategyTime) return;
    const currentStrategy = this.strategy;

    if (this.ship.landing != null) {
      if (this.target != null) {
        this.strategy = 'LANDED';
        this.debug = '';
        this.target = null;
        this.landingAltitude = 0;
        this.nextStrategyTime = sim.now + this.SIGHTSEEING_TIME;
      } else {
        this.ship.thrustCmd = 1;
        this.ship.thrustAngle = this.ship.angle;
        this.strategy = 'LAUNCHING';
        this.debug = '';
        this.nextStrategyTime = sim.now + this.LAUNCH_THRUST_TIME;
      }
    } else {
      if (this.target == null) {
        const unexplored = this.universe.planets.filter(p => !p.explored)
          .sort((a, b) => Vdist(a.pos, this.ship.pos) - Vdist(b.pos, this.ship.pos));
        this.target = unexplored[0] || this.universe.planets[Math.floor(Math.random()*this.universe.planets.length)];
        this.brakingDistance = 0;
      }
      const tgt = this.target;
      const shipV = this.ship.velocity;
      const targetV = tgt.velocity;
      const targetVec = Vsub(tgt.pos, this.ship.pos);
      const altitude = Vmag(targetVec) - tgt.radius;

      this.landingAltitude = Math.min(tgt.radius, 100);

      const relativeV = Vsub(shipV, targetV);
      const projection = (() => {
        const m = Vmag(targetVec);
        return relativeV.x * targetVec.x/m + relativeV.y * targetVec.y/m;
      })();
      const relativeSpeed = Vmag(relativeV) * Math.sign(projection);
      const timeToTarget = relativeSpeed !== 0 ? altitude / relativeSpeed : 1000;

      const newBrakingDistance = this.BRAKING_TIME * (relativeSpeed > 0 ? relativeSpeed : MAIN_ENGINE_ACCEL);
      this.brakingDistance = expSmooth(this.brakingDistance, newBrakingDistance, dt, 5);

      this.leadingPos = Vadd(tgt.pos,
        Vwith(Vangle(tgt.velocity), Math.min(altitude / 2, Vmag(tgt.velocity))));
      this.leadingVector = Vsub(this.leadingPos, this.ship.pos);

      if (altitude < this.landingAltitude) {
        this.strategy = 'LANDING';
        this.ship.thrustAngle = Vangle(Vsub(this.ship.pos, tgt.pos));
        this.ship.thrustCmd = 0;
      } else if (relativeSpeed < 0 || altitude > this.brakingDistance) {
        this.strategy = 'CHASING';
        this.ship.thrustAngle = Vangle(this.leadingVector);
        this.ship.thrustCmd = 1.0;
      } else {
        this.strategy = 'APPROACHING';
        this.ship.thrustAngle = Vangle(Vmul(this.ship.velocity, -1));
        const decel = relativeSpeed / timeToTarget;
        const decelThrust = (decel / MAIN_ENGINE_ACCEL) * 0.9;
        this.ship.thrustCmd = Math.max(0, Math.min(1, decelThrust));
      }
      this.debug = `DV=${relativeSpeed.toFixed(0)} D=${altitude.toFixed(0)} T${timeToTarget >= 0 ? '+' : ''}${timeToTarget.toFixed(1)}`;
    }
    if (this.strategy !== currentStrategy) {
      this.nextStrategyTime = sim.now + this.STRATEGY_MIN_TIME;
    }
  }
}

/* ── Universe ── */
class Universe {
  constructor(seed) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.now = 0;
    this.dt = 0;
    this.planets = [];
    this.ship = null;
    this.star = null;
    this.sparks = [];
    this.landings = [];
    this.follow = null;
    this.latestDiscovery = null;
  }
  initRandom() {
    const systemName = nameSystem(this.rng);
    const starR = lerp(STAR_RADIUS_RANGE[0], STAR_RADIUS_RANGE[1], this.rng());
    this.star = new Star(this.rng, starR);
    this.star.name = systemName;

    const n = 4 + Math.floor(this.rng() * 5);
    for (let i = 0; i < n; i++) {
      const r = lerp(PLANET_RADIUS_RANGE[0], PLANET_RADIUS_RANGE[1], this.rng());
      const orbitR = lerp(STAR_RADIUS_RANGE[1] * 2, UNIVERSE_RANGE * 0.75, Math.pow(this.rng(), 0.6));
      this.planets.push(new Planet(this.rng, this.star, r, orbitR));
    }
    this.planets.sort((a, b) => Vdist(a.pos, this.star.pos) - Vdist(b.pos, this.star.pos));
    this.planets.forEach((p, idx) => p.name = `${systemName} ${idx + 1}`);

    this.ship = new Spacecraft();
    this.ship.pos = Vadd(this.star.pos, Vwith(this.rng() * PI2, lerp(STAR_RADIUS_RANGE[1] * 2, UNIVERSE_RANGE * 0.75, this.rng())));
    this.ship.angle = this.rng() * PI2;

    const ap = new Autopilot(this.ship, this);
    this.ship.autopilot = ap;
    this.follow = this.ship;
  }
  applyGravity(dt) {
    if (this.now <= this.ship.launchClock + LAUNCH_MECO) return;
    this.ship.transit = false;
    for (const body of [...this.planets, this.star]) {
      const v = Vsub(body.pos, this.ship.pos);
      const d = Vmag(v);
      if (d < body.radius) {
        if (body instanceof Star) this.ship.transit = true;
        continue;
      }
      const accel = GRAVITATION * (this.ship.mass * body.mass) / (d * d);
      const dv = Vwith(Vangle(v), accel * dt);
      this.ship.velocity = Vadd(this.ship.velocity, dv);
    }
  }
  resolveCollisions() {
    if (this.ship.landing) return;
    let closest = null, closestD = Infinity;
    for (const body of [...this.planets, this.star]) {
      const d = Vdist(body.pos, this.ship.pos);
      if (d < closestD) { closestD = d; closest = body; }
    }
    if (!closest || !closest.collides) return;
    const surfaceD = Vdist(closest.pos, this.ship.pos) - this.ship.radius - closest.radius;
    if (surfaceD >= 0) return;

    const a = Vangle(Vsub(this.ship.pos, closest.pos));
    const aDiff = Math.abs(this.ship.angle - a);

    if (aDiff < Math.PI / 4) {
      const landing = new Landing(this.ship, closest, a, describeActivity(this.rng, closest));
      this.ship.thrustCmd = 0;
      this.ship.thrust = V();
      this.ship.landing = landing;
      this.ship.velocity = { ...closest.velocity };
      this.landings.push(landing);
      closest.explored = true;
      this.latestDiscovery = closest;
      showToast(`已着陆: ${closest.name}`, landing.text, 4500);
    } else {
      const impact = Vadd(closest.pos, Vwith(a, closest.radius));
      this.ship.pos = Vadd(closest.pos, Vwith(a, closest.radius + this.ship.radius - surfaceD));
      this.ship.thrustCmd = 0;
      for (let i = 0; i < 14; i++) {
        const ang = this.rng() * PI2;
        const mag = 0.1 + this.rng() * 0.4;
        this.sparks.push(new Spark(
          Vadd(impact, Vwith(ang, mag)),
          { x: this.ship.velocity.x * 0.8 + Math.cos(ang) * mag, y: this.ship.velocity.y * 0.8 + Math.sin(ang) * mag },
          0.5 + this.rng() * 1.5
        ));
      }
      this.ship.velocity = Vmul(this.ship.velocity, 0.2);
    }
  }
  step(dt) {
    this.dt = dt;
    this.now += dt;
    this.applyGravity(dt);
    for (const p of this.planets) p.update(dt);
    this.star.update(dt);
    this.ship.update(this, dt);
    for (const p of this.planets) p.postUpdate(dt);
    this.ship.postUpdate(dt);
    for (const land of this.landings) land.update(dt);
    for (const s of this.sparks) s.update(dt);
    this.resolveCollisions();
    this.landings = this.landings.filter(l => !l.canBeRemoved);
    this.sparks = this.sparks.filter(s => !s.canBeRemoved);
    if (this.ship.autopilot) this.ship.autopilot.update(this, dt);
    if (this.ship.autopilot?.enabled) {
      this.ship.thrust = Vwith(this.ship.thrustAngle, this.ship.thrustCmd);
    }
  }
}

/* ── Canvas ── */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let DPR = Math.min(window.devicePixelRatio || 1, 2);
let viewW = 0, viewH = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  viewW = rect.width; viewH = rect.height;
  canvas.width = viewW * DPR; canvas.height = viewH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
new ResizeObserver(resize).observe(canvas.parentElement);
resize();

/* ── Game state ── */
let universe = new Universe(dailySeed());

/* ── UI 状态 ── */
const flags = {
  DRAW_ORBITS: true,
  DRAW_GRAVITATIONAL_FIELDS: false,
  DRAW_STAR_GRAVITATIONAL_FIELDS: true,
  TRACK: true,
  flagFlag: true,
};

/* ── 摇杆 ── */
const stick = {
  active: false,
  origin: { x: 0, y: 0 },
  pointer: { x: 0, y: 0 },
  minRadius: 40,
  maxRadius: 120,
};

function stickStart(x, y) {
  stick.active = true;
  stick.origin = { x, y };
  stick.pointer = { x, y };
  showStickIndicator(x, y);
}
function stickMove(x, y) {
  if (!stick.active) return;
  stick.pointer = { x, y };
  updateStickIndicator();
}
function stickEnd() {
  stick.active = false;
  hideStickIndicator();
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  e.stopPropagation();
  stickStart(e.clientX, e.clientY);
  try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
}, { passive: false });
canvas.addEventListener('pointermove', e => {
  if (!stick.active) return;
  stickMove(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('pointerup', stickEnd);
document.addEventListener('pointercancel', stickEnd);

/* 触屏兼容 */
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0];
  stickStart(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (!stick.active) return;
  if (e.touches.length !== 1) return;
  e.preventDefault();
  const t = e.touches[0];
  stickMove(t.clientX, t.clientY);
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  stickEnd();
}, { passive: false });
canvas.addEventListener('touchcancel', stickEnd);

/* 双指捏合缩放 */
let pinchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const a = e.touches[0], b = e.touches[1];
    pinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinchDist > 0) {
      const factor = d / pinchDist;
      targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom * factor));
    }
    pinchDist = d;
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

/* 滚轮缩放 */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, targetZoom * factor));
}, { passive: false });

/* ── 摇杆指示器 ── */
const stickIndicator = document.createElement('div');
stickIndicator.id = 'stick-indicator';
stickIndicator.style.cssText = `position: fixed; pointer-events: none; z-index: 20; display: none;`;
document.body.appendChild(stickIndicator);

function showStickIndicator(x, y) {
  stickIndicator.style.display = 'block';
  stickIndicator.style.left = (x - 60) + 'px';
  stickIndicator.style.top = (y - 60) + 'px';
  updateStickIndicator();
}
function updateStickIndicator() {
  if (!stick.active) return;
  const dx = stick.pointer.x - stick.origin.x;
  const dy = stick.pointer.y - stick.origin.y;
  const mag = Math.min(stick.maxRadius, Math.hypot(dx, dy));
  const a = Math.atan2(dy, dx);
  const r = Math.max(stick.minRadius, mag);
  const thrustRatio = mag <= stick.minRadius ? 0 : (mag - stick.minRadius) / (stick.maxRadius - stick.minRadius);
  const color = thrustRatio === 0 ? 'rgba(167,167,202,0.7)' : 'rgba(52,168,83,0.85)';
  stickIndicator.innerHTML = `
    <svg width="120" height="120" viewBox="-60 -60 120 120" style="overflow:visible">
      <circle r="${stick.minRadius}" fill="none" stroke="rgba(167,167,202,0.35)" stroke-dasharray="3 3" stroke-width="1"/>
      <circle r="${stick.maxRadius}" fill="none" stroke="rgba(167,167,202,0.18)" stroke-width="1"/>
      <line x1="0" y1="0" x2="${Math.cos(a) * r}" y2="${Math.sin(a) * r}" stroke="${color}" stroke-width="2"/>
      <circle cx="${Math.cos(a) * r}" cy="${Math.sin(a) * r}" r="6" fill="${color}"/>
      <text x="0" y="-65" text-anchor="middle" style="font:10px JetBrains Mono;fill:${color === 'rgba(167,167,202,0.7)' ? '#A7A7CA' : '#34A853'};letter-spacing:2px">
        ${mag <= stick.minRadius ? 'REORIENT' : `THRUST ${(thrustRatio*100).toFixed(0)}%`}
      </text>
    </svg>`;
}
function hideStickIndicator() {
  stickIndicator.style.display = 'none';
}

/* ── 键盘 ── */

window.addEventListener('keydown', e => {

});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ── 控制函数 ── */

/* ── Toast ── */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(title, sub = '', dur = 2500) {

}

/* ── 主循环 ── */
let lastT = performance.now();
let fpsAvg = 60, fpsAcc = 0, fpsCount = 0;

function tick(now) {
  const realDt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  fpsAcc += 1 / Math.max(realDt, 1e-6);
  fpsCount++;
  if (fpsCount >= 30) { fpsAvg = fpsAcc / fpsCount; fpsAcc = 0; fpsCount = 0; }

  const ship = universe.ship;
  const ap = ship.autopilot;

  /* 摇杆 → 推力 */
  if (stick.active) {
    const dx = stick.pointer.x - stick.origin.x;
    const dy = stick.pointer.y - stick.origin.y;
    const mag = Math.min(stick.maxRadius, Math.hypot(dx, dy));
    if (mag > 0) {
      const a = Math.atan2(dy, dx);
      if (mag < stick.minRadius) {
        ship.thrustCmd = 0;
        ship.thrustAngle = a;
      } else {
        ship.thrustAngle = a;
        const m = (mag - stick.minRadius) / (stick.maxRadius - stick.minRadius);
        ship.thrustCmd = Math.max(0, Math.min(1, m));
      }
      ship.thrust = Vwith(ship.thrustAngle, ship.thrustCmd);
      if (!ap.enabled) ship.angle = ship.thrustAngle;
    }
  }
  if (!stick.active && !ap.enabled) {
    let turn = 0;
    if (keys['a'] || keys['arrowleft'])  turn -= 1;
    if (keys['d'] || keys['arrowright']) turn += 1;
    if (turn) ship.angle += turn * 1.8 * realDt;
    let thrustMag = 0;
    if (keys[' '] || keys['w'] || keys['arrowup']) thrustMag = 1;
    ship.thrustAngle = ship.angle;
    ship.thrustCmd = thrustMag;
    ship.thrust = Vwith(ship.angle, thrustMag);
  }

  /* 物理子步 */
  for (let i = 0; i < 4; i++) universe.step(realDt / 4);

  /* 相机跟随 */
  cam.offX = -(universe.follow?.pos?.x || 0);
  cam.offY = -(universe.follow?.pos?.y || 0);

  /* 动态缩放（优化版：更平滑、限制范围） */
  if (DYNAMIC_ZOOM) {
    const closest = universe.planets.concat([universe.star])
      .sort((a, b) => Vdist(a.pos, ship.pos) - Vdist(b.pos, ship.pos))[0];
    const d = Math.max(0, Vdist(closest.pos, ship.pos) - closest.radius * 1.2);
    const idealZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, 500 / Math.max(d, 1)));
    targetZoom = idealZoom;
  }
  // 平滑过渡到目标缩放
  cam.zoom = expSmooth(cam.zoom, targetZoom, realDt, ZOOM_SMOOTH);

  draw();
  updateDEBUG();
  updateTelemetry();

  requestAnimationFrame(tick);
}

/* ── 渲染 ── */
function draw() {
  ctx.fillStyle = '#16161D';
  ctx.fillRect(0, 0, viewW, viewH);

  const cx = viewW * cam.centerX;
  const cy = viewH * cam.centerY;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(cam.offX, cam.offY);

  drawBackground();
  drawGrid();
  drawRingfence();

  for (const p of universe.planets) drawPlanet(p);
  drawStar(universe.star);

  for (const s of universe.sparks) drawSpark(s);

  if (flags.TRACK) drawTrack(universe.ship.track);

  drawSpacecraft(universe.ship);

  for (const land of universe.landings) drawLanding(land);

  if (universe.ship.autopilot?.enabled) drawAutopilot(universe.ship.autopilot);

  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = '#FFFFFF';
  for (const s of bgStars) {
    ctx.globalAlpha = 0.3 + s.s * 0.4;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}

function drawGrid() {
  let step = 1000;
  while (step * cam.zoom < 32) step *= 10;

  ctx.strokeStyle = '#292936';
  ctx.lineWidth = 1 / cam.zoom;
  const vw = viewW / cam.zoom, vh = viewH / cam.zoom;
  const camX = -cam.offX, camY = -cam.offY;
  const left   = camX - vw * cam.centerX;
  const right  = camX + vw * (1 - cam.centerX);
  const top    = camY - vh * cam.centerY;
  const bottom = camY + vh * (1 - cam.centerY);

  ctx.beginPath();
  for (let x = Math.floor(left / step) * step; x < right; x += step) {
    ctx.moveTo(x, top); ctx.lineTo(x, bottom);
  }
  for (let y = Math.floor(top / step) * step; y < bottom; y += step) {
    ctx.moveTo(left, y); ctx.lineTo(right, y);
  }
  ctx.stroke();
}

function drawRingfence() {
  ctx.strokeStyle = '#800000';
  ctx.setLineDash([8 / cam.zoom, 8 / cam.zoom]);
  ctx.beginPath();
  ctx.arc(0, 0, UNIVERSE_RANGE, 0, PI2);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawStar(star) {
  ctx.save();
  ctx.translate(star.pos.x, star.pos.y);

  const glow = ctx.createRadialGradient(0, 0, star.radius * 0.8, 0, 0, star.radius * 3);
  glow.addColorStop(0, star.color + 'AA');
  glow.addColorStop(1, star.color + '00');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(0, 0, star.radius * 3, 0, PI2); ctx.fill();

  ctx.fillStyle = star.color;
  ctx.beginPath(); ctx.arc(0, 0, star.radius, 0, PI2); ctx.fill();

  if (flags.DRAW_STAR_GRAVITATIONAL_FIELDS) drawGravField(star);

  drawStarSpikes(star.radius + 80, star.radius + 250, 31, star.anim / 23);
  drawStarSpikes(star.radius + 20, star.radius + 200, 32, -star.anim / 19);

  ctx.restore();
}

function drawStarSpikes(r1, r2, points, rot) {
  ctx.save();
  ctx.rotate(rot * PI2);
  ctx.strokeStyle = universe.star.color;
  ctx.lineWidth = 3 / cam.zoom;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  const step = PI2 / points;
  for (let i = 0; i < points; i++) {
    const a1 = step * i, a2 = a1 + step / 2;
    const x1 = Math.cos(a1) * r1, y1 = Math.sin(a1) * r1;
    const x2 = Math.cos(a2) * r2, y2 = Math.sin(a2) * r2;
    const x3 = Math.cos(a1 + step) * r1, y3 = Math.sin(a1 + step) * r1;
    if (i === 0) ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawGravField(body) {
  const rings = 8;
  for (let i = 0; i < rings; i++) {
    const force = lerp(200, 0.01, i / rings);
    const r = Math.sqrt(GRAVITATION * body.mass * SPACECRAFT_MASS / force);
    ctx.strokeStyle = `rgba(255,0,0,${lerp(0.4, 0.08, i/rings)})`;
    ctx.lineWidth = 2 / cam.zoom;
    ctx.beginPath();
    ctx.arc(body.pos.x, body.pos.y, r, 0, PI2);
    ctx.stroke();
  }
}

function drawPlanet(p) {
  if (flags.DRAW_ORBITS) {
    ctx.strokeStyle = 'rgba(0,255,255,0.5)';
    ctx.lineWidth = 1 / cam.zoom;
    ctx.beginPath();
    ctx.arc(p.orbitCenter.x, p.orbitCenter.y, p.orbitRadius, 0, PI2);
    ctx.stroke();
  }
  if (flags.DRAW_GRAVITATIONAL_FIELDS) drawGravField(p);

  ctx.fillStyle = '#16161D';
  ctx.beginPath(); ctx.arc(p.pos.x, p.pos.y, p.radius, 0, PI2); ctx.fill();
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2 / cam.zoom;
  ctx.beginPath(); ctx.arc(p.pos.x, p.pos.y, p.radius, 0, PI2); ctx.stroke();

  if (p.explored) {
    ctx.strokeStyle = 'rgba(198,255,0,0.6)';
    ctx.lineWidth = 1.5 / cam.zoom;
    ctx.beginPath();
    ctx.arc(p.pos.x, p.pos.y, p.radius + 8 / cam.zoom, 0, PI2);
    ctx.stroke();
  }
}

function drawSpark(s) {
  const life = 1 - s.life / s.ttl;
  if (s.style === 'DOT') {
    ctx.fillStyle = s.color;
    ctx.globalAlpha = 1 - life;
    ctx.beginPath(); ctx.arc(s.pos.x, s.pos.y, s.size, 0, PI2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawTrack(track) {
  if (!track || track.length < 2) return;
  ctx.strokeStyle = '#34A853';
  ctx.lineWidth = 1.5 / cam.zoom;
  ctx.beginPath();
  for (let i = 0; i < track.length; i++) {
    const t = track[i];
    if (i === 0) ctx.moveTo(t.x, t.y);
    else ctx.lineTo(t.x, t.y);
  }
  ctx.stroke();
}

function drawSpacecraft(s) {
  ctx.save();
  ctx.translate(s.pos.x, s.pos.y);
  ctx.rotate(s.angle);

  if (s.thrustCmd > 0) {
    const intensity = s.thrustCmd;
    const flicker = 0.7 + Math.random() * 0.6;
    const flameLen = 16 + intensity * 12 * flicker;
    const grad = ctx.createLinearGradient(-8, 0, -8 - flameLen, 0);
    grad.addColorStop(0, '#FFFF88');
    grad.addColorStop(0.4, '#FF8800');
    grad.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-8, -3);
    ctx.lineTo(-8 - flameLen, 0);
    ctx.lineTo(-8, 3);
    ctx.closePath();
    ctx.fill();
  }

  const path = new Path2D(`M11.853 0 C11.853 -4.418 8.374 -8 4.083 -8 L-5.5 -8 C-6.328 -8 -7 -7.328 -7 -6.5 C-7 -5.672 -6.328 -5 -5.5 -5 L-2.917 -5 C-1.26 -5 0.083 -3.657 0.083 -2 L0.083 2 C0.083 3.657 -1.26 5 -2.917 5 L-5.5 5 C-6.328 5 -7 5.672 -7 6.5 C-7 7.328 -6.328 8 -5.5 8 L4.083 8 C8.374 8 11.853 4.418 11.853 0 Z`);
  ctx.fillStyle = '#16161D';
  ctx.fill(path);
  ctx.strokeStyle = s.transit ? '#000000' : '#FFFFFF';
  ctx.lineWidth = 2 / cam.zoom;
  ctx.stroke(path);

  if (s.landing) {
    ctx.strokeStyle = '#CCCCCC';
    ctx.lineWidth = 2 / cam.zoom;
    ctx.beginPath();
    ctx.moveTo(-7, -6.5); ctx.lineTo(-10.5, -6.5); ctx.lineTo(-11.5, -8.5); ctx.lineTo(-11.5, -4.5); ctx.lineTo(-10.5, -6.5);
    ctx.moveTo(-7,  6.5); ctx.lineTo(-10.5,  6.5); ctx.lineTo(-11.5,  8.5); ctx.lineTo(-11.5,  4.5); ctx.lineTo(-10.5,  6.5);
    ctx.stroke();
  }

  ctx.restore();
}

function drawLanding(land) {
  if (!flags.flagFlag) return;
  const v = Vadd(land.planet.pos, Vwith(land.angle, land.planet.radius));
  ctx.save();
  ctx.translate(v.x, v.y);
  ctx.rotate(land.angle);
  ctx.strokeStyle = '#C6FF00';
  ctx.lineWidth = 2 / cam.zoom;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(80, 0);
  ctx.lineTo(70, 20);
  ctx.lineTo(60, 0);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function drawAutopilot(ap) {
  if (!ap || !ap.target) return;
  const tgt = ap.target;
  const color = 'rgba(66,133,244,0.5)';
  ctx.save();
  ctx.translate(tgt.pos.x, tgt.pos.y);
  ctx.rotate(universe.now * PI2 / 10);
  const sides = 15;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1 / cam.zoom;
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const a = (i / sides) * PI2;
    const x = Math.cos(a) * (tgt.radius + ap.brakingDistance);
    const y = Math.sin(a) * (tgt.radius + ap.brakingDistance);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1 / cam.zoom;
  ctx.beginPath();
  ctx.moveTo(ap.ship.pos.x, ap.ship.pos.y);
  ctx.lineTo(ap.leadingPos.x, ap.leadingPos.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(ap.leadingPos.x, ap.leadingPos.y, 5 / cam.zoom, 0, PI2);
  ctx.stroke();
}

  const shipStr = `p=<${u.ship.pos.x.toFixed(1).padStart(7)},${u.ship.pos.y.toFixed(1).padStart(7)}> v=${Vmag(u.ship.velocity).toFixed(2).padStart(7)} a=${u.ship.angle.toFixed(3)} t=<${u.ship.thrust.x.toFixed(2).padStart(5)},${u.ship.thrust.y.toFixed(2).padStart(5)}>`;

  const parts = [];
  parts.push(`模拟 //`);
  parts.push(`实体: ${u.planets.length + 2} // 缩放: ${cam.zoom.toFixed(4)}x // 帧率: ${fpsAvg.toFixed(0).padStart(3)} 步长: ${u.dt.toFixed(3)}`);
  parts.push(`飞船: ${shipStr}`);
  parts.push(`恒星: '${sysName}' 编号=${designation} 光谱=${cls} 半径=${u.star.radius.toFixed(0)} 质量=${u.star.mass.toExponential(2)}`);
  parts.push(`行星: ${u.planets.length}`);

  for (const p of u.planets) {
    const range = Vdist(u.ship.pos, p.pos);
    const vorbit = Math.sqrt(GRAVITATION * p.mass / Math.max(range, 1));
    const vescape = Math.sqrt(2 * GRAVITATION * p.mass / p.radius);
    parts.push(` * ${p.name}:`);
    if (p.explored) {
      parts.push(`   类型:  ${p.description}`);
      parts.push(`   大气:  ${p.atmosphere}`);
      parts.push(`   动物:  ${p.fauna}`);
      parts.push(`   植物:  ${p.flora}`);

    parts.push(`   轨道=${p.orbitRadius.toFixed(0)} 半径=${p.radius.toFixed(0)} 质量=${p.mass.toExponential(2)} // 距离=${range.toFixed(0)} 轨道速度=${vorbit.toFixed(0)} 逃逸速度=${vescape.toFixed(0)}`);
  }
  debugEl.textContent = parts.join('\n');
}

function escapeHtml(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function highlightKotlin(src) {
  const KW = ['package','import','class','object','interface','fun','val','var','if','else','when','for','while','do','return','in','is','as','by','companion','private','public','internal','protected','open','override','lateinit','const','enum','true','false','null','this','super','throw','try','catch','finally','init','suspend','operator','abstract','sealed','data','inline','reified','noinline','crossinline','typealias','field','get','set','continue','break'];
  let out = escapeHtml(src);
  out = out.replace(/\/\*[\s\S]*?\*\//g, m => `<span class="tk-cmt">${m}</span>`);
  out = out.replace(/\/\/[^\n]*/g, m => `<span class="tk-cmt">${m}</span>`);
  out = out.replace(/(&quot;|"|')((?:\\\1|(?!\1).)*?)\1/g, m => `<span class="tk-str">${m}</span>`);
  out = out.replace(/@([A-Za-z_][A-Za-z0-9_]*)/g, '<span class="tk-anno">@$1</span>');
  out = out.replace(/\b(\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?[fFlL]?)\b/g, '<span class="tk-num">$1</span>');
  out = out.replace(new RegExp(`\\b(${KW.join('|')})\\b`, 'g'), '<span class="tk-kw">$1</span>');
  out = out.replace(/\b([A-Z][A-Za-z0-9_]*)\b/g, '<span class="tk-cls">$1</span>');
  out = out.replace(/\b([a-z_][A-Za-z0-9_]*)(?=\s*\()/g, '<span class="tk-fn">$1</span>');
  return out;
}

let sourceLoaded = false;
async function loadSource() {
  if (sourceLoaded) return;
  sourceLoaded = true;
  const resp = await fetch('/source.txt').catch(() => null);
  if (!resp || !resp.ok) return;
  const raw = await resp.text();
  const lines = raw.split('\n');

  const toc = document.getElementById('src-toc');
  toc.innerHTML = '<h4>文件列表</h4>';
  SRC_FILES.forEach(f => {
    const a = document.createElement('a');
    a.href = '#L' + f.from;
    a.dataset.line = f.from;
    a.textContent = f.name;
    a.onclick = e => {
      e.preventDefault();
      const el = document.getElementById('L' + f.from);
      if (el) document.getElementById('src-code').scrollTo({ top: el.offsetTop - 10, behavior: 'smooth' });
    };
    toc.appendChild(a);
  });

  const code = document.getElementById('src-code');
  const pre = document.createElement('pre');
  for (let i = 0; i < lines.length; i++) {
    const div = document.createElement('div');
    div.className = 'line';
    div.id = 'L' + (i + 1);
    div.innerHTML = `<span class="ln">${i + 1}</span><span>${highlightKotlin(lines[i] || ' ')}</span>`;
    pre.appendChild(div);
  }
  code.innerHTML = '';
  code.appendChild(pre);

  code.addEventListener('scroll', () => {
    const top = code.scrollTop;
    let active = SRC_FILES[0];
    for (const f of SRC_FILES) {
      const el = document.getElementById('L' + f.from);
      if (el && el.offsetTop <= top + 30) active = f;
    }
    toc.querySelectorAll('a').forEach(a => {
      a.classList.toggle('active', +a.dataset.line === active.from);
    });
  });
}

window.toggleSrc = async () => {
  const ov = document.getElementById('src-overlay');
  const showing = ov.classList.toggle('show');
  if (showing) await loadSource();
};

.fadeIn\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.material.Text\nimport androidx.compose.material.minimumInteractiveComponentSize\nimport androidx.compose.runtime.Composable\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.text.TextStyle\nimport androidx.compose.ui.unit.Dp\nimport androidx.compose.ui.unit.dp\nimport kotlin.random.Random\n\n@Composable fun Dp.toLocalPx() = with(LocalDensity.current) { this@toLocalPx.toPx() }\n\noperator fun Easing.times(next: Easing) = { x: Float -> next.transform(transform(x)) }\n\nfun flickerFadeEasing(rng: Random) = Easing { frac -> if (rng.nextFloat() < frac) 1f else 0f }\n\nval flickerFadeIn =\n    fadeIn(\n        animationSpec =\n            tween(\n                durationMillis = 1000,\n                easing = CubicBezierEasing(0f, 1f, 1f, 0f) * flickerFadeEasing(Random),\n            )\n    )\n\nfun flickerFadeInAfterDelay(delay: Int = 0) =\n    fadeIn(\n        animationSpec =\n            tween(\n                durationMillis = 1000,\n                delayMillis = delay,\n                easing = CubicBezierEasing(0f, 1f, 1f, 0f) * flickerFadeEasing(Random),\n            )\n    )\n\n@Composable\nfun ConsoleButton(\n    modifier: Modifier = Modifier,\n    textStyle: TextStyle = TextStyle.Default,\n    color: Color,\n    bgColor: Color,\n    borderColor: Color,\n    text: String,\n    onClick: () -> Unit,\n) {\n    Text(\n        style = textStyle,\n        color = color,\n        modifier =\n            modifier\n                .clickable { onClick() }\n                .background(color = bgColor)\n                .border(width = 1.dp, color = borderColor)\n                .padding(6.dp)\n                .minimumInteractiveComponentSize(),\n        text = text,\n    )\n}\n\n\npackage com.android_baklava.egg.landroid\n\nimport android.service.dreams.DreamService\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.ComposeView\nimport androidx.lifecycle.Lifecycle\nimport androidx.lifecycle.LifecycleRegistry\nimport androidx.lifecycle.setViewTreeLifecycleOwner\nimport androidx.savedstate.SavedStateRegistryController\nimport androidx.savedstate.SavedStateRegistryOwner\nimport androidx.savedstate.setViewTreeSavedStateRegistryOwner\nimport androidx.window.layout.FoldingFeature\nimport kotlin.random.Random\n\nclass DreamUniverse : DreamService() {\n    private var foldState = mutableStateOf<FoldingFeature?>(null) // unused\n\n    private val lifecycleOwner =\n        object : SavedStateRegistryOwner {\n            override val lifecycle = LifecycleRegistry(this)\n            override val savedStateRegistry\n                get() = savedStateRegistryController.savedStateRegistry\n\n            private val savedStateRegistryController =\n                SavedStateRegistryController.create(this).apply { performAttach() }\n\n            fun onCreate() {\n                savedStateRegistryController.performRestore(null)\n                lifecycle.currentState = Lifecycle.State.CREATED\n            }\n\n            fun onStart() {\n                lifecycle.currentState = Lifecycle.State.STARTED\n            }\n\n            fun onStop() {\n                lifecycle.currentState = Lifecycle.State.CREATED\n            }\n        }\n\n    private var notifier: UniverseProgressNotifier? = null\n\n    override fun onAttachedToWindow() {\n        super.onAttachedToWindow()\n\n        val universe = Universe(namer = Namer(resources), randomSeed = randomSeed())\n\n        isInteractive = false\n\n        if (TEST_UNIVERSE) {\n            universe.initTest()\n        } else {\n            universe.initRandom()\n\n            // We actually don't want the deterministic random position of the ship, we want\n            // true randomness to keep things interesting. So use Random (not universe.rng).\n            universe.ship.pos =\n                universe.star.pos +\n                    Vec2.makeWithAngleMag(\n                        Random.nextFloat() * PI2f,\n                        Random.nextFloatInRange(\n                            PLANET_ORBIT_RANGE.start,\n                            PLANET_ORBIT_RANGE.endInclusive,\n                        ),\n                    )\n        }\n\n        // enable autopilot in screensaver mode\n        val autopilot = Autopilot(universe.ship, universe)\n        universe.ship.autopilot = autopilot\n        universe.add(autopilot)\n        autopilot.enabled = true\n\n        // much more visually interesting in a screensaver context\n        DYNAMIC_ZOOM = true\n\n        val composeView = ComposeView(this)\n        composeView.setContent {\n            Spaaaace(modifier = Modifier.fillMaxSize(), u = universe, foldState = foldState)\n            DebugText(DEBUG_TEXT)\n            Telemetry(universe, showControls = false)\n        }\n\n        notifier = UniverseProgressNotifier(this, universe)\n\n        composeView.setViewTreeLifecycleOwner(lifecycleOwner)\n        composeView.setViewTreeSavedStateRegistryOwner(lifecycleOwner)\n\n        setContentView(composeView)\n    }\n\n    override fun onCreate() {\n        super.onCreate()\n        lifecycleOwner.onCreate()\n    }\n\n    override fun onDreamingStarted() {\n        super.onDreamingStarted()\n        lifecycleOwner.onStart()\n    }\n\n    override fun onDreamingStopped() {\n        super.onDreamingStopped()\n        lifecycleOwner.onStop()\n    }\n\n    override fun onDestroy() {\n        notifier?.cancel()\n        DYNAMIC_ZOOM = false\n        super.onDestroy()\n    }\n}\n\n\n\n\npackage com.android_baklava.egg.landroid\n\nimport android.content.res.Resources\nimport android.os.Bundle\nimport android.util.Log\nimport androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent\nimport androidx.activity.enableEdgeToEdge\nimport androidx.compose.animation.AnimatedVisibility\nimport androidx.compose.animation.core.animateFloatAsState\nimport androidx.compose.animation.core.withInfiniteAnimationFrameNanos\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.gestures.awaitFirstDown\nimport androidx.compose.foundation.gestures.forEachGesture\nimport androidx.compose.foundation.gestures.rememberTransformableState\nimport androidx.compose.foundation.gestures.transformable\nimport androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.BoxWithConstraints\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.WindowInsets\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.safeContent\nimport androidx.compose.foundation.layout.windowInsetsPadding\nimport androidx.compose.material.Text\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\nimport androidx.compose.runtime.MutableState\nimport androidx.compose.runtime.currentRecomposeScope\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableFloatStateOf\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.AbsoluteAlignment.Left\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.drawBehind\nimport androidx.compose.ui.geometry.Offset\nimport androidx.compose.ui.geometry.Rect\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.PathEffect\nimport androidx.compose.ui.graphics.drawscope.Stroke\nimport androidx.compose.ui.graphics.drawscope.translate\nimport androidx.compose.ui.input.pointer.PointerEvent\nimport androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.text.TextStyle\nimport androidx.compose.ui.text.font.FontFamily\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.tooling.preview.Devices\nimport androidx.compose.ui.tooling.preview.Preview\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\nimport androidx.core.math.MathUtils.clamp\nimport androidx.lifecycle.Lifecycle\nimport androidx.lifecycle.lifecycleScope\nimport androidx.lifecycle.repeatOnLifecycle\nimport androidx.window.layout.FoldingFeature\nimport androidx.window.layout.WindowInfoTracker\nimport com.android_baklava.egg.ComponentActivationActivity\nimport com.dede.basic.utils.DessertUtils\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch\nimport java.lang.Float.max\nimport java.lang.Float.min\nimport java.util.Calendar\nimport java.util.GregorianCalendar\nimport kotlin.math.absoluteValue\nimport kotlin.math.floor\nimport kotlin.math.sqrt\nimport kotlin.random.Random\n\nenum class RandomSeedType {\n    Fixed,\n    Daily,\n    Evergreen,\n}\n\nconst val TEST_UNIVERSE = false\n\nval RANDOM_SEED_TYPE = RandomSeedType.Daily\n\nconst val FIXED_RANDOM_SEED = 5038L\nconst val DEFAULT_CAMERA_ZOOM = 1f\nconst val MIN_CAMERA_ZOOM = 250f / UNIVERSE_RANGE // 0.0025f\nconst val MAX_CAMERA_ZOOM = 5f\nvar TOUCH_CAMERA_PAN = false\nvar TOUCH_CAMERA_ZOOM = false\nvar DYNAMIC_ZOOM = false\n\nfun dailySeed(): Long {\n    val today = GregorianCalendar()\n    return today.get(Calendar.YEAR) * 10_000L +\n        today.get(Calendar.MONTH) * 100L +\n        today.get(Calendar.DAY_OF_MONTH)\n}\n\nfun randomSeed(): Long {\n    return when (RANDOM_SEED_TYPE) {\n        RandomSeedType.Fixed -> FIXED_RANDOM_SEED\n        RandomSeedType.Daily -> dailySeed()\n        else -> Random.Default.nextLong().mod(10_000_000).toLong()\n    }.absoluteValue\n}\n\nfun getDessertCode(): String = DessertUtils.getDessertCode()\n//    when (Build.VERSION.SDK_INT) {\n//        Build.VERSION_CODES.LOLLIPOP -> \"LMP\"\n//        Build.VERSION_CODES.LOLLIPOP_MR1 -> \"LM1\"\n//        Build.VERSION_CODES.M -> \"MNC\"\n//        Build.VERSION_CODES.N -> \"NYC\"\n//        Build.VERSION_CODES.N_MR1 -> \"NM1\"\n//        Build.VERSION_CODES.O -> \"OC\"\n//        Build.VERSION_CODES.P -> \"PIE\"\n//        Build.VERSION_CODES.Q -> \"QT\"\n//        Build.VERSION_CODES.R -> \"RVC\"\n//        Build.VERSION_CODES.S -> \"SC\"\n//        Build.VERSION_CODES.S_V2 -> \"SC2\"\n//        Build.VERSION_CODES.TIRAMISU -> \"TM\"\n//        Build.VERSION_CODES.UPSIDE_DOWN_CAKE -> \"UDC\"\n//        Build.VERSION_CODES.VANILLA_ICE_CREAM -> \"VIC\"\n//        else -> if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n//            Build.VERSION.RELEASE_OR_CODENAME.replace(Regex(\"[a-z]*\"), \"\")\n//        } else {\n//            throw IllegalStateException(\"getDessertCode, Build SDK: %d\".format(Build.VERSION.SDK_INT))\n//        }\n//    }\n\nfun getSystemDesignation(universe: Universe): String {\n    return \"${getDessertCode()}-${universe.randomSeed % 100_000}\"\n}\n\nval DEBUG_TEXT = mutableStateOf(\"Hello Universe\")\nconst val SHOW_DEBUG_TEXT = false\n\n@Composable\nfun DebugText(text: MutableState<String>) {\n    if (SHOW_DEBUG_TEXT) {\n        Text(\n            modifier = Modifier.fillMaxWidth().border(0.5.dp, color = Color.Yellow).padding(2.dp),\n            fontFamily = FontFamily.Monospace,\n            fontWeight = FontWeight.Medium,\n            fontSize = 9.sp,\n            color = Color.Yellow,\n            text = text.value,\n        )\n    }\n}\n\n@Composable\nfun Telemetry(universe: Universe, showControls: Boolean) {\n    var topVisible by remember { mutableStateOf(false) }\n    var bottomVisible by remember { mutableStateOf(false) }\n\n    var catalogFontSize by remember { mutableStateOf(9.sp) }\n\n    val textStyle =\n        TextStyle(\n            fontFamily = FontFamily.Monospace,\n            fontWeight = FontWeight.Medium,\n            fontSize = 12.sp,\n            letterSpacing = 1.sp,\n            lineHeight = 12.sp,\n        )\n\n    LaunchedEffect(\"blah\") {\n        delay(1000)\n        bottomVisible = true\n        topVisible = true\n    }\n\n    val explored = universe.planets.filter { it.explored }\n\n    // TODO: Narrow the scope of invalidation here to the specific data needed;\n    // the behavior below mimics the previous implementation of a snapshot ticker value\n    val recomposeScope = currentRecomposeScope\n    Telescope(universe) { recomposeScope.invalidate() }\n\n    BoxWithConstraints(\n        modifier =\n            Modifier.fillMaxSize().padding(6.dp).windowInsetsPadding(WindowInsets.safeContent)\n    ) {\n        val wide = maxWidth > maxHeight\n        Column(\n            modifier =\n                Modifier.align(if (wide) Alignment.BottomEnd else Alignment.BottomStart)\n                    .fillMaxWidth(if (wide) 0.45f else 1.0f)\n        ) {\n            val autopilotEnabled = universe.ship.autopilot?.enabled == true\n            if (autopilotEnabled) {\n                universe.ship.autopilot?.let { autopilot ->\n                    AnimatedVisibility(\n                        modifier = Modifier,\n                        visible = bottomVisible,\n                        enter = flickerFadeIn,\n                    ) {\n                        Text(\n                            style = textStyle,\n                            color = Colors.Autopilot,\n                            modifier = Modifier.align(Left),\n                            text = autopilot.telemetry,\n                        )\n                    }\n                }\n            }\n\n            Row(modifier = Modifier.padding(top = 6.dp)) {\n                AnimatedVisibility(\n                    modifier = Modifier.weight(1f),\n                    visible = bottomVisible,\n                    enter = flickerFadeIn,\n                ) {\n                    Text(\n                        style = textStyle,\n                        color = Colors.Console,\n                        text =\n                            with(universe.ship) {\n                                val closest = universe.closestPlanet()\n                                val distToClosest =\n                                    ((closest.pos - pos).mag() - closest.radius).toInt()\n                                listOfNotNull(\n                                        landing?.let {\n                                            \"LND: ${it.planet.name.uppercase()}\\n\" +\n                                                \"JOB: ${it.text.uppercase()}\"\n                                        }\n                                            ?: if (distToClosest < 10_000) {\n                                                \"ALT: $distToClosest\"\n                                            } else null,\n                                        \"THR: %.0f%%\".format(thrust.mag() * 100f),\n                                        \"POS: %s\".format(pos.str(\"%+7.0f\")),\n                                        \"VEL: %.0f\".format(velocity.mag()),\n                                    )\n                                    .joinToString(\"\\n\")\n                            },\n                    )\n                }\n\n                if (showControls) {\n                    AnimatedVisibility(\n                        visible = bottomVisible,\n                        enter = flickerFadeInAfterDelay(500),\n                    ) {\n                        ConsoleButton(\n                            textStyle = textStyle,\n                            color = Colors.Console,\n                            bgColor = if (autopilotEnabled) Colors.Autopilot else Color.Transparent,\n                            borderColor = Colors.Console,\n                            text = \"AUTO\",\n                        ) {\n                            universe.ship.autopilot?.let {\n                                it.enabled = !it.enabled\n                                DYNAMIC_ZOOM = it.enabled\n                                if (!it.enabled) universe.ship.thrust = Vec2.Zero\n                            }\n                        }\n                    }\n                }\n            }\n        }\n\n        AnimatedVisibility(\n            modifier = Modifier.align(Alignment.TopStart),\n            visible = topVisible,\n            enter = flickerFadeInAfterDelay(1000),\n        ) {\n            Text(\n                style = textStyle,\n                fontSize = catalogFontSize,\n                lineHeight = catalogFontSize,\n                letterSpacing = 1.sp,\n                color = Colors.Console,\n                onTextLayout = { textLayoutResult ->\n                    if (textLayoutResult.didOverflowHeight) {\n                        catalogFontSize = 8.sp\n                    }\n                },\n                text =\n                    (with(universe.star) {\n                            listOf(\n                                \"  STAR: $name (${getSystemDesignation(universe)})\",\n                                \" CLASS: ${cls.name}\",\n                                \"RADIUS: ${radius.toInt()}\",\n                                \"  MASS: %.3g\".format(mass),\n                                \"BODIES: ${explored.size} / ${universe.planets.size}\",\n                                \"\",\n                            )\n                        } +\n                            explored\n                                .map {\n                                    listOf(\n                                        \"  BODY: ${it.name}\",\n                                        \"  TYPE: ${it.description.capitalize()}\",\n                                        \"  ATMO: ${it.atmosphere.capitalize()}\",\n                                        \" FAUNA: ${it.fauna.capitalize()}\",\n                                        \" FLORA: ${it.flora.capitalize()}\",\n                                        \"\",\n                                    )\n                                }\n                                .flatten())\n                        .joinToString(\"\\n\"),\n\n                // TODO: different colors, highlight latest discovery\n            )\n        }\n    }\n}\n\nclass MainActivity : ComponentActivity() {\n    private var notifier: UniverseProgressNotifier? = null\n    private var foldState = mutableStateOf<FoldingFeature?>(null)\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\n        onWindowLayoutInfoChange()\n\n        enableEdgeToEdge()\n\n        val universe = Universe(namer = Namer(resources), randomSeed = randomSeed())\n\n        if (TEST_UNIVERSE) {\n            universe.initTest()\n        } else {\n            universe.initRandom()\n        }\n\n        ComponentActivationActivity.lockUnlockComponents(applicationContext)\n\n        // set up the autopilot in case we need it\n        val autopilot = Autopilot(universe.ship, universe)\n        universe.ship.autopilot = autopilot\n        universe.add(autopilot)\n        autopilot.enabled = false\n\n        notifier = UniverseProgressNotifier(this, universe)\n\n        setContent {\n            Spaaaace(modifier = Modifier.fillMaxSize(), u = universe, foldState = foldState)\n            DebugText(DEBUG_TEXT)\n\n            val minRadius = 50.dp.toLocalPx()\n            val maxRadius = 100.dp.toLocalPx()\n            FlightStick(\n                modifier = Modifier.fillMaxSize(),\n                minRadius = minRadius,\n                maxRadius = maxRadius,\n                color = Color.Green,\n            ) { vec ->\n                (universe.follow as? Spacecraft)?.let { ship ->\n                    if (vec == Vec2.Zero) {\n                        ship.thrust = Vec2.Zero\n                    } else {\n                        val a = vec.angle()\n                        ship.angle = a\n\n                        val m = vec.mag()\n                        if (m < minRadius) {\n                            // within this radius, just reorient\n                            ship.thrust = Vec2.Zero\n                        } else {\n                            ship.thrust =\n                                Vec2.makeWithAngleMag(\n                                    a,\n                                    lexp(minRadius, maxRadius, m).coerceIn(0f, 1f),\n                                )\n                        }\n                    }\n                }\n            }\n            Telemetry(universe, true)\n        }\n    }\n\n    private fun onWindowLayoutInfoChange() {\n        val windowInfoTracker = WindowInfoTracker.getOrCreate(this@MainActivity)\n\n        lifecycleScope.launch(Dispatchers.Main) {\n            lifecycle.repeatOnLifecycle(Lifecycle.State.STARTED) {\n                windowInfoTracker.windowLayoutInfo(this@MainActivity).collect { layoutInfo ->\n                    foldState.value =\n                        layoutInfo.displayFeatures.filterIsInstance<FoldingFeature>().firstOrNull()\n                    Log.v(\"Landroid\", \"fold updated: $foldState\")\n                }\n            }\n        }\n    }\n\n    override fun onDestroy() {\n        notifier?.cancel()\n        DYNAMIC_ZOOM = false\n        super.onDestroy()\n    }\n}\n\n@Preview(name = \"phone\", device = Devices.PHONE)\n@Preview(name = \"fold\", device = Devices.FOLDABLE)\n@Preview(name = \"tablet\", device = Devices.TABLET)\n@Composable\nfun MainActivityPreview() {\n    val universe = Universe(namer = Namer(Resources.getSystem()), randomSeed = randomSeed())\n\n    universe.initTest()\n\n    Spaaaace(modifier = Modifier.fillMaxSize(), universe)\n    DebugText(DEBUG_TEXT)\n    Telemetry(universe, true)\n}\n\n@Composable\nfun FlightStick(\n    modifier: Modifier,\n    minRadius: Float = 0f,\n    maxRadius: Float = 1000f,\n    color: Color = Color.Green,\n    onStickChanged: (vector: Vec2) -> Unit,\n) {\n    val origin = remember { mutableStateOf(Vec2.Zero) }\n    val target = remember { mutableStateOf(Vec2.Zero) }\n\n    Box(\n        modifier =\n            modifier\n                .pointerInput(Unit) {\n                    forEachGesture {\n                        awaitPointerEventScope {\n                            // ACTION_DOWN\n                            val down = awaitFirstDown(requireUnconsumed = false)\n                            origin.value = down.position\n                            target.value = down.position\n\n                            do {\n                                // ACTION_MOVE\n                                val event: PointerEvent = awaitPointerEvent()\n                                target.value = event.changes[0].position\n\n                                onStickChanged(target.value - origin.value)\n                            } while (\n                                !event.changes.any { it.isConsumed } &&\n                                    event.changes.count { it.pressed } == 1\n                            )\n\n                            // ACTION_UP / CANCEL\n                            target.value = Vec2.Zero\n                            origin.value = Vec2.Zero\n\n                            onStickChanged(Vec2.Zero)\n                        }\n                    }\n                }\n                .drawBehind {\n                    if (origin.value != Vec2.Zero) {\n                        val delta = target.value - origin.value\n                        val mag = min(maxRadius, delta.mag())\n                        val r = max(minRadius, mag)\n                        val a = delta.angle()\n                        drawCircle(\n                            color = color,\n                            center = origin.value,\n                            radius = r,\n                            style =\n                                Stroke(\n                                    width = 2f,\n                                    pathEffect =\n                                        if (mag < minRadius)\n                                            PathEffect.dashPathEffect(\n                                                floatArrayOf(this.density * 1f, this.density * 2f)\n                                            )\n                                        else null,\n                                ),\n                        )\n                        drawLine(\n                            color = color,\n                            start = origin.value,\n                            end = origin.value + Vec2.makeWithAngleMag(a, mag),\n                            strokeWidth = 2f,\n                        )\n                    }\n                }\n    )\n}\n\n@Composable\nfun Spaaaace(\n    modifier: Modifier,\n    u: Universe,\n    foldState: MutableState<FoldingFeature?> = mutableStateOf(null),\n) {\n    LaunchedEffect(u) {\n        while (true) withInfiniteAnimationFrameNanos { frameTimeNanos -> u.step(frameTimeNanos) }\n    }\n\n    var cameraZoom by remember { mutableFloatStateOf(DEFAULT_CAMERA_ZOOM) }\n    var cameraOffset by remember { mutableStateOf(Offset.Zero) }\n\n    val transformableState =\n        rememberTransformableState { zoomChange, offsetChange, rotationChange ->\n            if (TOUCH_CAMERA_PAN) cameraOffset += offsetChange / cameraZoom\n            if (TOUCH_CAMERA_ZOOM)\n                cameraZoom = clamp(cameraZoom * zoomChange, MIN_CAMERA_ZOOM, MAX_CAMERA_ZOOM)\n        }\n\n    var canvasModifier = modifier\n\n    if (TOUCH_CAMERA_PAN || TOUCH_CAMERA_ZOOM) {\n        canvasModifier = canvasModifier.transformable(transformableState)\n    }\n\n    val halfFolded = foldState.value?.let { it.state == FoldingFeature.State.HALF_OPENED } ?: false\n    val horizontalFold =\n        foldState.value?.let { it.orientation == FoldingFeature.Orientation.HORIZONTAL } ?: false\n\n    val centerFracX: Float by\n        animateFloatAsState(if (halfFolded && !horizontalFold) 0.25f else 0.5f, label = \"centerX\")\n    val centerFracY: Float by\n        animateFloatAsState(if (halfFolded && horizontalFold) 0.25f else 0.5f, label = \"centerY\")\n\n    UniverseCanvas(u, canvasModifier) { u ->\n        drawRect(Colors.Eigengrau, Offset.Zero, size)\n\n        val closest = u.closestPlanet()\n        val distToNearestSurf = max(0f, (u.ship.pos - closest.pos).mag() - closest.radius * 1.2f)\n        //        val normalizedDist = clamp(distToNearestSurf, 50f, 50_000f) / 50_000f\n        val targetZoom =\n            if (DYNAMIC_ZOOM) {\n                clamp(500f / distToNearestSurf, MIN_CAMERA_ZOOM, MAX_CAMERA_ZOOM)\n            } else {\n                DEFAULT_CAMERA_ZOOM\n            }\n        if (!TOUCH_CAMERA_ZOOM) {\n            cameraZoom = expSmooth(cameraZoom, targetZoom, dt = u.dt, speed = 1.5f)\n        }\n\n        if (!TOUCH_CAMERA_PAN) cameraOffset = (u.follow?.pos ?: Vec2.Zero) * -1f\n\n        // cameraZoom: metersToPixels\n        // visibleSpaceSizeMeters: meters\n        // cameraOffset: meters \u2248 vector pointing from ship to (0,0) (e.g. -pos)\n        val visibleSpaceSizeMeters = size / cameraZoom // meters x meters\n        val visibleSpaceRectMeters =\n            Rect(\n                -cameraOffset -\n                    Offset(\n                        visibleSpaceSizeMeters.width * centerFracX,\n                        visibleSpaceSizeMeters.height * centerFracY,\n                    ),\n                visibleSpaceSizeMeters,\n            )\n\n        var gridStep = 1000f\n        while (gridStep * cameraZoom < 32.dp.toPx()) gridStep *= 10\n\n        DEBUG_TEXT.value =\n            (\"SIMULATION //\\n\" +\n                // \"normalizedDist=${normalizedDist} \\n\" +\n                \"entities: ${u.entities.size} // \" +\n                \"zoom: ${\"%.4f\".format(cameraZoom)}x // \" +\n                \"fps: ${\"%3.0f\".format(1f / u.dt)} \" +\n                \"dt: ${u.dt}\\n\" +\n                ((u.follow as? Spacecraft)?.let {\n                    \"ship: p=%s v=%7.2f a=%6.3f t=%s\\n\"\n                        .format(\n                            it.pos.str(\"%+7.1f\"),\n                            it.velocity.mag(),\n                            it.angle,\n                            it.thrust.str(\"%+5.2f\"),\n                        )\n                } ?: \"\") +\n                \"star: '${u.star.name}' designation=UDC-${u.randomSeed % 100_000} \" +\n                \"class=${u.star.cls.name} r=${u.star.radius.toInt()} m=${u.star.mass}\\n\" +\n                \"planets: ${u.planets.size}\\n\" +\n                u.planets.joinToString(\"\\n\") {\n                    val range = (u.ship.pos - it.pos).mag()\n                    val vorbit = sqrt(GRAVITATION * it.mass / range)\n                    val vescape = sqrt(2 * GRAVITATION * it.mass / it.radius)\n                    \" * ${it.name}:\\n\" +\n                        if (it.explored) {\n                            \"   TYPE:  ${it.description.capitalize()}\\n\" +\n                                \"   ATMO:  ${it.atmosphere.capitalize()}\\n\" +\n                                \"   FAUNA: ${it.fauna.capitalize()}\\n\" +\n                                \"   FLORA: ${it.flora.capitalize()}\\n\"\n                        } else {\n                            \"   (Unexplored)\\n\"\n                        } +\n                        \"   orbit=${(it.pos - it.orbitCenter).mag().toInt()}\" +\n                        \" radius=${it.radius.toInt()}\" +\n                        \" mass=${\"%g\".format(it.mass)}\" +\n                        \" vel=${(it.speed).toInt()}\" +\n                        \" // range=${\"%.0f\".format(range)}\" +\n                        \" vorbit=${vorbit.toInt()} vescape=${vescape.toInt()}\"\n                })\n\n        zoom(cameraZoom) {\n            // All coordinates are space coordinates now.\n\n            translate(\n                -visibleSpaceRectMeters.center.x + size.width * 0.5f,\n                -visibleSpaceRectMeters.center.y + size.height * 0.5f,\n            ) {\n                // debug outer frame\n                // drawRect(\n                //     Colors.Eigengrau2,\n                //     visibleSpaceRectMeters.topLeft,\n                //     visibleSpaceRectMeters.size,\n                //     style = Stroke(width = 10f / cameraZoom)\n                // )\n\n                var x = floor(visibleSpaceRectMeters.left / gridStep) * gridStep\n                while (x < visibleSpaceRectMeters.right) {\n                    drawLine(\n                        color = Colors.Eigengrau2,\n                        start = Offset(x, visibleSpaceRectMeters.top),\n                        end = Offset(x, visibleSpaceRectMeters.bottom),\n                        strokeWidth = (if ((x % (gridStep * 10) == 0f)) 3f else 1.5f) / cameraZoom,\n                    )\n                    x += gridStep\n                }\n\n                var y = floor(visibleSpaceRectMeters.top / gridStep) * gridStep\n                while (y < visibleSpaceRectMeters.bottom) {\n                    drawLine(\n                        color = Colors.Eigengrau2,\n                        start = Offset(visibleSpaceRectMeters.left, y),\n                        end = Offset(visibleSpaceRectMeters.right, y),\n                        strokeWidth = (if ((y % (gridStep * 10) == 0f)) 3f else 1.5f) / cameraZoom,\n                    )\n                    y += gridStep\n                }\n\n                this@zoom.drawUniverse(u)\n            }\n        }\n    }\n}\n\n\n\npackage com.android_baklava.egg.landroid\n\nimport kotlin.math.exp\nimport kotlin.math.pow\n\n/** smoothstep. Ken Perlin's version */\nfun smooth(x: Float): Float {\n    return x * x * x * (x * (x * 6 - 15) + 10)\n}\n\n/** Kind of like an inverted smoothstep, but */\nfun invsmoothish(x: Float): Float {\n    return 0.25f * ((2f * x - 1f).pow(5f) + 1f) + 0.5f * x\n}\n\n/** Compute the fraction that progress represents between start and end (inverse of lerp). */\nfun lexp(start: Float, end: Float, progress: Float): Float {\n    return (progress - start) / (end - start)\n}\n\n/** Exponentially smooth current toward target by a factor of speed. */\nfun expSmooth(current: Float, target: Float, dt: Float = 1f / 60, speed: Float = 5f): Float {\n    return current + (target - current) * (1 - exp(-dt * speed))\n}\n\npackage com.android_baklava.egg.landroid\n\nimport android.content.res.Resources\nimport com.android_baklava.egg.R\nimport kotlin.random.Random\n\nconst val SUFFIX_PROB = 0.75f\nconst val LETTER_PROB = 0.3f\nconst val NUMBER_PROB = 0.3f\nconst val RARE_PROB = 0.05f\n\nclass Namer(resources: Resources) {\n    private val planetDescriptors = Bag(resources.getStringArray(R.array.baklava_planet_descriptors))\n    private val lifeDescriptors = Bag(resources.getStringArray(R.array.baklava_life_descriptors))\n    private val anyDescriptors = Bag(resources.getStringArray(R.array.baklava_any_descriptors))\n    private val atmoDescriptors = Bag(resources.getStringArray(R.array.baklava_atmo_descriptors))\n\n    private val planetTypes = Bag(resources.getStringArray(R.array.baklava_planet_types))\n    private val constellations = Bag(resources.getStringArray(R.array.baklava_constellations))\n    private val constellationsRare = Bag(resources.getStringArray(R.array.baklava_constellations_rare))\n    private val suffixes = Bag(resources.getStringArray(R.array.baklava_star_suffixes))\n    private val suffixesRare = Bag(resources.getStringArray(R.array.baklava_star_suffixes_rare))\n\n    private val planetTable = RandomTable(0.75f to planetDescriptors, 0.25f to anyDescriptors)\n\n    private var lifeTable = RandomTable(0.75f to lifeDescriptors, 0.25f to anyDescriptors)\n\n    private var constellationsTable =\n        RandomTable(RARE_PROB to constellationsRare, 1f - RARE_PROB to constellations)\n\n    private var suffixesTable = RandomTable(RARE_PROB to suffixesRare, 1f - RARE_PROB to suffixes)\n\n    private var atmoTable = RandomTable(0.75f to atmoDescriptors, 0.25f to anyDescriptors)\n\n    private var delimiterTable =\n        RandomTable(\n            15f to \" \",\n            3f to \"-\",\n            1f to \"_\",\n            1f to \"/\",\n            1f to \".\",\n            1f to \"*\",\n            1f to \"^\",\n            1f to \"#\",\n            0.1f to \"(^*!%@##!!\",\n        )\n\n    private var activities = Bag(resources.getStringArray(R.array.baklava_activities))\n    private var floraGenericPlurals = Bag(resources.getStringArray(R.array.baklava_flora_generic_plurals))\n    private var faunaGenericPlurals = Bag(resources.getStringArray(R.array.baklava_fauna_generic_plurals))\n    private var atmoGenericPlurals = Bag(resources.getStringArray(R.array.baklava_atmo_generic_plurals))\n\n    fun describePlanet(rng: Random): String {\n        return planetTable.roll(rng).pull(rng) + \" \" + planetTypes.pull(rng)\n    }\n\n    fun describeLife(rng: Random): String {\n        return lifeTable.roll(rng).pull(rng)\n    }\n\n    fun nameSystem(rng: Random): String {\n        val parts = StringBuilder()\n        parts.append(constellationsTable.roll(rng).pull(rng))\n        if (rng.nextFloat() <= SUFFIX_PROB) {\n            parts.append(delimiterTable.roll(rng))\n            parts.append(suffixesTable.roll(rng).pull(rng))\n            if (rng.nextFloat() <= RARE_PROB) parts.append(' ').append(suffixesRare.pull(rng))\n        }\n        if (rng.nextFloat() <= LETTER_PROB) {\n            parts.append(delimiterTable.roll(rng))\n            parts.append('A' + rng.nextInt(0, 26))\n            if (rng.nextFloat() <= RARE_PROB) parts.append(delimiterTable.roll(rng))\n        }\n        if (rng.nextFloat() <= NUMBER_PROB) {\n            parts.append(delimiterTable.roll(rng))\n            parts.append(rng.nextInt(2, 5039))\n        }\n        return parts.toString()\n    }\n\n    fun describeAtmo(rng: Random): String {\n        return atmoTable.roll(rng).pull(rng)\n    }\n\n    fun floraPlural(rng: Random): String {\n        return floraGenericPlurals.pull(rng)\n    }\n\n    fun faunaPlural(rng: Random): String {\n        return faunaGenericPlurals.pull(rng)\n    }\n\n    fun atmoPlural(rng: Random): String {\n        return atmoGenericPlurals.pull(rng)\n    }\n\n    val TEMPLATE_REGEX = Regex(\"\"\"\\{(flora|fauna|planet|atmo)\\}\"\"\")\n\n    fun describeActivity(rng: Random, target: Planet?): String {\n        return activities.pull(rng).replace(TEMPLATE_REGEX) {\n            when (it.groupValues[1]) {\n                \"flora\" -> (target?.flora ?: \"SOME\") + \" \" + floraPlural(rng)\n                \"fauna\" -> (target?.fauna ?: \"SOME\") + \" \" + faunaPlural(rng)\n                \"atmo\" -> (target?.atmosphere ?: \"SOME\") + \" \" + atmoPlural(rng)\n                \"planet\" -> (target?.description ?: \"SOME BODY\") // once told me\n                else -> \"unknown template tag: ${it.groupValues[0]}\"\n            }\n        }\n    }\n}\n\npackage com.android_baklava.egg.landroid\n\nimport android.util.Log\nimport androidx.compose.ui.graphics.Path\nimport kotlin.math.cos\nimport kotlin.math.sin\n\nfun createPolygon(radius: Float, sides: Int): Path {\n    return Path().apply {\n        moveTo(radius, 0f)\n        val angleStep = PI2f / sides\n        for (i in 1 until sides) {\n            lineTo(radius * cos(angleStep * i), radius * sin(angleStep * i))\n        }\n        close()\n    }\n}\n\nfun createPolygonPoints(radius: Float, sides: Int): List<Vec2> {\n    val angleStep = PI2f / sides\n    return (0 until sides).map { i ->\n        Vec2(radius * cos(angleStep * i), radius * sin(angleStep * i))\n    }\n}\n\nfun createStar(radius1: Float, radius2: Float, points: Int): Path {\n    return Path().apply {\n        val angleStep = PI2f / points\n        moveTo(radius1, 0f)\n        lineTo(radius2 * cos(angleStep * (0.5f)), radius2 * sin(angleStep * (0.5f)))\n        for (i in 1 until points) {\n            lineTo(radius1 * cos(angleStep * i), radius1 * sin(angleStep * i))\n            lineTo(radius2 * cos(angleStep * (i + 0.5f)), radius2 * sin(angleStep * (i + 0.5f)))\n        }\n        close()\n    }\n}\n\nfun Path.parseSvgPathData(d: String) {\n    Regex(\"([A-Za-z])\\\\s*([-.,0-9e ]+)\").findAll(d.trim()).forEach {\n        val cmd = it.groups[1]!!.value\n        val args =\n            it.groups[2]?.value?.split(Regex(\"\\\\s+\"))?.map { v -> v.toFloat() } ?: emptyList()\n        // Log.d(\"Landroid\", \"cmd = $cmd, args = \" + args.joinToString(\",\"))\n        when (cmd) {\n            \"M\" -> moveTo(args[0], args[1])\n            \"C\" -> cubicTo(args[0], args[1], args[2], args[3], args[4], args[5])\n            \"L\" -> lineTo(args[0], args[1])\n            \"l\" -> relativeLineTo(args[0], args[1])\n            \"Z\" -> close()\n            else -> Log.v(\"Landroid\", \"unsupported SVG command: $cmd\")\n        }\n    }\n}\n\n\n\npackage com.android_baklava.egg.landroid\n\nimport androidx.collection.ArraySet\nimport androidx.compose.ui.util.fastForEach\nimport kotlinx.coroutines.DisposableHandle\nimport kotlin.random.Random\n\n// artificially speed up or slow down the simulation\nconst val TIME_SCALE = 1f // simulation seconds per wall clock second\n\n// if it's been over 1 real second since our last timestep, don't simulate that elapsed time.\n// this allows the simulation to \"pause\" when, for example, the activity pauses\nconst val MAX_VALID_DT = 1f\n\ninterface Entity {\n    // Integrate.\n    // Compute accelerations from forces, add accelerations to velocity, save old position,\n    // add velocity to position.\n    fun update(sim: Simulator, dt: Float)\n\n    // Post-integration step, after constraints are satisfied.\n    fun postUpdate(sim: Simulator, dt: Float)\n}\n\ninterface Removable {\n    fun canBeRemoved(): Boolean\n}\n\nclass Fuse(var lifetime: Float) : Removable {\n    fun update(dt: Float) {\n        lifetime -= dt\n    }\n    override fun canBeRemoved(): Boolean {\n        return lifetime < 0\n    }\n}\n\nopen class Body(var name: String = \"Unknown\") : Entity {\n    var pos = Vec2.Zero\n    var opos = Vec2.Zero\n    var velocity = Vec2.Zero\n\n    var mass = 0f\n    var angle = 0f\n    var radius = 0f\n\n    var collides = true\n\n    var omega: Float\n        get() = angle - oangle\n        set(value) {\n            oangle = angle - value\n        }\n\n    var oangle = 0f\n\n    override fun update(sim: Simulator, dt: Float) {\n        if (dt <= 0) return\n\n        // integrate velocity\n        val vscaled = velocity * dt\n        opos = pos\n        pos += vscaled\n\n        // integrate angular velocity\n        //        val wscaled = omega * timescale\n        //        oangle = angle\n        //        angle = (angle + wscaled) % PI2f\n    }\n\n    override fun postUpdate(sim: Simulator, dt: Float) {\n        if (dt <= 0) return\n        velocity = (pos - opos) / dt\n    }\n}\n\ninterface Constraint {\n    // Solve constraints. Pick up objects and put them where they are \"supposed\" to be.\n    fun solve(sim: Simulator, dt: Float)\n}\n\nopen class Container(val radius: Float) : Constraint {\n    private val list = ArraySet<Body>()\n    private val softness = 0.0f\n\n    override fun toString(): String {\n        return \"Container($radius)\"\n    }\n\n    fun add(p: Body) {\n        list.add(p)\n    }\n\n    fun remove(p: Body) {\n        list.remove(p)\n    }\n\n    override fun solve(sim: Simulator, dt: Float) {\n        for (p in list) {\n            if ((p.pos.mag() + p.radius) > radius) {\n                p.pos =\n                    p.pos * (softness) +\n                        Vec2.makeWithAngleMag(p.pos.angle(), radius - p.radius) * (1f - softness)\n            }\n        }\n    }\n}\n\nopen class Simulator(val randomSeed: Long) {\n    private var wallClockNanos: Long = 0L\n    var now: Float = 0f\n    var dt: Float = 0f\n    val rng = Random(randomSeed)\n    val entities = ArraySet<Entity>(1000)\n    val constraints = ArraySet<Constraint>(100)\n    private val simStepListeners = mutableListOf<() -> Unit>()\n\n    fun add(e: Entity) = entities.add(e)\n    fun remove(e: Entity) = entities.remove(e)\n    fun add(c: Constraint) = constraints.add(c)\n    fun remove(c: Constraint) = constraints.remove(c)\n\n    open fun updateAll(dt: Float, entities: ArraySet<Entity>) {\n        entities.forEach { it.update(this, dt) }\n    }\n\n    open fun solveAll(dt: Float, constraints: ArraySet<Constraint>) {\n        constraints.forEach { it.solve(this, dt) }\n    }\n\n    open fun postUpdateAll(dt: Float, entities: ArraySet<Entity>) {\n        entities.forEach { it.postUpdate(this, dt) }\n    }\n\n    fun step(nanos: Long) {\n        val firstFrame = (wallClockNanos == 0L)\n\n        dt = (nanos - wallClockNanos) / 1_000_000_000f * TIME_SCALE\n        this.wallClockNanos = nanos\n\n        // we start the simulation on the next frame\n        if (firstFrame || dt > MAX_VALID_DT) return\n\n        // simulation is running; we start accumulating simulation time\n        this.now += dt\n\n        val localEntities = ArraySet(entities)\n        val localConstraints = ArraySet(constraints)\n\n        // position-based dynamics approach:\n        // 1. apply acceleration to velocity, save positions, apply velocity to position\n        updateAll(dt, localEntities)\n\n        // 2. solve all constraints\n        solveAll(dt, localConstraints)\n\n        // 3. compute new velocities from updated positions and saved positions\n        postUpdateAll(dt, localEntities)\n\n        // 4. notify listeners that step is complete\n        simStepListeners.fastForEach { it.invoke() }\n    }\n\n    /**\n
